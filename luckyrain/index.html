  /* ---------- Charts ---------- */
  .chart{position:relative}
  .chart svg{display:block;width:100%;height:auto}
  .legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0 2px;font-size:12px;color:var(--ink-2)}

  .tip{position:fixed;pointer-events:none;background:var(--surface-1);border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.12);border-radius:10px;padding:8px 11px;font-size:12px;z-index:100;display:none;min-width:130px}

  }
</style>

    organicPct:15,           // organic/brand FTDs as % of paid FTDs — GLOBAL, not a per-GEO lever
    retMultAff:1.05,         // retention quality vs GEO base: affiliate traffic (high intent)

  const mixSum=games.reduce((s,g)=>s+mval(g),0)||1;
  for(const g of games){

function marketingSpend(g, t, mktMult, glob, thr){ // t is 1-based month; thr = guard throttle per month (0..1), optional

  const E = (glob && glob.expMonth && glob.expGrowth) ? Math.max(+glob.expMonth, g.mkStart+12) : 0;

      agg.turnover[t]+=turnover; agg.ggr[t]+=ggr; agg.bonus[t]+=bonus+jackpot; agg.ngr[t]+=ngr;
      agg.content[t]+=content; agg.pay[t]+=pay; agg.tax[t]+=tax; agg.affrs[t]+=affrs;
      agg.contribution[t]+=contribution; agg.marketing[t]+=spend[t]; agg.ftds[t]+=ftds[t]; agg.actives[t]+=actives[t];
      agg.deposits[t]+=deposits; agg.withdrawals[t]+=withdrawals;
      agg.reserveIn[t]+=deposits*((g.resPct||0)/100);
    }
    // game split for this geo (constant proportions)
    const ghSplit = gameHourly(A.games, 1, g.mixOverride);
    for(const p of ghSplit.per){
      const share = ghSplit.ggr>0 ? p.ggr/ghSplit.ggr : 0;
      for(let t=0;t<N;t++) ggrByGame[p.id][t]+= row.ggr[t]*share;
    }

    /* ---- unit economics per FTD, channel-blended ---- */
    const fTot={}; let fSum=0;
    CHANNELS.forEach(c=>{ fTot[c.key]=fCh[c.key].reduce((a,b)=>a+b,0); fSum+=fTot[c.key]; });
    const w={}; CHANNELS.forEach(c=>w[c.key]=fSum>0?fTot[c.key]/fSum:0.25);
    row.r=Array.from({length:N},(_,a2)=>CHANNELS.reduce((sm,c)=>sm+w[c.key]*rCh[c.key][a2],0));
    const spendTot=spend.reduce((a,b)=>a+b,0);
    const effCAC = fSum>0 ? spendTot/fSum : 0;   // paid spend ÷ ALL new depositors (incl. RS + organic)
    const ngrPA = ggrPerActive*(1-bpG);
    const varPA = ngrPA - ggrPerActive*contentPct
      - (ggrPerActive/hold)*(g.feeDep/100) - Math.max(0,ggrPerActive/hold-ggrPerActive)*(g.feeWd/100)
      - ggrPerActive*(g.tax/100);
    const cum=[]; let acc=0, payback=null, ltv36=0, ltv6=0, ltv12=0;
    for(let a2=0;a2<N;a2++){
      let c_a=0, n_a=0;
      for(const c of CHANNELS){
        const rr=w[c.key]*rCh[c.key][a2];
        c_a += rr*(varPA - (c.key==="affrs"? ngrPA*affRS : 0));
        n_a += rr*ngrPA;
      }
      acc+=c_a; cum.push(acc);
      if(a2<36)ltv36+=n_a; if(a2<6)ltv6+=n_a; if(a2<12)ltv12+=n_a;
      if(payback===null && acc>=effCAC) payback=a2;
    }
    row.unit={effCAC, contribPerFTD: cum.length?cum[0]:0, cumContrib:cum, payback, ltvNGR36:ltv36, ltvNGR6:ltv6, ltvNGR12:ltv12,
      ltvCac: effCAC>0? cum[Math.min(36,N)-1]/effCAC : Infinity };
    perGeo.push(row);
  }

  /* ---- COGS, Opex, EBITDA, EBIT ---- */
  const Z=()=>Array(N).fill(0);
  const opex={ personnel:Z(), heads:Z(), hosting:Z(), software:Z(), aggregator:Z(), antifraud:Z(),
    legal:Z(), office:Z(), travel:Z(), gaMisc:Z(), contingency:Z(),
    platformCapex:Z(), amort:Z(), licAnnual:Z(), licUpfront:Z(), setup:Z(), kyc:Z(), support:Z(),
    crmTools:Z(), brand:Z(), fraud:Z() };
  const grossProfit=Z(), mktTotal=Z(), contribAfterMkt=Z(), opexTotal=Z(),
        ebitda=Z(), ebit=Z(), corpTax=Z(), netIncome=Z(), cash=Z(), netcf=Z(), cumEbitdaArr=Z(),
        reserveBal=Z(), reserveDelta=Z(), cogsTotal=Z();
  // Funding rounds (migration: old exports carry only startingCapital)
  if(!A.funding || !A.funding.length)
    A.funding=[{name:"Founding capital", month:1, amount:A.meta.startingCapital||0, note:""}];
  const fundingIn=Z();
  for(const f of A.funding){ const m=Math.round(+f.month)-1; if(m>=0&&m<N) fundingIn[m]+=(+f.amount||0); }
  // pre-launch setup period (month 0): seed round in, setup budget out, before M1
  const seedIn=A.funding.filter(f=>Math.round(+f.month)<=0).reduce((a,f)=>a+(+f.amount||0),0);
  const setupInPlan=!!(A.setup&&A.setup.inPlan), setupCost=setupInPlan?0:setupTotal(A);
  const L0=launchM()-1;
  const totalFunding=fundingIn.reduce((a,b)=>a+b,0)+seedIn;
  let bal=seedIn-setupCost, cumOp=-setupCost, maxNeed=setupCost, breakeven=null, minCash=Infinity, minCashMonth=0, cumEbitda=0, cumTaxable=0;
  const openCash=bal;
  const W=A.wc||{}, bankroll=Z(), floatW=Z(), freeCash=Z();
  const brAt=(t1,ggrMonth)=>{ if(W.brEnabled===false) return 0;
    if(+W.brDynFrom && t1>=+W.brDynFrom) return Math.max(+W.br3||0, (+W.brDynDays||0)*ggrMonth/30);
    if(t1>=(+W.br3From||9999)) return +W.br3||0; if(t1>=(+W.br2From||9999)) return +W.br2||0; if(t1>=(+W.br1From||9999)) return +W.br1||0; return 0; };
  let minFree=Infinity, minFreeMonth=0, minCashGross=Infinity;
  const K=Math.max(0,Math.round(A.wc.reserveMonths||0));
  for(let t=0;t<N;t++){
    const per=personnelAt(A,t+1,S.teamMult);
    opex.personnel[t]=per.cost; opex.heads[t]=per.heads;
    opex.hosting[t]=hostingAt(A.cogs,t+1);
    opex.software[t]=(t+1>=A.cogs.softwareStartMonth)?A.cogs.softwareMonthly:0;
    opex.aggregator[t]=(t+1>=(A.cogs.aggregatorStartMonth||1))?A.cogs.aggregatorMin:0;
    const live=(t+1>=L0+1);   // running costs start at launch; the setup months are budgeted line by line
    opex.antifraud[t]=live?A.cogs.antifraudMonthly:0;
    opex.legal[t]=live?A.ga.legal:0; opex.office[t]=live?A.ga.office:0; opex.travel[t]=live?A.ga.travel:0; opex.gaMisc[t]=live?A.ga.misc:0;
    // pre-launch setup inside the plan: company purchase = investment (with licence upfronts); the rest is opex spread over the setup months

    opex.platformCapex[t]=platformCapexAt(A.platform,t+1);
    opex.amort[t]=amortAt(A.platform,t+1);
    const lc=licenseCost(A.licenses,t+1);
    const cc=certCost(A.certs,t+1);
    opex.licAnnual[t]=lc.annual+cc.monthly; opex.licUpfront[t]=lc.upfront+cc.upfront;
    // pre-launch setup inside the plan: company purchase = investment (with licence upfronts); the rest is opex spread over the setup months
    opex.setup[t]=0;
    if(setupInPlan && A.setup.enabled && t<Math.max(1,+A.setup.months||3)){ const nS=Math.max(1,+A.setup.months||3);
      (A.setup.items||[]).forEach(it=>{ if(/purchase|acqui/i.test(it.name||"")){ if(t===0) opex.licUpfront[t]+=(+it.amount||0); } else opex.setup[t]+=(+it.amount||0)/nS; }); }
    opex.kyc[t]=agg.ftds[t]*A.global.kycPerFTD;
    opex.support[t]=agg.actives[t]*A.global.supportPerActive;
    opex.crmTools[t]=live?A.global.crmMonthly+A.global.toolsMonthly:0;
    opex.brand[t]= (t+1>=A.global.brandStartMonth)? Math.max(A.global.brandMonthly*S.mktMult, (t+1>=(+A.global.brandPctStart||9999)? (+A.global.brandPct||0)/100*agg.marketing[t] : 0)) : 0;
    opex.fraud[t]=agg.ggr[t]*(A.global.fraudPctGGR/100);
    // COGS: direct cost of delivering the gaming service
    cogsTotal[t]=agg.content[t]+agg.pay[t]+agg.tax[t]+opex.kyc[t]
      +opex.hosting[t]+opex.software[t]+opex.aggregator[t];
    grossProfit[t]=agg.ngr[t]-cogsTotal[t];
    // Marketing all-in
    mktTotal[t]=agg.marketing[t]+agg.affrs[t]+opex.brand[t];
    contribAfterMkt[t]=grossProfit[t]-mktTotal[t];
    // Opex below the line
    const opexSub=opex.personnel[t]+opex.setup[t]+opex.support[t]+opex.crmTools[t]+opex.antifraud[t]
      +opex.legal[t]+opex.office[t]+opex.travel[t]+opex.gaMisc[t]
      +opex.licAnnual[t]+opex.fraud[t];
    opex.contingency[t]=(opexSub-opex.setup[t])*((A.ga.contingencyPct||0)/100);   // setup budget carries its own contingency line
    opexTotal[t]=opexSub+opex.contingency[t];
    ebitda[t]=contribAfterMkt[t]-opexTotal[t];
    ebit[t]=ebitda[t]-opex.amort[t];
    cumTaxable+=ebit[t]; corpTax[t]=(cumTaxable>0? Math.min(Math.max(0,ebit[t]),cumTaxable)*((A.corpTaxPct||0)/100) : 0);  // 15% with loss carryforward
    netIncome[t]=ebit[t]-corpTax[t];
    cumEbitda+=ebitda[t]; cumEbitdaArr[t]=cumEbitda;
    // Working capital: rolling PSP reserve (held K months, then released)
    const released = (t-K>=0)? agg.reserveIn[t-K] : 0;
    reserveDelta[t]=agg.reserveIn[t]-released;
    reserveBal[t]=(t>0?reserveBal[t-1]:0)+reserveDelta[t];
    netcf[t]=ebitda[t]-corpTax[t]-opex.platformCapex[t]-opex.licUpfront[t]-reserveDelta[t];
    cumOp+=netcf[t]; if(-cumOp>maxNeed)maxNeed=-cumOp;   // true external cash the business consumes
    bal+=netcf[t]+fundingIn[t]; cash[t]=bal;
    // working capital held, not spent: house bankroll (pays winning streaks / max wins) + hot-wallet float (W days of withdrawals)
    bankroll[t]=brAt(t+1, agg.ggr[t]);
    floatW[t]=(W.floatDays==null?0:+W.floatDays)*agg.withdrawals[t]/30;
    freeCash[t]=bal-bankroll[t]-floatW[t];
    if(-(cumOp-bankroll[t]-floatW[t])>maxNeed) maxNeed=-(cumOp-bankroll[t]-floatW[t]);   // peak need includes cash that must be held
    if(bal<minCashGross) minCashGross=bal;
    if(freeCash[t]<minCash){minCash=freeCash[t];minCashMonth=t;}   // lowest-cash KPI = FREE cash
  }
  for(let t=0;t<N;t++){ if(ebitda[t]>0 && (t===N-1||ebitda[t+1]>0)){breakeven=t;break;} }
  const peakNeed = Math.max(0, maxNeed);

  return {N, perGeo, agg, opex, ebitda, ebit, corpTax, netIncome, cumEbitdaArr, netcf, cash, breakeven, minCash, minCashMonth, peakNeed, ggrByGame, fundingIn, totalFunding, seedIn, setupCost, openCash, bankroll, floatW, freeCash, minCashGross,
    grossProfit, mktTotal, contribAfterMkt, opexTotal, cogsTotal, reserveBal, reserveDelta,
    bonusPct, affRS, channels:CHANNELS.map(c=>({key:c.key,name:c.name}))};
}

/* ============================================================
   RAIN B2C (PREDICTION MARKETS) ENGINE + GROUP CONSOLIDATION
   Parallel model to the casino engine above. Pure functions.
   ============================================================ */
function pmDefaults(){
  return {
    seedUsers:12500, spend1:200000,
    growth:[{m:6,pct:21},{m:6,pct:8},{m:6,pct:8},{m:6,pct:2},{m:12,pct:1}],
    organic0:20, organicStep1:1, organicStep2:0.5,
    ltvCore:175, ltvHV:400, hvSharePct:10, lifetimeMonths:24,
    cpaCore:75, cpaHV:200,
    takeRatePct:1.795, overallFeePct:3.625,
    cogsPctNPR:8, buildersPctVol:0.1, brand1:15000, brandGrowthPct:5,
    tvl0:10000000, tvlCapturePct:20, treasuryYieldPct:1.7,
    dutyPct:0.15,
    licence:{upfront:39000, annual:129000},
    psp:{feePct:0.5, absorbedPct:0, depositMultiple:2},
    personnel:{prodEng:[40000,75000,130000]}
  };
}
function sharedDefaults(){
  return {
    mgmtCompliance:[60000,90000,140000],
    externalProviders:[25000,35000,45000],
    localOps:[54000,40000,30000]
  };
}
function computePM(A){
  if(!A.pm) A.pm=pmDefaults();
  if(!A.pm.personnel) A.pm.personnel={prodEng:[40000,75000,130000]};
  const p=A.pm, N=A.meta.months;
  const hv=p.hvSharePct/100;
  const ltv=p.ltvHV*hv+p.ltvCore*(1-hv), cpa=p.cpaHV*hv+p.cpaCore*(1-hv);
  const marpu=ltv/Math.max(1,p.lifetimeMonths), churn=1/Math.max(1,p.lifetimeMonths);
  const Z=()=>Array(N).fill(0);
  const spend=Z(),organic=Z(),newU=Z(),actives=Z(),npr=Z(),vol=Z(),fees=Z(),deposits=Z(),psp=Z(),
        tvl=Z(),treasury=Z(),totalRev=Z(),cogs=Z(),builders=Z(),brand=Z(),duty=Z(),prodEng=Z(),
        mkt=Z(),ebitda=Z(),netcf=Z(),cumE=Z(),licAnnual=Z(),licUpfront=Z();
  const gv=[]; (p.growth||[]).forEach(ph=>{ for(let k=0;k<(+ph.m||0)&&gv.length<N;k++) gv.push(+ph.pct||0); });
  while(gv.length<N) gv.push(gv.length?gv[gv.length-1]:0);
  let prev=+p.seedUsers||0, ptvl=+p.tvl0||0, pvol=0, o=(+p.organic0||0)/100, cum=0, be=null;
  for(let t=0;t<N;t++){
    spend[t]= t===0? (+p.spend1||0) : spend[t-1]*(1+gv[t-1]/100);
    organic[t]=o;
    newU[t]= cpa>0? spend[t]/cpa*(1+o) : 0;
    actives[t]=prev*(1-churn)+newU[t];
    npr[t]=actives[t]*marpu;
    vol[t]= p.takeRatePct>0? npr[t]/(p.takeRatePct/100) : 0;
    fees[t]=vol[t]*p.overallFeePct/100;
    deposits[t]=fees[t]*(p.psp.depositMultiple||0);
    psp[t]=deposits[t]*(p.psp.feePct/100)*((p.psp.absorbedPct||0)/100);
    tvl[t]=ptvl+(vol[t]-pvol)*(p.tvlCapturePct/100);
    treasury[t]=tvl[t]*(p.treasuryYieldPct/100)/12;
    totalRev[t]=npr[t]+treasury[t];
    cogs[t]=npr[t]*(p.cogsPctNPR/100)+psp[t];
    builders[t]=vol[t]*(p.buildersPctVol/100);
    brand[t]=(+p.brand1||0)*Math.pow(1+(+p.brandGrowthPct||0)/100,t);
    duty[t]=npr[t]*(p.dutyPct/100);
    prodEng[t]=+p.personnel.prodEng[Math.min(p.personnel.prodEng.length-1,Math.floor(t/12))]||0;
    licAnnual[t]=(+p.licence.annual||0)/12;
    licUpfront[t]= t===0? (+p.licence.upfront||0) : 0;
    mkt[t]=spend[t]+builders[t]+brand[t];
    ebitda[t]=totalRev[t]-cogs[t]-mkt[t]-duty[t]-licAnnual[t]-prodEng[t];
    netcf[t]=ebitda[t]-licUpfront[t];
    cum+=ebitda[t]; cumE[t]=cum;
    prev=actives[t]; ptvl=tvl[t]; pvol=vol[t];
    o+=(t<11?(+p.organicStep1||0):(+p.organicStep2||0))/100;
  }
  for(let t=0;t<N;t++){ if(ebitda[t]>0&&(t===N-1||ebitda[t+1]>0)){ be=t; break; } }
  return {N,spend,organic,newU,actives,npr,vol,fees,deposits,psp,tvl,treasury,totalRev,cogs,builders,
          brand,duty,prodEng,mkt,ebitda,netcf,cumE,licAnnual,licUpfront,breakeven:be,
          unit:{ltv,cpa,marpu,churn}};
}
function computeGroup(A,MC,MP){
  if(!A.shared) A.shared=sharedDefaults();
  const N=A.meta.months, Z=()=>Array(N).fill(0);
  const shared=Z(),revenue=Z(),ebitda=Z(),netcf=Z(),cash=Z(),cumE=Z(),fundingIn=Z();
  (A.funding||[]).forEach(f=>{ const m=Math.round(+f.month)-1; if(m>=0&&m<N) fundingIn[m]+=(+f.amount||0); });
  let bal=0,cum=0,cumOp=0,maxNeed=0,be=null,minCash=Infinity,minCashM=0;
  for(let t=0;t<N;t++){
    const y=Math.floor(t/12);
    const pick=a=>+a[Math.min(a.length-1,y)]||0;
    shared[t]=pick(A.shared.mgmtCompliance)+pick(A.shared.externalProviders)+pick(A.shared.localOps);
    revenue[t]=MC.agg.ngr[t]+MP.totalRev[t];
    ebitda[t]=MC.ebitda[t]+MP.ebitda[t]-shared[t];
    netcf[t]=MC.netcf[t]+MP.netcf[t]-shared[t];
    cum+=ebitda[t]; cumE[t]=cum;
    cumOp+=netcf[t]; if(-cumOp>maxNeed) maxNeed=-cumOp;
    bal+=netcf[t]+fundingIn[t]; cash[t]=bal;
    if(bal<minCash){ minCash=bal; minCashM=t; }
  }
  for(let t=0;t<N;t++){ if(ebitda[t]>0&&(t===N-1||ebitda[t+1]>0)){ be=t; break; } }
  return {N,shared,revenue,ebitda,netcf,cash,cumE,fundingIn,breakeven:be,
          peakNeed:Math.max(0,maxNeed),minCash,minCashM,
          totalFunding:fundingIn.reduce((a,b)=>a+b,0)};
}

const fmt = {
  usd(v,dec){ if(v==null||!isFinite(v))return "—";
    const a=Math.abs(v), s=v<0?"−$":"$";
    if(a>=1e9) return s+(a/1e9).toFixed(dec==null?2:dec)+"B";
    if(a>=1e6) return s+(a/1e6).toFixed(dec==null?2:dec)+"M";
    if(a>=1e4) return s+(a/1e3).toFixed(0)+"K";
    if(a>=1e3) return s+(a/1e3).toFixed(1)+"K";
    return s+a.toFixed(a<10?1:0); },
  usdFull(v){ if(v==null||!isFinite(v))return "—"; const s=v<0?"−":""; return s+"$"+Math.round(Math.abs(v)).toLocaleString("en-US"); },
  num(v){ if(v==null||!isFinite(v))return "—"; const a=Math.abs(v);
    if(a>=1e6) return (v/1e6).toFixed(1)+"M"; if(a>=1e3) return (v/1e3).toFixed(1)+"K"; return Math.round(v).toLocaleString(); },
  pct(v,d){ return (v*100).toFixed(d==null?1:d)+"%"; },
  x(v){ return !isFinite(v)?"—":v.toFixed(2)+"×"; },
  mo(t){ return "M"+(t+1); }
};

function niceTicks(min,max,n){
  if(min===max){max=min+1;}
  const span=max-min, step0=span/Math.max(1,n), mag=Math.pow(10,Math.floor(Math.log10(step0)));
  let step=mag; for(const m of [1,2,2.5,5,10]) if(step0<=m*mag){step=m*mag;break;}
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, ticks=[];
  for(let v=lo;v<=hi+1e-9;v+=step) ticks.push(v);
  return ticks;
}
function svgEl(tag,attrs){ const el=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(const k in attrs) el.setAttribute(k,attrs[k]); return el; }

/* Generic xy chart: series=[{name,color,values,kind:'line'|'area'|'bar'}] over months */
function xyChart(el, series, opts){
  opts=opts||{};
  const W=opts.w||620, H=opts.h||260, padL=54, padR=14, padT=14, padB=26;
  const N=series[0].values.length;
  const stacked=opts.stacked;
  let min=0,max=-Infinity;
  if(stacked){
    for(let t=0;t<N;t++){ let s=0; for(const sr of series) s+=Math.max(0,sr.values[t]); max=Math.max(max,s);}
    min=0;
  } else {
    for(const sr of series) for(const v of sr.values){ if(v<min)min=v; if(v>max)max=v; }
  }
  if(max===-Infinity)max=1;
  const ticks=niceTicks(Math.min(min,0),max,5);
  min=ticks[0]; max=ticks[ticks.length-1];
  const X=t=>padL+(t/(N-1))*(W-padL-padR);
  const Y=v=>padT+(1-(v-min)/(max-min))*(H-padT-padB);
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`,role:"img"});
  // grid
  for(const tv of ticks){
    svg.appendChild(svgEl("line",{x1:padL,x2:W-padR,y1:Y(tv),y2:Y(tv),stroke:"var(--grid)","stroke-width":1}));
    const lbl=svgEl("text",{x:padL-8,y:Y(tv)+4,"text-anchor":"end",fill:"var(--ink-3)","font-size":10.5,style:"font-variant-numeric:tabular-nums"});
    lbl.textContent=opts.fmt?opts.fmt(tv):fmt.usd(tv,0); svg.appendChild(lbl);
  }
  // zero baseline emphasized
  if(min<0&&max>0) svg.appendChild(svgEl("line",{x1:padL,x2:W-padR,y1:Y(0),y2:Y(0),stroke:"var(--axis)","stroke-width":1}));
  // x labels
  const step=N>24?6:(N>12?3:2);
  for(let t=0;t<N;t+=step){
    const lbl=svgEl("text",{x:X(t),y:H-8,"text-anchor":"middle",fill:"var(--ink-3)","font-size":10.5});
    lbl.textContent="M"+(t+1); svg.appendChild(lbl);
  }
  if(stacked){
    const base=Array(N).fill(0);
    series.forEach((sr,si)=>{
      let d="",d2="";
      const tops=[];
      for(let t=0;t<N;t++){ const v=base[t]+Math.max(0,sr.values[t]); tops.push(v); }
      d="M"+X(0)+" "+Y(base[0]);
      for(let t=0;t<N;t++) d+=" L"+X(t)+" "+Y(tops[t]);
      for(let t=N-1;t>=0;t--) d+=" L"+X(t)+" "+Y(base[t]);
      d+=" Z";
      svg.appendChild(svgEl("path",{d,fill:sr.color,"fill-opacity":0.55,stroke:"var(--surface-1)","stroke-width":1.5}));
      for(let t=0;t<N;t++) base[t]=tops[t];
    });
  } else {
    series.forEach(sr=>{
      if(sr.kind==="bar"){
        const bw=Math.min(14,(W-padL-padR)/N*0.62);
        for(let t=0;t<N;t++){
          const v=sr.values[t], y0=Y(Math.max(0,v)), h=Math.abs(Y(v)-Y(0));
          const rct=svgEl("rect",{x:X(t)-bw/2,y:v>=0?y0:Y(0),width:bw,height:Math.max(0.5,h),
            fill:v>=0?sr.color:"var(--crit)",rx:2});
          svg.appendChild(rct);
        }
      } else {
        if(sr.kind==="area"){
          let d="M"+X(0)+" "+Y(Math.max(0,min));
          for(let t=0;t<N;t++) d+=" L"+X(t)+" "+Y(sr.values[t]);
          d+=" L"+X(N-1)+" "+Y(Math.max(0,min))+" Z";
          svg.appendChild(svgEl("path",{d,fill:sr.color,"fill-opacity":0.10}));
        }
        let d="";
        for(let t=0;t<N;t++) d+=(t?" L":"M")+X(t)+" "+Y(sr.values[t]);
        svg.appendChild(svgEl("path",{d,fill:"none",stroke:sr.color,"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
      }
    });
  }
  // optional vertical event markers (e.g. funding rounds)
  if(opts.marks) for(const mk of opts.marks){
    if(mk.t<0||mk.t>=N) continue;
    svg.appendChild(svgEl("line",{x1:X(mk.t),x2:X(mk.t),y1:padT+10,y2:H-padB,stroke:"var(--axis)","stroke-width":1}));
    const flip=X(mk.t)>(W-padR)*0.72;
    const tl=svgEl("text",{x:X(mk.t)+(flip?-4:3),y:padT+9,fill:"var(--ink-2)","font-size":9.5,"font-weight":600,"text-anchor":flip?"end":"start"});
    tl.textContent=mk.label; svg.appendChild(tl);
  }
  // optional horizontal reference line (e.g. target margin)
  if(opts.href!=null && opts.href.v>=min && opts.href.v<=max){
    svg.appendChild(svgEl("line",{x1:padL,x2:W-padR,y1:Y(opts.href.v),y2:Y(opts.href.v),stroke:"var(--s2)","stroke-width":1.3,"stroke-dasharray":"5 4"}));
    const rl=svgEl("text",{x:W-padR-4,y:Y(opts.href.v)-5,"text-anchor":"end",fill:"var(--s2)","font-size":10,"font-weight":650});
    rl.textContent=opts.href.label||""; svg.appendChild(rl);
  }
  // crosshair + tooltip
  const hover=svgEl("line",{x1:0,x2:0,y1:padT,y2:H-padB,stroke:"var(--axis)","stroke-width":1,visibility:"hidden"});
  svg.appendChild(hover);
  const dots=series.map(sr=>{ const c=svgEl("circle",{r:4.5,fill:sr.color,stroke:"var(--surface-1)","stroke-width":2,visibility:"hidden"}); svg.appendChild(c); return c; });
  svg.addEventListener("mousemove",e=>{
    const pt=svg.getBoundingClientRect();
    const sx=(e.clientX-pt.left)*(W/pt.width);
    let t=Math.round(((sx-padL)/(W-padL-padR))*(N-1)); t=clamp(t,0,N-1);
    hover.setAttribute("x1",X(t)); hover.setAttribute("x2",X(t)); hover.setAttribute("visibility","visible");
    let rows="";
    if(stacked){ let base=0;
      series.forEach((sr,si)=>{ base+=Math.max(0,sr.values[t]); dots[si].setAttribute("visibility","hidden"); });
      let acc=0;
      series.forEach((sr,si)=>{ acc+=Math.max(0,sr.values[t]);
        rows+=`<div class="t-r"><span class="k"><span class="sw" style="background:${sr.color};width:8px;height:8px;border-radius:2px;display:inline-block"></span>${sr.name}</span><span class="v">${(opts.fmt||fmt.usd)(sr.values[t])}</span></div>`;});
      rows+=`<div class="t-r" style="border-top:1px solid var(--grid);margin-top:4px;padding-top:4px"><span class="k">Total</span><span class="v">${(opts.fmt||fmt.usd)(base)}</span></div>`;
    } else {
      series.forEach((sr,si)=>{
        dots[si].setAttribute("cx",X(t)); dots[si].setAttribute("cy",Y(sr.values[t])); dots[si].setAttribute("visibility","visible");
        rows+=`<div class="t-r"><span class="k"><span class="sw" style="background:${sr.color};width:8px;height:8px;border-radius:2px;display:inline-block"></span>${sr.name}</span><span class="v">${(opts.fmt||fmt.usd)(sr.values[t])}</span></div>`;});
    }
    showTip(`<div class="t-h">Month ${t+1}</div>${rows}`, e.clientX, e.clientY);
  });
  svg.addEventListener("mouseleave",()=>{ hideTip(); hover.setAttribute("visibility","hidden"); dots.forEach(d=>d.setAttribute("visibility","hidden")); });
  el.innerHTML="";
  el.appendChild(svg);
  if(series.length>1){
    const lg=document.createElement("div"); lg.className="legend";
    series.forEach(sr=>{ const it=document.createElement("div"); it.className="it";
      it.innerHTML=`<span class="sw" style="background:${sr.color}"></span>${sr.name}`; lg.appendChild(it); });
    el.appendChild(lg);
  }
}

/* Horizontal bars with reference line */
function hbarChart(el, items, opts){
  opts=opts||{};
  const W=opts.w||620, rowH=opts.rowH||30, padL=opts.padL||150, padR=opts.padR||60, padT=6;
  const H=padT+items.length*rowH+10;
  let max=Math.max(...items.map(i=>i.value),opts.ref||0)*1.08||1;
  const X=v=>padL+(v/max)*(W-padL-padR);
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`});
  if(opts.ref!=null){
    svg.appendChild(svgEl("line",{x1:X(opts.ref),x2:X(opts.ref),y1:padT,y2:H-8,stroke:"var(--axis)","stroke-width":1,"stroke-dasharray":"none"}));
    const t=svgEl("text",{x:X(opts.ref)+4,y:padT+8,fill:"var(--ink-3)","font-size":10}); t.textContent=opts.refLabel||""; svg.appendChild(t);
  }
  items.forEach((it,i)=>{
    const y=padT+i*rowH+6, bh=16;
    const lbl=svgEl("text",{x:padL-8,y:y+bh-4,"text-anchor":"end",fill:"var(--ink-2)","font-size":11.5});
    lbl.textContent=it.name; svg.appendChild(lbl);
    const w=Math.max(1,X(it.value)-padL);
    const r=svgEl("path",{d:`M${padL} ${y} h${w-4} a4 4 0 0 1 4 4 v${bh-8} a4 4 0 0 1 -4 4 h${-(w-4)} Z`,fill:it.color});
    svg.appendChild(r);
    const val=svgEl("text",{x:padL+w+6,y:y+bh-4,fill:"var(--ink-1)","font-size":11,"font-weight":600,style:"font-variant-numeric:tabular-nums"});
    val.textContent=(opts.fmt||fmt.x)(it.value); svg.appendChild(val);
    r.addEventListener("mousemove",e=>showTip(`<div class="t-h">${it.name}</div><div class="t-r"><span class="k">${opts.label||"Value"}</span><span class="v">${(opts.fmt||fmt.x)(it.value)}</span></div>${it.extra||""}`,e.clientX,e.clientY));
    r.addEventListener("mouseleave",hideTip);
  });
  el.innerHTML=""; el.appendChild(svg);
}

/* P&L waterfall: GGR 100% -> EBITDA, each step labeled as % of GGR */
function waterfallChart(el){
  // basis: the final plan year, full 12 months (not a single exit month)
  const t0=Math.max(0,M.N-12), S=arr=>arr.slice(t0,M.N).reduce((x,y)=>x+y,0);
  const g=S(M.agg.ggr)||1;
  const techKyc=S(M.opex.kyc)+S(M.opex.hosting)+S(M.opex.software)+S(M.opex.aggregator);
  const steps=[
    {n:"GGR",total:true,set:g},
    {n:"Bonuses &\njackpots",v:-S(M.agg.bonus)},
    {n:"NGR",total:true},
    {n:"Content\nrevshare",v:-S(M.agg.content)},
    {n:"Payment\nprocessing",v:-S(M.agg.pay)},
    {n:"KYC &\ntech",v:-techKyc},
    {n:"Gaming\ntax",v:-S(M.agg.tax)},
    {n:"GROSS\nPROFIT",total:true},
    {n:"Affiliate\nrevshare*",v:-S(M.agg.affrs)},
    {n:"CPA\nbudgets",v:-S(M.agg.marketing)},
    {n:"Brand &\nstreamers",v:-S(M.opex.brand)},
    {n:"CONTRIB.\nafter mktg",total:true},
    {n:"Personnel",v:-S(M.opex.personnel)},
    {n:"Other\nopex",v:-(S(M.opexTotal)-S(M.opex.personnel))},
    {n:"EBITDA",total:true,final:true}
  ];
  const W=1240,H=300,padL=16,padR=16,padT=30,padB=44;
  const n=steps.length, slot=(W-padL-padR)/n, bw=Math.min(58,slot*0.66);
  const Y=v=>padT+(1-v/g)*(H-padT-padB);
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`});
  // baseline + gridlines at 0/25/50/75/100%
  for(const q of [0,0.25,0.5,0.75,1]){
    svg.appendChild(svgEl("line",{x1:padL,x2:W-padR,y1:Y(g*q),y2:Y(g*q),stroke:"var(--grid)","stroke-width":1}));
    const tl=svgEl("text",{x:W-padR,y:Y(g*q)-3,"text-anchor":"end",fill:"var(--ink-3)","font-size":9});
    tl.textContent=Math.round(q*100)+"%"; svg.appendChild(tl);
  }
  let run=0;
  steps.forEach((st,i)=>{
    const x=padL+i*slot+(slot-bw)/2;
    let y0,y1,fill,valTxt,val;
    if(st.total){
      if(st.set!=null) run=st.set;
      val=run; y0=Y(run); y1=Y(0);
      fill=st.final?cssv("--good"):cssv("--s1");
      valTxt=fmt.pct(run/g,run/g<0.1?1:0);
    } else {
      val=st.v; const from=run, to=run+st.v; run=to;
      y0=Y(Math.max(from,to)); y1=Y(Math.min(from,to));
      fill=cssv("--s2");
      valTxt="\u2212"+fmt.pct(Math.abs(st.v)/g,Math.abs(st.v)/g<0.02?1:0);
      // connector from previous level
      svg.appendChild(svgEl("line",{x1:x-((slot-bw)/2)-bw/2+2,x2:x,y1:Y(from),y2:Y(from),stroke:"var(--axis)","stroke-width":1}));
    }
    const rect=svgEl("rect",{x:x,y:y0,width:bw,height:Math.max(1.5,y1-y0),rx:3,fill,
      stroke:"var(--surface-1)","stroke-width":1});
    svg.appendChild(rect);
    const vt=svgEl("text",{x:x+bw/2,y:y0-4,"text-anchor":"middle",fill:"var(--ink-1)","font-size":10,"font-weight":st.total?700:600});
    vt.textContent=valTxt; svg.appendChild(vt);
    st.n.split("\n").forEach((ln,li)=>{
      const nt=svgEl("text",{x:x+bw/2,y:H-padB+13+li*11,"text-anchor":"middle",fill:st.total?"var(--ink-1)":"var(--ink-3)","font-size":9.5,"font-weight":st.total?700:400});
      nt.textContent=ln; svg.appendChild(nt);
    });
    rect.addEventListener("mousemove",e=>showTip(
      `<div class="t-h">${st.n.replace("\n"," ")}</div>
       <div class="t-r"><span class="k">Month 36</span><span class="v">${fmt.usd(Math.abs(st.total?val:st.v))}/mo</span></div>
       <div class="t-r"><span class="k">% of GGR</span><span class="v">${fmt.pct(Math.abs(st.total?val:st.v)/g,1)}</span></div>`,
      e.clientX,e.clientY));
    rect.addEventListener("mouseleave",hideTip);
  });
  el.innerHTML=""; el.appendChild(svg);
}

/* Project timeline: phases + funding markers + break-even */
function timelineChart(el){
  const N=M.N, W=1240, H=138, padL=20, padR=20, yBar=66;
  const sy=A.meta.startYear||2026, smc=A.meta.startCalMonth||9;
  const MOS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const cal=t=>{ const ab=(smc-1)+t; return MOS[ab%12]+"-"+String(sy+Math.floor(ab/12)).slice(2); };
  const X=t=>padL+(clamp(t,0,N-1)/(N-1))*(W-padL-padR);
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`});
  const launch=Math.max(0,Math.min(...A.geos.filter(g=>g.enabled).map(g=>g.mkStart))-1);
  const scale=Math.max(launch+1,(A.global.scaleMonth||7)-1);
  const be=M.breakeven!=null?M.breakeven:N-1;
  const phases=[
    {a:0,b:launch,label:"BUILD",c:"--s4"},
    {a:launch,b:scale,label:"LAUNCH & PROVE",c:"--s1"},
    {a:scale,b:Math.max(scale+1,be),label:"SCALE ×"+(A.global.scaleMult||1),c:"--s2"},
    {a:Math.max(scale+1,be),b:N-1,label:"PROFITABLE",c:"--good"}
  ];
  for(const ph of phases){
    if(ph.b<=ph.a) continue;
    svg.appendChild(svgEl("rect",{x:X(ph.a),y:yBar-5,width:X(ph.b)-X(ph.a),height:10,rx:5,fill:cssv(ph.c),"fill-opacity":0.3}));
    const lb=svgEl("text",{x:(X(ph.a)+X(ph.b))/2,y:yBar-14,"text-anchor":"middle",fill:"var(--ink-2)","font-size":10,"font-weight":700,"letter-spacing":"0.06em"});
    lb.textContent=ph.label; svg.appendChild(lb);
  }
  // funding rounds above the bar (alternating heights)
  const rounds=[...(A.funding||[])].filter(f=>Math.round(+f.month)>0).sort((a,b)=>a.month-b.month);   // seed sits before M1, shown in the Cash tab
  rounds.forEach((f,i)=>{
    const x=X(Math.max(0,Math.round(f.month)-1)), hy=i%2?26:40;
    svg.appendChild(svgEl("line",{x1:x,x2:x,y1:H-yBar-18+hy,y2:yBar-5,stroke:"var(--axis)","stroke-width":1}));
    svg.appendChild(svgEl("circle",{cx:x,cy:yBar,r:6,fill:cssv("--s1"),stroke:"var(--surface-1)","stroke-width":2}));
    const lx=Math.max(52,Math.min(W-52,x));
    const t1=svgEl("text",{x:lx,y:hy-8,"text-anchor":"middle",fill:"var(--ink-1)","font-size":11,"font-weight":700});
    const nSeed=rounds.filter(r=>Math.round(+r.month)<=0).length;
    t1.textContent=roundShort(f,i)+" "+fmt.usd(f.amount); svg.appendChild(t1);
    const t2=svgEl("text",{x:lx,y:hy+3,"text-anchor":"middle",fill:"var(--ink-3)","font-size":9.5});
    t2.textContent=Math.round(+f.month)<=0? "Setup · "+setupLabel() : "M"+f.month+" · "+cal(Math.round(f.month)-1); svg.appendChild(t2);
  });
  // break-even diamond
  if(M.breakeven!=null){
    const x=X(be);
    svg.appendChild(svgEl("path",{d:`M${x} ${yBar-9} L${x+7} ${yBar} L${x} ${yBar+9} L${x-7} ${yBar} Z`,fill:cssv("--good"),stroke:"var(--surface-1)","stroke-width":2}));
    const t=svgEl("text",{x:x,y:yBar+26,"text-anchor":"middle",fill:"var(--good-text)","font-size":10,"font-weight":700});
    t.textContent="BREAK-EVEN M"+(be+1); svg.appendChild(t);
  }
  // month + calendar ticks
  for(const t of [0,5,11,17,23,29,35]){
    if(t>=N) continue;
    const x=X(t);
    svg.appendChild(svgEl("line",{x1:x,x2:x,y1:yBar+7,y2:yBar+12,stroke:"var(--axis)","stroke-width":1}));
    const m1=svgEl("text",{x:x,y:yBar+40,"text-anchor":"middle",fill:"var(--ink-3)","font-size":10}); m1.textContent="M"+(t+1); svg.appendChild(m1);
    const m2=svgEl("text",{x:x,y:yBar+52,"text-anchor":"middle",fill:"var(--ink-3)","font-size":9}); m2.textContent=cal(t); svg.appendChild(m2);
  }
  el.innerHTML=""; el.appendChild(svg);
}

/* Heatmap: rows × cols matrix, sequential blue */
function heatmap(el, rows, cols, get, opts){
  opts=opts||{};
  const cw=Math.max(26,Math.min(44, Math.floor(760/cols.length))), ch=24, padL=90, padT=24;
  const W=padL+cols.length*cw+10, H=padT+rows.length*ch+8;
  let mx=0; for(let i=0;i<rows.length;i++) for(let j=0;j<cols.length;j++){ const v=get(i,j); if(v!=null&&v>mx)mx=v; }
  if(mx<=0)mx=1;
  const ramp=["--seq100","--seq200","--seq300","--seq400","--seq500","--seq600","--seq700"];
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`});
  cols.forEach((c,j)=>{ const t=svgEl("text",{x:padL+j*cw+cw/2,y:14,"text-anchor":"middle",fill:"var(--ink-3)","font-size":10}); t.textContent=c; svg.appendChild(t); });
  rows.forEach((rname,i)=>{
    const t=svgEl("text",{x:padL-8,y:padT+i*ch+ch/2+4,"text-anchor":"end",fill:"var(--ink-2)","font-size":10.5}); t.textContent=rname; svg.appendChild(t);
    cols.forEach((c,j)=>{
      const v=get(i,j);
      if(v==null) return;
      const k=Math.min(ramp.length-1, Math.floor((v/mx)*ramp.length));
      const rc=svgEl("rect",{x:padL+j*cw+1,y:padT+i*ch+1,width:cw-2,height:ch-2,rx:4,fill:cssv(ramp[k])});
      svg.appendChild(rc);
      rc.addEventListener("mousemove",e=>showTip(`<div class="t-h">${rname} · ${c}</div><div class="t-r"><span class="k">${opts.label||"Value"}</span><span class="v">${(opts.fmt||fmt.usd)(v)}</span></div>`,e.clientX,e.clientY));
      rc.addEventListener("mouseleave",hideTip);
    });
  });
  el.innerHTML=""; el.appendChild(svg);
}

];

function normalizeLicences(){   // runs before every compute, so older saved numbers pick these up too
  if(!A.meta.migAcq){   // once, Oct-2026: buying a Curaçao-licensed company ($120K) replaces the LOK application route
    A.meta.migAcq=true;
    if(!A.licenses.some(l=>/cura/i.test(l.name)&&!/acqui/i.test(l.name))) A.licenses.push({name:"Cura\u00e7ao LOK (B2C)",enabled:true,upfront:0,annual:85000,startMonth:1});
    if(!A.licenses.some(l=>/acqui/i.test(l.name)))
      A.licenses.push({name:"Acquisition \u2014 Cura\u00e7ao-licensed company",enabled:true,upfront:120000,annual:0,startMonth:1});
    const cw=A.licenses.find(l=>/cura/i.test(l.name)&&!/acqui/i.test(l.name));
    if(cw){ cw.enabled=true; cw.upfront=0; cw.name="Cura\u00e7ao LOK \u2014 annual fees + local substance"; }
  }
}
function setupTotal(A){ const S=A.setup; if(!S||!S.enabled) return 0; return (S.items||[]).reduce((a,i)=>a+(+i.amount||0),0); }
function setupLabel(){ const S=A.setup||{}, n=Math.max(1,+S.months||3), sy=A.meta.startYear||2027, smc=A.meta.startCalMonth||1;
  const MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const ab=S.inPlan?(sy*12+smc-1):(sy*12+smc-1)-n, ae=ab+n-1;
  return MO[ab%12]+(Math.floor(ab/12)!==Math.floor(ae/12)?" "+Math.floor(ab/12):"")+"\u2013"+MO[ae%12]+" "+Math.floor(ae/12); }
function roundShort(f,i){ const n=String(f.name||"").split(/\s+[\u2014\u2013-]\s+/)[0].trim().replace(/\s+extension$/i," ext."); return n||("R"+(i+1)); }
function roundWhen(f){ return Math.round(+f.month)<=0 ? "Setup ("+setupLabel()+")" : "Month "+f.month; }
function normalizePlan(){   // one-time plan decisions applied to defaults AND older saved numbers
  if(!A.meta.migRS){   // Oct-2026 (Roy): affiliates mainly on fixed CPA/QCPA deals — revshare 40% → 10%;
    A.meta.migRS=true; // caps ×1.5 keep player volume roughly where it was (~1M FTDs over 5 years)
    A.global.rsShareAff=10;
    A.geos.forEach(g=>{ g.mkCap=Math.round((+g.mkCap||0)*1.5); });
  }
}
function normalizeSeed(){   // once, Oct-2026: small seed round funds a 3-month pre-launch setup (Oct–Dec 2026)
  if(A.meta.migSeed) return; A.meta.migSeed=true;
  const L=A.payrollLoad!=null?1+A.payrollLoad/100:1.28;
  const sal=re=>{ const p=A.personnel.find(x=>re.test(x.role)); return p?(+p.salary||0):0; };
  const hires=Math.round((sal(/Payments & Risk/)+sal(/MLRO/))*L*3/1000)*1000;   // CTO: part-time, paid outside the company during setup
  let acq=120000;
  const ai=A.licenses.findIndex(l=>/acqui/i.test(l.name));
  if(ai>=0){ acq=+A.licenses[ai].upfront||acq; A.licenses.splice(ai,1); }   // purchase now happens in setup
  const items=[
    {name:"Cura\u00e7ao-licensed company \u2014 purchase",amount:acq,note:"Existing B2C LOK licence; CGA change-of-control approval"},
    {name:"Legal & corporate",amount:35000,note:"Due diligence on the company, CGA change-of-control filing, entity structuring, PSP & provider contracts"},

function refresh(){
  // keep the input you are typing in focused across the re-render (the tab is rebuilt from the model)
  const el=document.activeElement, tab=el&&el.closest?el.closest(".tab"):null; let idx=-1, raw=null, sel=null;
  if(tab && (el.tagName==="INPUT"||el.tagName==="SELECT")){ idx=[...tab.querySelectorAll("input,select")].indexOf(el); raw=el.value; try{ sel=[el.selectionStart,el.selectionEnd]; }catch(e){} }
  recompute(); renderTab(activeTab);
  if(idx>=0){ const n=[...tab.querySelectorAll("input,select")][idx]; if(n){ if(n.type==="number"&&raw!==null&&String(parseFloat(raw))!==raw&&!isNaN(parseFloat(raw))) n.value=raw; n.focus({preventScroll:true}); try{ if(sel&&sel[0]!=null) n.setSelectionRange(sel[0],sel[1]); }catch(e){} } }
}
const EDITED=new WeakMap();   // obj -> Set(keys) edited since load/save; survives re-renders
function markEdited(obj,key,inp){ let st=EDITED.get(obj); if(!st){ st=new Set(); EDITED.set(obj,st); } st.add(key); if(inp) inp.classList.add("edited"); }
function isEdited(obj,key){ const st=EDITED.get(obj); return !!(st&&st.has(key)); }

/* debounce for input-driven recompute */
let _t=null;
function queueRefresh(){ clearTimeout(_t); _t=setTimeout(refresh,250); }

/* helper: numeric input bound to object path */
function numInput(obj,key,opts){
  opts=opts||{};
  const inp=document.createElement("input");
  inp.type="number"; inp.value=obj[key];
  if(opts.step)inp.step=opts.step; if(opts.min!=null)inp.min=opts.min;
  if(isEdited(obj,key)) inp.classList.add("edited");
  inp.addEventListener("input",()=>{ const v=parseFloat(inp.value); if(!isNaN(v)){ obj[key]=v; markEdited(obj,key,inp); queueRefresh(); } });
  return inp;
}

/* Mix totals: the engine normalizes mix weights, but the on-screen numbers should read as % of 100. */
function mixRescale(vals){            // vals: array of numbers -> array scaled to sum exactly 100 (1 decimal)
  const s=vals.reduce((a,b)=>a+(+b||0),0); if(s<=0) return vals.slice();
  const out=vals.map(v=>Math.round((+v||0)/s*1000)/10);
  const diff=Math.round((100-out.reduce((a,b)=>a+b,0))*10)/10;
  let k=0; out.forEach((v,i)=>{ if(v>out[k]) k=i; }); out[k]=Math.round((out[k]+diff)*10)/10;
  return out;
}
function mixTotalBar(getVals, onRescale){
  const bar=document.createElement("div");
  bar.style.cssText="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:12.5px";
  const lbl=document.createElement("span"); const btn=document.createElement("button");
  btn.className="ghost-btn"; btn.textContent="Rescale to 100%"; btn.style.cssText="font-size:11.5px;padding:4px 10px";
  btn.onclick=onRescale;
  const upd=()=>{ const s=getVals().reduce((a,b)=>a+(+b||0),0); const ok=Math.abs(s-100)<0.05;
    lbl.innerHTML= ok ? `Mix total: <b>100%</b> <span style="color:var(--good,#1e8e5a)">✓</span>`
      : `Mix total: <b style="color:var(--bad,#c03d3d)">${(Math.round(s*10)/10)}%</b> <span style="color:var(--ink-3)">— the model already scales it to 100% when calculating; rescale so the numbers on screen match.</span>`;
    btn.style.display= ok ? "none" : ""; };
  bar.appendChild(lbl); bar.appendChild(btn); upd(); bar.upd=upd;
  return bar;
}

    const fl=document.createElement("div"); fl.className="fields";
    const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!c.enabled;
    cb.onchange=()=>{ c.enabled=cb.checked; queueRefresh(); };
    fl.appendChild(field("Include certification costs",cb));
    fl.appendChild(field("Games certified at launch",numInput(c,"initialGames",{step:1,min:0}),"titles"));
    fl.appendChild(field("New games per month",numInput(c,"gamesPerMonth",{step:0.5,min:0}),"titles/mo"));
    fl.appendChild(field("Cost per game certification",numInput(c,"costPerGame",{step:500,min:0}),"$ per title"));
    fl.appendChild(field("Launch batch month",numInput(c,"startMonth",{step:1,min:1}),"M#"));
    fl.appendChild(field("RNG certification (one-time)",numInput(c,"rngCost",{step:1000,min:0}),"$"));
    fl.appendChild(field("RNG certification month",numInput(c,"rngMonth",{step:1,min:1}),"M#"));
    sec.appendChild(fl); card.appendChild(sec);
  }
  // dated schedule of every licensing & certification cost
  const sy=A.meta.startYear||2027, smc=A.meta.startCalMonth||1;
  const cal=t=>{ const mi=smc-1+(t-1); return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][((mi%12)+12)%12]+" "+(sy+Math.floor(mi/12))+" (M"+t+")"; };
  const rows=[];
  A.licenses.filter(l=>l.enabled).forEach(l=>{
    if(+l.upfront) rows.push({t:+l.startMonth,item:l.name+(/acqui/i.test(l.name)?" \u2014 purchase price":" \u2014 upfront / application"),one:+l.upfront,rec:""});
    if(+l.annual) rows.push({t:+l.startMonth,item:l.name+" \u2014 annual fee",one:0,rec:fmt.usd(+l.annual)+"/yr from here ("+fmt.usd(+l.annual/12)+"/mo accrued)"});
  });
  if(A.certs&&A.certs.enabled){ const c=A.certs;
    if(+c.rngCost) rows.push({t:+c.rngMonth||1,item:"Platform RNG certification (one-time)",one:+c.rngCost,rec:""});
    if(+c.initialGames) rows.push({t:+c.startMonth||1,item:"Game certification \u2014 launch batch ("+c.initialGames+" titles \u00d7 "+fmt.usd(+c.costPerGame)+")",one:(+c.initialGames)*(+c.costPerGame),rec:""});
    if(+c.gamesPerMonth) rows.push({t:(+c.startMonth||1)+1,item:"Game certification \u2014 new titles ("+c.gamesPerMonth+"/mo \u00d7 "+fmt.usd(+c.costPerGame)+")",one:0,rec:fmt.usd(c.gamesPerMonth*c.costPerGame)+"/mo from here"});
  }
  rows.sort((a,b)=>a.t-b.t);
  const sch=document.createElement("div"); sch.style.marginTop="16px";
  sch.innerHTML=`<h3 style="font-size:14px;margin:0 0 4px">Licensing &amp; certification schedule</h3><p class="note">Every dated cost from the two tables above, on the calendar (M1 = ${cal(1).split(" (")[0]}). One-off items are cash outflows (investing, below EBITDA); annual fees and per-title certification run through opex. Change a month or amount above and this updates.</p>
  <div class="twrap"><table><thead><tr><th>When</th><th style="text-align:left">Item</th><th>One-off</th><th style="text-align:left">Recurring</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${cal(r.t)}</td><td style="text-align:left">${r.item}</td><td>${r.one?fmt.usd(r.one):"\u2014"}</td><td style="text-align:left">${r.rec||"\u2014"}</td></tr>`).join("")}
  <tr style="font-weight:650"><td></td><td style="text-align:left">Total one-off</td><td>${fmt.usd(rows.reduce((a,r)=>a+r.one,0))}</td><td></td></tr></tbody></table></div>`;
  card.appendChild(sch);
  return card;
}

function buildSetupEditor(){
  const S=A.setup||(A.setup={enabled:true,months:3,items:[]});
  const inPlan=!!S.inPlan, nS=Math.max(1,+S.months||3);
  const seed=A.funding.filter(f=>Math.round(+f.month)<=(inPlan?1:0)).reduce((a,f)=>a+(+f.amount||0),0);
  const tot=S.enabled?(S.items||[]).reduce((a,i)=>a+(+i.amount||0),0):0;
  const left=inPlan?((M&&M.freeCash)?M.freeCash[Math.min(M.N-1,nS-1)]:seed-tot):seed-tot;
  const card=document.createElement("div"); card.className="card";
  card.innerHTML=`<h3>Pre-launch setup \u2014 funded by the pre-seed (${setupLabel()})</h3><p class="note">${S.inPlan?`M1\u2013M${S.months} of the plan, before launch at M${launchM()}: buy the licensed company, legal, first operational hires, content and platform agreements. Funded by the pre-seed, which lands at M1. The items run through the P&amp;L as \u201cPre-launch setup\u201d (spread evenly over the ${S.months} months); the company purchase is booked as an investment with the licence upfronts.`:`The ${S.months} months before M1: buy the licensed company, legal, first operational hires, content and platform agreements. Paid from the pre-seed (a funding round with month 0); whatever is left opens the cash line at M1, when the seed lands. These costs come before the P&amp;L, so they are not in EBITDA \u2014 they are in total cash need and in the Cash tab.`}</p>
  <div class="twrap"><table class="editable"><thead><tr><th style="text-align:left">Item</th><th>Amount $</th><th style="text-align:left">What it covers</th><th></th></tr></thead><tbody></tbody></table></div>
  <button class="ghost-btn addbtn">+ Add item</button>
  <div class="tiles mini" style="margin-top:12px">
    <div class="tile"><div class="lbl">Setup budget</div><div class="val">${fmt.usd(tot)}</div><div class="delta">${S.months} months pre-launch</div></div>
    <div class="tile"><div class="lbl">Pre-seed round</div><div class="val">${fmt.usd(seed)}</div><div class="delta">${seed?"edit the amount in the funding table above":(inPlan?"add a round landing at M1":"add a round with month 0")}</div></div>
    <div class="tile"><div class="lbl">Free cash at launch</div><div class="val">${fmt.usd(left)}</div><div class="delta">${left<0?"\u26a0 pre-seed too small \u2014 raise it or trim the setup":(inPlan?"end of the setup months, before the seed lands":"opening cash at M1")}</div></div>
  </div><div class="fields" style="margin-top:12px"></div>`;
  const tb=card.querySelector("tbody");
  S.items.forEach((it,ii)=>{
    const tr=document.createElement("tr");
    const t1=document.createElement("td"); const ni=document.createElement("input"); ni.type="text"; ni.value=it.name; ni.style.width="300px"; ni.style.textAlign="left";
    ni.addEventListener("input",()=>{it.name=ni.value;}); t1.appendChild(ni); tr.appendChild(t1);
    const t2=document.createElement("td"); const ai=numInput(it,"amount",{step:5000,min:0}); ai.classList.add("wide"); t2.appendChild(ai); tr.appendChild(t2);
    const t3=document.createElement("td"); const no=document.createElement("input"); no.type="text"; no.value=it.note||""; no.style.width="460px"; no.style.textAlign="left";
    no.addEventListener("input",()=>{it.note=no.value;}); t3.appendChild(no); tr.appendChild(t3);
    const tx=document.createElement("td"); tx.className="rowbtns"; const del=document.createElement("button"); del.textContent="\u2715"; del.title="Remove item";
    del.onclick=()=>{ S.items.splice(ii,1); refresh(); }; tx.appendChild(del); tr.appendChild(tx);
    tb.appendChild(tr);
  });
  card.querySelector(".addbtn").onclick=()=>{ S.items.push({name:"New setup item",amount:0,note:""}); refresh(); };
  const fl=card.querySelector(".fields");
  const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!S.enabled; cb.onchange=()=>{S.enabled=cb.checked; refresh();};
  fl.appendChild(field("Include pre-launch setup",cb));
  fl.appendChild(field("Setup length (months before M1)",numInput(S,"months",{step:1,min:1}),"label only"));
  return card;
}

    field("Bankroll from launch ($)",numInput(A.wc,"br1",{step:25000,min:0}),"from M"+(A.wc.br1From||1)),
    field("Bankroll step 2 ($)",numInput(A.wc,"br2",{step:25000,min:0})),

  root.appendChild(chc);
  const N=M.N;

  const ranked=depts.map(d=>({d,v:deptHeads(d),end:0})).map(x=>({...x,end:x.v[N-1]}))

  const top=ranked.slice(0,7), rest=ranked.slice(7);

  // headcount by phase (3 series, phase colors)
  const phaseSeries=PHASES.map(([k,l])=>({name:l,color:phaseColor(k),values:Array.from({length:N},(_,t)=>
    A.personnel.filter(p=>phaseOf(p)===k).reduce((s,p)=>s+headsAt(p,t+1),0))}));
  xyChart(document.getElementById("ch-phase"),phaseSeries,{stacked:true,fmt:v=>fmt.num(v),h:260});

  depts.forEach((d,i)=>{

    let rows=roles.map(p=>`<div style="padding:7px 0 7px 10px;border-bottom:1px solid var(--grid);border-left:3px solid ${phaseColor(phaseOf(p))}">

        <span style="color:var(--ink-2);white-space:nowrap">M${p.start} · ${fmt.usd(p.salary)}/mo${p.bonus?` +${fmt.usd(p.bonus)} bns`:""} · ${p.h.join("→")}</span>
      </div>
      ${p.note?`<div style="color:var(--ink-3);font-size:12px;margin-top:2px">${p.note}</div>`:""}

    grid.appendChild(c);
  });
}

      metricRow("Monthly EBITDA",fmt.usd(M.ebitda[idx]),M.ebitda[idx]<0?"loss narrowing q/q":"positive & growing","Trajectory matters more than the absolute number pre-break-even.")+

let cohortGeo="all";
function blendedCohort(){
  const N=M.N;
  const f=M.perGeo.map(g=>g.ftds.reduce((a,b)=>a+b,0));
  const F=f.reduce((a,b)=>a+b,0)||1;
  const w=f.map(x=>x/F);
  const r=Array.from({length:N},(_,a)=>M.perGeo.reduce((s,g,i)=>s+w[i]*g.r[a],0));
  const cum=Array.from({length:N},(_,a)=>M.perGeo.reduce((s,g,i)=>s+w[i]*g.unit.cumContrib[a],0));
  const spend=M.perGeo.reduce((s,g)=>s+g.spend.reduce((a,b)=>a+b,0),0);
  const effCAC=F>0?spend/F:0;
  let payback=null; for(let a=0;a<N;a++) if(cum[a]>=effCAC){payback=a;break;}
  return {id:"all", name:"All (blended)", r,
    ggrPerActive:M.perGeo.reduce((s,g,i)=>s+w[i]*g.ggrPerActive,0),
    unit:{effCAC, contribPerFTD:M.perGeo.reduce((s,g,i)=>s+w[i]*g.unit.contribPerFTD,0),
      cumContrib:cum, payback,
      ltvNGR36:M.perGeo.reduce((s,g,i)=>s+w[i]*g.unit.ltvNGR36,0),
      ltvCac:effCAC>0?cum[Math.min(36,N)-1]/effCAC:0}};
}
function renderCohorts(){
  const el=document.getElementById("tab-cohorts");
  if(!M.perGeo.length){ el.innerHTML="<h2>Cohorts</h2><p class='sub'>Enable at least one GEO.</p>"; return; }
  if(cohortGeo!=="all" && !M.perGeo.find(g=>g.id===cohortGeo)) cohortGeo="all";
  const g = cohortGeo==="all" ? blendedCohort() : M.perGeo.find(x=>x.id===cohortGeo);
  el.innerHTML=`<h2>Cohorts</h2>
  <p class="sub">How a month's acquired depositors behave as they age: retention decay, cumulative payback vs CAC, and the contribution each cohort generates over time.</p>
  <div class="toolbar"><div class="seg" id="geoSeg"></div></div>
  <div class="tiles">
    <div class="tile"><div class="lbl">Effective CAC</div><div class="val">${fmt.usd(g.unit.effCAC,0)}</div><div class="delta">paid spend ÷ all new depositors (incl. organic & revshare)</div></div>
    <div class="tile"><div class="lbl">Contribution / FTD / active-month</div><div class="val">${fmt.usd(g.unit.contribPerFTD,0)}</div><div class="delta">GGR/active ${fmt.usd(g.ggrPerActive,0)}/mo</div></div>
    <div class="tile"><div class="lbl">Payback</div><div class="val">${g.unit.payback!=null?"M"+(g.unit.payback+1):"&gt;36m"}</div><div class="delta">cohort age when CAC is covered</div></div>
    <div class="tile"><div class="lbl">36-mo contribution LTV</div><div class="val">${fmt.usd(g.unit.cumContrib[Math.min(36,M.N)-1],0)}</div><div class="delta">${fmt.x(g.unit.ltvCac)} of CAC — strictest basis: after ALL variable costs, at day-one PSP fees</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Retention curve — ${g.name}</h3><p class="note">Share of the FTD cohort still depositing at each age.</p><div class="chart" id="ch-ret"></div></div>
    <div class="card"><h3>Cumulative contribution per FTD vs CAC — ${g.name}</h3><p class="note">Where the line crosses CAC is payback.</p><div class="chart" id="ch-pb"></div></div>
  </div>
  <div class="card"><h3>Cohort contribution triangle — company level ($/month)</h3><p class="note">Rows = acquisition quarter; columns = cohort age in quarters; cell = total contribution that cohort generates in that quarter. Hover cells for values.</p><div class="chart" id="ch-tri"></div></div>`;
  const seg=el.querySelector("#geoSeg");
  [{id:"all",name:"All (blended)"},...M.perGeo].forEach(x=>{ const b=document.createElement("button"); b.textContent=x.name; if(x.id===cohortGeo)b.className="on";
    b.onclick=()=>{cohortGeo=x.id; renderCohorts();}; seg.appendChild(b); });
  xyChart(document.getElementById("ch-ret"),
    [{name:"Retention",color:sColor(0),values:g.r.slice(0,Math.min(24,M.N)),kind:"area"}],{fmt:v=>fmt.pct(v,0),h:240});
  const cacLine=Array(Math.min(24,M.N)).fill(g.unit.effCAC);
  xyChart(document.getElementById("ch-pb"),
    [{name:"Cumulative contribution / FTD",color:sColor(2),values:g.unit.cumContrib.slice(0,Math.min(24,M.N)),kind:"area"},
     {name:"Effective CAC",color:sColor(7),values:cacLine}],{h:240});
  // triangle: quarterly cohorts × age quarters, company level
  const Q=Math.floor(M.N/3);
  const rows=[],get=(i,j)=>{
    // cohort quarter i (months 3i..3i+2), age quarter j
    let sum=0,has=false;
    for(const pg of M.perGeo){
      for(let cm=3*i;cm<3*i+3;cm++){
        if(cm>=M.N)continue;
        for(let am=3*j;am<3*j+3;am++){
          const t=cm+am; if(t>=M.N)continue; has=true;
          // contribution of cohort cm at month t = ftds*retention*contribPerFTD
          sum+=pg.ftds[cm]*pg.r[am]*pg.unit.contribPerFTD;
        }
      }
    }
    return has?sum:null;
  };
  for(let i=0;i<Q;i++)rows.push("Q"+(i+1)+" cohort");
  heatmap(document.getElementById("ch-tri"),rows,
    Array.from({length:Q},(_,j)=>"Age Q"+j),get,{label:"Contribution",fmt:v=>fmt.usd(v)});
}

function renderFinance(){

  const idxFor=(y,mo)=>(y-sy)*12+(mo-sm); // model month index (0-based) for a calendar month
  // reporting window: Q1 2027 → Q4 2031 (full 5-year plan horizon)
  const quarters=[]; let qy=2027,qq=1;
  for(let i=0;i<20;i++){ quarters.push({y:qy,q:qq}); qq++; if(qq>4){qq=1;qy++;} }
  const buckets=quarters.map(({y,q})=>{
    const idx=[3*q-2,3*q-1,3*q].map(mo=>idxFor(y,mo)).filter(t=>t>=0&&t<N);
    return {label:`Q${q}-${String(y).slice(2)}`, y,q, idx, partial:idx.length>0&&idx.length<3};
  });
  const S=(arr,b)=>b.idx.length?b.idx.reduce((s,i)=>s+arr[i],0):null;
  const gaArr=Array.from({length:N},(_,t)=>M.opex.legal[t]+M.opex.office[t]+M.opex.travel[t]+M.opex.gaMisc[t]);
  const persArr=M.opex.personnel;
  const otherOpex=Array.from({length:N},(_,t)=>M.opex.setup[t]+M.opex.support[t]+M.opex.crmTools[t]+M.opex.antifraud[t]
    +gaArr[t]+M.opex.licAnnual[t]+M.opex.fraud[t]+M.opex.contingency[t]);
  const cogsArr=M.cogsTotal, smArr=M.mktTotal;
  const capexArr=M.opex.platformCapex, licUpArr=M.opex.licUpfront;
  const anyPartial=buckets.some(b=>b.partial);
  const cell=(v,opts)=>{
    opts=opts||{};
    if(v===null||v===undefined) return `<td style="color:var(--ink-3)">—</td>`;
    if(opts.pct) return `<td style="color:var(--ink-2)">${v}</td>`;
    const neg=(opts.neg&&v>0)||((!opts.neg)&&v<0);
    const txt=opts.neg&&v>0? "("+fmt.usd(v).replace("$","$")+")" : fmt.usd(v);
    return `<td class="${neg?'neg':''}">${txt}</td>`;
  };
  const row=(name,arr,opts)=>{
    opts=opts||{};
    const cells=buckets.map(b=>{ const v=S(arr,b); return cell(v,opts); }).join("");
    const tot=arr? buckets.reduce((s,b)=>{const v=S(arr,b); return v==null?s:s+v;},0):null;
    const cls=opts.total?"total":"";
    const pad=opts.indent?`style="padding-left:${10+opts.indent*14}px"`:"";
    return `<tr class="${cls}"><td ${pad}>${name}</td>${cells}${cell(tot,opts)}</tr>`;
  };
  const mrow=(name,numArr,denArr)=>{
    const cells=buckets.map(b=>{ const n=S(numArr,b),d=S(denArr,b);
      return cell(n!=null&&d?fmt.pct(n/d,0):null,{pct:1}); }).join("");
    const tn=buckets.reduce((s,b)=>{const v=S(numArr,b);return v==null?s:s+v;},0);
    const td=buckets.reduce((s,b)=>{const v=S(denArr,b);return v==null?s:s+v;},0);
    return `<tr><td style="color:var(--ink-3);font-style:italic;padding-left:24px">${name}</td>${cells}${cell(td?fmt.pct(tn/td,0):null,{pct:1})}</tr>`;
  };
  const sec=n=>`<tr class="section"><td colspan="${buckets.length+2}">${n}</td></tr>`;
  const krow=(name,fn)=>{
    const cells=buckets.map(b=>b.idx.length?`<td>${fn(b)}</td>`:`<td style="color:var(--ink-3)">—</td>`).join("");
    return `<tr><td>${name}</td>${cells}<td style="color:var(--ink-3)">—</td></tr>`;
  };
  // cash-flow specific rows
  const openCash=b=>b.idx.length? (b.idx[0]>0?M.cash[b.idx[0]-1]:0) : null;
  const closeCash=b=>b.idx.length? M.cash[b.idx[b.idx.length-1]] : null;
  const html=`
  <h2>Finance</h2>
  <p class="sub">Top-down quarterly financial statements for the full 5-year plan horizon, Q1 2027 – Q4 2031 (calendar quarters; model starts ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][sm-1]} ${sy} — change in Assumptions §1). ${anyPartial?"Quarters marked * are partly outside the model horizon.":""} Monthly detail lives on the P&L and Cash Flow tabs.</p>
  <div class="card"><div class="twrap"><table>
    <thead><tr><th>USD</th>${buckets.map(b=>`<th>${b.label}${b.partial?"*":""}</th>`).join("")}<th>Total</th></tr></thead>
    <tbody>
      ${sec("Income statement")}
      ${row("Gross gaming revenue (GGR)",M.agg.ggr)}
      ${row("Bonuses & jackpots",M.agg.bonus,{neg:1,indent:1})}
      ${row("Net gaming revenue (NGR)",M.agg.ngr,{total:1})}
      ${row("Cost of services (COGS)",cogsArr,{neg:1,indent:1})}
      ${row("Gross profit",M.grossProfit,{total:1})}
      ${mrow("gross margin (% NGR)",M.grossProfit,M.agg.ngr)}
      ${row("Sales & marketing",smArr,{neg:1,indent:1})}
      ${row("Personnel",persArr,{neg:1,indent:1})}
      ${row("Other operating expenses",otherOpex,{neg:1,indent:1})}
      ${row("EBITDA",M.ebitda,{total:1})}
      ${mrow("EBITDA margin (% NGR)",M.ebitda,M.agg.ngr)}
      ${row("Depreciation & amortization",M.opex.amort,{neg:1,indent:1})}
      ${row("EBIT",M.ebit,{total:1})}
      ${row("Corporate income tax",M.corpTax,{neg:1,indent:1})}
      ${row("Net income",M.netIncome,{total:1})}
      ${mrow("net margin (% NGR)",M.netIncome,M.agg.ngr)}
      ${sec("Cash flow")}
      ${krow("Opening cash",b=>fmt.usd(openCash(b)))}
      ${row("EBITDA",M.ebitda,{indent:1})}
      ${row("Corporate income tax",M.corpTax,{neg:1,indent:1})}
      ${row("Platform capex",capexArr,{neg:1,indent:1})}
      ${row("License upfronts",licUpArr,{neg:1,indent:1})}
      ${row("PSP reserve movement",M.reserveDelta,{neg:1,indent:1})}
      ${row("Financing — funding rounds",M.fundingIn,{indent:1})}
      ${krow("Closing cash",b=>`<span style="font-weight:650">${fmt.usd(closeCash(b))}</span>`)}
      ${sec("KPIs")}
      ${krow("Active depositors (avg/mo)",b=>fmt.num(S(M.agg.actives,b)/b.idx.length))}
      ${krow("New FTDs (quarter)",b=>fmt.num(S(M.agg.ftds,b)))}
      ${krow("Marketing spend (quarter)",b=>fmt.usd(S(M.agg.marketing,b)))}
      ${krow("Headcount (end)",b=>fmt.num(M.opex.heads[b.idx[b.idx.length-1]]))}
      ${krow("GGR per active per month",b=>fmt.usd(S(M.agg.ggr,b)/Math.max(1,S(M.agg.actives,b))))}
    </tbody>
  </table></div></div>`;
  el.innerHTML=html;
}

function renderCash(){
  const el=document.getElementById("tab-cash");
  const N=M.N;
  const rounds=[...(A.funding||[])].sort((a,b)=>a.month-b.month);
  const roundRows=rounds.map((f,i)=>{
    const from=Math.round(f.month)-1;
    const to=(i+1<rounds.length)? Math.round(rounds[i+1].month)-2 : N-1;
    let low=Infinity, lowT=from;
    if(from<0){ low=M.openCash; lowT=-1; }
    for(let t=Math.max(0,from);t<=Math.min(N-1,to);t++){ if(M.freeCash[t]<low){low=M.freeCash[t];lowT=t;} }
    const cum=rounds.slice(0,i+1).reduce((s,x)=>s+(+x.amount||0),0);
    return `<tr>
      <td style="font-weight:650">${f.name}</td>
      <td style="text-align:center"><span class="badge" style="font-size:12px">${roundWhen(f)}</span></td>
      <td style="font-weight:650">${fmt.usd(f.amount)}</td>
      <td>${fmt.usd(cum)}</td>
      <td class="${low<0?'neg':''}">${fmt.usd(low)} <span style="color:var(--ink-3)">${lowT<0?"at launch":"at M"+(lowT+1)}</span></td>
      <td style="text-align:left;white-space:normal;color:var(--ink-2);font-size:12px;min-width:260px">${f.note||""}</td>
    </tr>`;
  }).join("");
  el.innerHTML=`<h2>Cash Flow</h2>
  <p class="sub">EBITDA less platform capex, license upfronts, and the PSP rolling-reserve float (held ${A.wc.reserveMonths} months, then released) — funded by ${rounds.length} staged rounds totalling ${fmt.usd(M.totalFunding)}. Edit rounds in Assumptions § 1.</p>
  <div class="card"><h3>When to raise — the funding schedule</h3>
  <p class="note">Each round must land before the free-cash line approaches zero. "Lowest free cash until next round" (cash \u2212 house bankroll \u2212 hot-wallet float) is the number to watch: if it goes red, the round is too small or too late. Start raising each round ~3 months before its month.</p>
  <div class="twrap"><table><thead><tr><th>Round</th><th>When</th><th>Amount</th><th>Raised so far</th><th>Lowest free cash until next round</th><th>What it funds</th></tr></thead>
  <tbody>${roundRows}</tbody></table></div></div>
  <div class="tiles">
    <div class="tile"><div class="lbl">Total external need</div><div class="val">${fmt.usd(M.peakNeed)}</div><div class="delta">deepest cumulative burn — the minimum you must raise in total</div></div>
    <div class="tile"><div class="lbl">Lowest free cash (funded plan)</div><div class="val">${fmt.usd(M.minCash)}</div><div class="delta">at month ${M.minCashMonth+1} \u00b7 after bankroll &amp; float${M.minCash<0?" — round too small or too late":""}</div></div>
    <div class="tile"><div class="lbl">EBITDA break-even</div><div class="val">${M.breakeven!=null?"M"+(M.breakeven+1):"—"}</div><div class="delta">sustained positive</div></div>
    <div class="tile"><div class="lbl">Cash at month ${M.N}</div><div class="val">${fmt.usd(M.cash[N-1])}</div><div class="delta">${M.cash[N-1]>A.meta.startingCapital?"capital returned":"still below starting capital"}</div></div>
    <div class="tile"><div class="lbl">Free cash at M${M.N}</div><div class="val">${fmt.usd(M.freeCash[N-1])}</div><div class="delta">bankroll ${fmt.usd(M.bankroll[N-1])} \u00b7 float ${fmt.usd(M.floatW[N-1])}</div></div>
    <div class="tile"><div class="lbl">PSP reserve held at M${M.N}</div><div class="val">${fmt.usd(M.reserveBal[N-1])}</div><div class="delta">cash locked at processors</div></div>
  </div>
  ${M.minCash<0?`<div class="warnbox">⚠ Free cash goes negative at month ${M.minCashMonth+1}. Move a round earlier, raise ≈ ${fmt.usd(-M.minCash)} more, or slow the marketing ramp.</div>`:""}
  <div class="grid2">
    <div class="card"><h3>Cash balance with funding rounds</h3><div class="chart" id="ch-cash2"></div></div>
    <div class="card"><h3>Monthly net cash flow</h3><div class="chart" id="ch-ncf"></div></div>
  </div>
  <div class="card"><div class="twrap" style="max-height:480px;overflow:auto"><table id="cashTable"></table></div></div>`;
  xyChart(document.getElementById("ch-cash2"),
    [{name:"Cash",color:sColor(0),values:M.cash,kind:"area"},{name:"Free cash (after bankroll & float)",color:sColor(2),values:M.freeCash}],
    {h:250,marks:rounds.filter(f=>Math.round(+f.month)>1).map((f,i)=>({t:Math.round(f.month)-1,label:roundShort(f,i)}))});
  xyChart(document.getElementById("ch-ncf"),
    [{name:"Net CF",color:sColor(2),values:M.netcf,kind:"bar"}],{h:250});
  const tbl=el.querySelector("#cashTable");
  let html="<thead><tr><th>Month</th><th>Funding in</th><th>EBITDA</th><th>Corp tax</th><th>Platform capex</th><th>License upfronts</th><th>PSP reserve Δ</th><th>PSP reserve held</th><th>Net cash flow</th><th>Cash balance</th><th>House bankroll held</th><th>Hot-wallet float</th><th>Free cash</th></tr></thead><tbody>";

      <td>${M.corpTax[t]?("−"+fmt.usd(M.corpTax[t])):"—"}</td>
      <td>${M.opex.platformCapex[t]?("−"+fmt.usd(M.opex.platformCapex[t])):"—"}</td>
      <td>${M.opex.licUpfront[t]?("−"+fmt.usd(M.opex.licUpfront[t])):"—"}</td>
      <td class="${M.reserveDelta[t]>0?'neg':''}">${M.reserveDelta[t]?fmt.usd(-M.reserveDelta[t]):"—"}</td>
      <td>${fmt.usd(M.reserveBal[t])}</td>
      <td class="${M.netcf[t]<0?'neg':''}">${fmt.usd(M.netcf[t])}</td>
      <td class="${M.cash[t]<0?'neg':''}" style="font-weight:600">${fmt.usd(M.cash[t])}</td>
      <td>${fmt.usd(M.bankroll[t])}</td><td>${fmt.usd(M.floatW[t])}</td>
      <td class="${M.freeCash[t]<0?'neg':''}" style="font-weight:600">${fmt.usd(M.freeCash[t])}</td></tr>`;
  }
  html+="</tbody>"; tbl.innerHTML=html;
}

function renderSim(){
  const el=document.getElementById("tab-sim");
  el.innerHTML=`<h2>Simulation</h2>
  <p class="sub">Stress the plan without touching base assumptions. Presets or sliders; everything compares against the base scenario. Remember the VIP reality: top 1% of players = 35–60% of GGR, so real months are lumpier than any smooth model. <b>Bear</b> is a tough market (CPA +10%, retention \u221210%, bonus 20%, hold \u22125%, revshare +10%) with management responding: hiring beyond year 2 at half the plan and the expansion throttled by the self-funding guard \u2014 the planning floor. Anything worse than that is a \u201cstop and re-plan\u201d world, not a scenario to run on.</p>
  <div class="toolbar"><div class="seg" id="presetSeg">
    <button data-p="base">Base</button><button data-p="bull">Bull</button><button data-p="bear">Bear</button>
  </div><span class="badge" id="simBadge"></span></div>
  <div class="card sliders"><h3>Drivers</h3><div class="fields" id="simFields"></div></div>
  <div class="kpi-cmp" id="simKpis"></div>
  <div class="grid2" style="margin-top:16px">
    <div class="card"><h3>Cash balance — scenario vs base</h3><div class="chart" id="ch-simcash"></div></div>
    <div class="card"><h3>Monthly EBITDA — scenario vs base</h3><div class="chart" id="ch-simebitda"></div></div>
  </div>`;
  const fieldsEl=el.querySelector("#simFields");
  const defs=[
    ["cpaMult","CPA (cost) ×",0.5,2,0.05],
    ["retMult","Retention ×",0.5,1.5,0.05],
    ["betMult","Player value ×  (engagement · VIP mix · game mix)",0.5,2,0.05],
    ["mktMult","Marketing budget ×",0.3,2,0.05],
    ["holdMult","Deposit hold ×",0.6,1.4,0.05],
    ["rsMult","Affiliate revshare ×",0.5,1.5,0.05],
    ["teamMult","Team growth after year 2 ×  (management response)",0.3,1.5,0.05]
  ];
  simLabels={};
  defs.forEach(([k,label,mn,mx,st])=>{
    const f=document.createElement("div"); f.className="f";
    const l=document.createElement("label"); f.appendChild(l);
    const inp=document.createElement("input"); inp.type="range"; inp.min=mn; inp.max=mx; inp.step=st; inp.value=SIM[k];
    const upd=()=>{ l.textContent=`${label} ${(+inp.value).toFixed(2)}`; };
    upd();
    simLabels[k]={el:l, base:()=>`${label} ${(+inp.value).toFixed(2)}`};
    inp.addEventListener("input",()=>{ SIM[k]=+inp.value; upd(); queueSim(); });
    f.appendChild(inp); fieldsEl.appendChild(f);
  });
  const bf=document.createElement("div"); bf.className="f";
  const bl=document.createElement("label"); bf.appendChild(bl);
  const bi=document.createElement("input"); bi.type="range"; bi.min=8; bi.max=30; bi.step=0.5;
  bi.value=SIM.bonusPct!=null?SIM.bonusPct:A.global.bonusPctGGR;
  const bupd=()=>{ bl.textContent=`Bonus cost % of GGR: ${(+bi.value).toFixed(1)}%`; }; bupd();
  simLabels.bonus={el:bl, base:()=>`Bonus cost % of GGR: ${(+bi.value).toFixed(1)}%`};
  bi.addEventListener("input",()=>{ SIM.bonusPct=+bi.value; bupd(); queueSim(); });
  bf.appendChild(bi); fieldsEl.appendChild(bf);
  el.querySelectorAll("#presetSeg button").forEach(b=>{
    b.onclick=()=>{
      const p=b.dataset.p;
      if(p==="base") Object.assign(SIM,{cpaMult:1,retMult:1,betMult:1,mktMult:1,bonusPct:null,holdMult:1,rsMult:1,teamMult:1});
      if(p==="bull") Object.assign(SIM,{cpaMult:0.85,retMult:1.15,betMult:1.10,mktMult:1.25,bonusPct:16,holdMult:1.05,rsMult:1,teamMult:1});
      // bear = a tough market with management responding: CPA +10%, retention −10%, bonus 20%, hold −5%, revshare +10%; hiring beyond year 2 at half plan, expansion throttled by the guard
      if(p==="bear") Object.assign(SIM,{cpaMult:1.10,retMult:0.90,betMult:1,mktMult:1,bonusPct:20,holdMult:0.95,rsMult:1.1,teamMult:0.5});
      renderSim();
    };
  });
  runSim();
}
let _st=null;
function queueSim(){ clearTimeout(_st); _st=setTimeout(runSim,200); }
function runSim(){
  const base=M;
  const sc=compute(A,SIM);
  const N=sc.N;
  const isBase=SIM.cpaMult===1&&SIM.retMult===1&&SIM.betMult===1&&SIM.mktMult===1&&SIM.bonusPct===null&&SIM.holdMult===1&&SIM.rsMult===1&&(SIM.teamMult==null||SIM.teamMult===1);
  const badge=document.getElementById("simBadge");
  const PRESETS={bull:{cpaMult:0.85,retMult:1.15,betMult:1.10,mktMult:1.25,bonusPct:16,holdMult:1.05,rsMult:1,teamMult:1},bear:{cpaMult:1.10,retMult:0.90,betMult:1,mktMult:1,bonusPct:20,holdMult:0.95,rsMult:1.1,teamMult:0.5}};
  const which=isBase?"base":(Object.keys(PRESETS).find(k=>Object.keys(PRESETS[k]).every(x=>Math.abs((+SIM[x]||0)-(+PRESETS[k][x]||0))<1e-9))||null);
  if(badge) badge.textContent=isBase?"showing base scenario":(which?which+" scenario vs base":"custom scenario vs base");
  document.querySelectorAll("#presetSeg button").forEach(b=>b.classList.toggle("on",b.dataset.p===which));
  // append the actual global figure each multiplier produces
  (()=>{
    const Ns=sc.N;
    const spendTot=sc.agg.marketing.reduce((x,y)=>x+y,0);
    const ftdTot=sc.agg.ftds.reduce((x,y)=>x+y,0);
    let m1w=0; sc.perGeo.forEach(g=>{ m1w+=g.ftds.reduce((x,y)=>x+y,0)*(g.r[1]||0); });
    const actuals={
      cpaMult:"→ blended CAC "+fmt.usd(ftdTot>0?spendTot/ftdTot:0,0)+" per depositor",
      retMult:"→ blended M1 retention "+fmt.pct(ftdTot>0?m1w/ftdTot:0,0),
      betMult:"→ GGR "+fmt.usd(sc.agg.actives[Ns-1]>0?sc.agg.ggr[Ns-1]/sc.agg.actives[Ns-1]:0,0)+" per active/mo — the outcome, not a dial you set",
      mktMult:"→ "+fmt.usd(sc.agg.marketing[Ns-1])+"/mo spend at M36 ("+fmt.usd(spendTot)+" total)",
      holdMult:"→ hold "+fmt.pct(sc.agg.deposits[Ns-1]>0?sc.agg.ggr[Ns-1]/sc.agg.deposits[Ns-1]:0,0)+" of deposits",
      rsMult:"→ effective revshare "+(A.global.affRevsharePct*SIM.rsMult).toFixed(0)+"% of NGR",
      bonus:"→ "+fmt.usd(sc.agg.bonus[Ns-1])+"/mo bonus cost at M36"
    };
    for(const k in actuals){ const sl=simLabels[k]; if(sl&&sl.el) sl.el.textContent=sl.base()+"  "+actuals[k]; }
  })();
  const kEl=document.getElementById("simKpis"); if(!kEl)return;
  function tile(lbl,scv,basev,fmtF,upGood){
    const d=scv-basev;
    const cls=d===0?"":((d>0)===upGood?"up":"down");
    return `<div class="tile"><div class="lbl">${lbl}</div><div class="val">${fmtF(scv)}</div>
      <div class="delta ${cls}">${isBase?"base":"base "+fmtF(basev)+" · "+(d>=0?"+":"−")+fmtF(Math.abs(d)).replace("−","")}</div></div>`;
  }
  kEl.innerHTML=
    tile("Cumulative EBITDA ("+N+" mo)",sc.cumEbitdaArr[N-1],base.cumEbitdaArr[base.N-1],v=>fmt.usd(v),true)+
    tile("GGR run-rate at M"+N,sc.agg.ggr[N-1]*12,base.agg.ggr[base.N-1]*12,v=>fmt.usd(v),true)+
    tile("Peak funding need",sc.peakNeed,base.peakNeed,v=>fmt.usd(v),false)+
    `<div class="tile"><div class="lbl">Break-even</div><div class="val">${sc.breakeven!=null?"M"+(sc.breakeven+1):"—"}</div><div class="delta">base ${base.breakeven!=null?"M"+(base.breakeven+1):"—"}</div></div>`+
    tile("Cash at M"+N,sc.cash[N-1],base.cash[base.N-1],v=>fmt.usd(v),true)+
    tile("Actives at M"+N,sc.agg.actives[N-1],base.agg.actives[base.N-1],v=>fmt.num(v),true);
  const cEl=document.getElementById("ch-simcash");
  if(cEl) xyChart(cEl,[
    {name:"Base",color:sColor(0),values:base.cash},
    {name:"Scenario",color:sColor(1),values:sc.cash,kind:"area"}],{h:250});
  const eEl=document.getElementById("ch-simebitda");
  if(eEl) xyChart(eEl,[
    {name:"Base",color:sColor(0),values:base.ebitda},
    {name:"Scenario",color:sColor(1),values:sc.ebitda}],{h:250});
}

/* Persistence: POST to the defaults API when deployed; file fallback otherwise. */
async function persistDefaults(json){
  if(!location.protocol.startsWith("http")) return {mode:"local-file"};
  const r=await fetch("/api/defaults?plan=luckyrain",{method:"POST",headers:{"Content-Type":"application/json"},body:json});
  if(!r.ok){ let m=""; try{ m=(await r.json()).error||""; }catch(e){} throw new Error("save failed ("+r.status+")"+(m?": "+m:"")); }
  return {mode:"db"};
}
function showDefToast(msg){
  let t=document.getElementById("defToast");
  if(!t){ t=document.createElement("div"); t.id="defToast";
    t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink-1);color:var(--surface-1);padding:12px 20px;border-radius:12px;font-size:13px;z-index:200;max-width:560px;box-shadow:0 8px 30px rgba(0,0,0,.25)";
    document.body.appendChild(t); }
  t.textContent=msg; t.style.display="block";
  clearTimeout(t._h); t._h=setTimeout(()=>{t.style.display="none";},9000);
}
const _btnSD=document.getElementById("btnSaveDefault"); if(_btnSD) _btnSD.onclick=async()=>{
  const json=JSON.stringify(A,null,2);
  try{
    const res=await persistDefaults(json);
    if(res.mode==="db"){ ASM_BASE=null; if(typeof EDITED!=="undefined"){ /* edited markers reset by re-render after reload of baseline */ } showDefToast("Saved as the new Lucky Rain default \u2014 everyone with the Lucky Rain password now sees these numbers. Previous versions are kept."); return; }
  }catch(e){ window._saveErr=String(e&&e.message||e); }
  const blob=new Blob([json],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="lucky-rain-numbers.json";
  a.click(); URL.revokeObjectURL(a.href);
  showDefToast("Could not save to the server \u2014 a copy was downloaded instead."+(window._saveErr?" Reason: "+window._saveErr:""));
};

/* Version history: every save is kept; load any earlier one onto the screen, then Save to make it the default again. */
(()=>{
  const bV=document.getElementById("btnVersions"), sel=document.getElementById("selVersions"), bL=document.getElementById("btnLoadVersion");
  if(!bV) return;
  bV.onclick=async()=>{
    try{

let SCEN_CACHE=null;
async function loadScenarios(){
  if(SCEN_CACHE) return SCEN_CACHE;
  if(!location.protocol.startsWith("http")) return null;
  const out={};
  for(const n of ["base","upside","accelerated"]){ try{ const r=await fetch("scenarios/"+n+".json",{cache:"no-store"}); if(r.ok) out[n]=await r.json(); }catch(e){} }
  SCEN_CACHE=out; return out;
}
function fundingModel(Mx,Ax){
  Mx=Mx||M; Ax=Ax||A;
  const N=Mx.N, sum=(a,i,j)=>a.slice(i,j+1).reduce((x,y)=>x+y,0);
  const sy=Ax.meta.startYear||2027, smc=Ax.meta.startCalMonth||1;
  const MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const cal=t=>{ const ab=(smc-1)+t; return MO[((ab%12)+12)%12]+" "+(sy+Math.floor(ab/12)); };
  const rounds=[...(Ax.funding||[])].filter(f=>+f.amount>0).sort((a,b)=>a.month-b.month);
  const be=Mx.breakeven;
  const held=t=>(Mx.bankroll?Mx.bankroll[t]:0)+(Mx.floatW?Mx.floatW[t]:0);
  let cum=0;
  const rows=rounds.map((f,i)=>{
    const close=Math.max(0,Math.round(+f.month)-1);
    const last=i===rounds.length-1;
    const to=last ? Math.min(N-1, Math.max(close, be!=null?be:N-1)) : Math.max(close, Math.round(+rounds[i+1].month)-2);
    cum+=+f.amount;
    let low=Infinity, lowT=close; for(let t=close;t<=to;t++){ const v=Mx.freeCash?Mx.freeCash[t]:Mx.cash[t]; if(v<low){low=v;lowT=t;} }
    const gp=sum(Mx.grossProfit,close,to), mkt=sum(Mx.mktTotal,close,to), pers=sum(Mx.opex.personnel,close,to),
      setup=Mx.opex.setup?sum(Mx.opex.setup,close,to):0, other=sum(Mx.opexTotal,close,to)-pers-setup,
      capex=sum(Mx.opex.platformCapex,close,to)+sum(Mx.opex.licUpfront,close,to), tax=sum(Mx.corpTax,close,to),
      wc=sum(Mx.reserveDelta,close,to)+(held(to)-(close>0?held(close-1):0));
    const net=gp-mkt-pers-setup-other-capex-tax-wc;
    return {f, i, close, to, last, raiseFrom:Math.max(0,close-3), cum, low, lowT,
      use:{gp,mkt,pers,setup,other,capex,tax,wc,net},
      when:cal(close), raiseWhen:close===0?"Now":(close-3<0?cal(0):cal(close-3)), coverWhen:cal(close)+" – "+cal(to)+(last&&be!=null&&to===be?" (break-even)":"")};
  });
  return {rows, cal, be, N, total:Mx.totalFunding, peak:Mx.peakNeed, minFree:Mx.minCash, minFreeT:Mx.minCashMonth};
}
function fundingGantt(el, F, opts){
  opts=opts||{};
  const rows=F.rows; if(!rows.length){ el.innerHTML=""; return; }
  const end=Math.min(F.N-1, Math.max((F.be!=null?F.be:0)+4, rows[rows.length-1].close+9));
  const W=opts.w||1000, rowH=30, padL=190, padR=20, padT=26, yBot=padT+rows.length*rowH, H=yBot+44;
  const X=t=>padL+(t/(end+1))*(W-padL-padR);
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`,role:"img"});

        ${A.games.map(g=>`<tr><td>${g.name}</td><td>${g.source==="own"?"In-house":"Provider"}</td><td>${g.rtp}%</td><td>${g.rs}%</td><td>${g.mix}%</td></tr>`).join("")}
      </table>
    </div>
    <h3>Market parameters</h3>
    <table class="rp-t rp-small">
      <tr><th>Market</th><th>Aff CPA</th><th>Media CPA</th><th>Media %</th><th>Bet ×</th><th>Hrs/mo</th><th>Ret. M1/M3/M6</th><th>Hold</th><th>Tax</th><th>Bonus</th><th>Dep. fee</th><th>Reserve</th><th>Mkt start</th><th>Launch budget</th><th>Cap</th></tr>
      ${geos.map(g=>`<tr><td>${g.name}</td><td>$${g.cpaAff}</td><td>$${g.cpaMedia}</td><td>${g.mediaSharePct}%</td><td>${g.betMult}</td><td>${g.hours}</td><td>${g.m1}/${g.m3}/${g.m6}%</td><td>${g.hold}%</td><td>${g.tax}%</td><td>${g.bonusPct!=null&&g.bonusPct!==""?g.bonusPct:A.global.bonusPctGGR}%</td><td>${g.feeDep}%</td><td>${g.resPct}%</td><td>M${g.mkStart}</td><td>${u(g.mkInit)}</td><td>${u(g.mkCap)}</td></tr>`).join("")}
    </table>
    <div class="rp-note">Lucky Rain business plan summary · generated ${dstr} · figures are model outputs, not forecasts or guarantees.</div>
  </section>`;

  // charts (SVG)
  const W=640;
  fundingGantt(document.getElementById("rpc-gantt"),F,{w:1000});
  xyChart(document.getElementById("rpc-pl"),[{name:"Net revenue (NGR)",color:sColor(0),values:M.agg.ngr},{name:"EBITDA",color:sColor(2),values:M.ebitda}],{w:W,h:250});
  xyChart(document.getElementById("rpc-mkt"),perGeo.map((g,i)=>({name:g.name,color:sColor(i),values:g.spend})),{w:W,h:250,stacked:true});
  xyChart(document.getElementById("rpc-cash"),[{name:"Cash",color:sColor(0),values:M.cash,kind:"area"},{name:"Free cash",color:sColor(2),values:M.freeCash}],{w:W,h:250,marks:rounds.filter(f=>Math.round(+f.month)>1).map(f=>({t:Math.round(f.month)-1,label:roundShort(f,0)}))});
  xyChart(document.getElementById("rpc-ncf"),[{name:"Operating cash flow",color:sColor(2),values:M.netcf,kind:"bar"}],{w:W,h:250});
  xyChart(document.getElementById("rpc-act"),perGeo.map((g,i)=>({name:g.name,color:sColor(i),values:g.actives})),{w:W,h:250,stacked:true,fmt:v=>fmt.num(v)});
}
async function printReport(){
  const r=document.documentElement, prevTheme=r.dataset.theme, prevTitle=document.title;
  try{ await loadScenarios(); }catch(e){}
  r.dataset.theme="light";                       // print always in light colours
  buildReport();
  document.title="Lucky Rain - Business Plan Summary - "+new Date().toISOString().slice(0,10);
  const restore=()=>{ document.title=prevTitle; if(prevTheme) r.dataset.theme=prevTheme; else delete r.dataset.theme;
    if(prevTheme==="dark") renderTab(activeTab); window.removeEventListener("afterprint",restore); };
  window.addEventListener("afterprint",restore);
  setTimeout(()=>window.print(),150);
}
document.getElementById("btnReport").onclick=printReport;
</script>
<div id="report"></div>
</body>
</html>
