<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rain Gibraltar — Operating Model</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Crect%20width%3D'100'%20height%3D'100'%20rx%3D'20'%20fill%3D'%23eda100'%2F%3E%3Ctext%20x%3D'50'%20y%3D'72'%20font-size%3D'60'%20text-anchor%3D'middle'%3ER%3C%2Ftext%3E%3C%2Fsvg%3E">
<style>
  :root{
    color-scheme: light;
    --surface-1:#fcfcfb; --page:#f9f9f7;
    --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
    --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
    --good-text:#006300;
    --seq100:#cde2fb; --seq200:#9ec5f4; --seq300:#6da7ec; --seq400:#3987e5; --seq500:#256abf; --seq600:#184f95; --seq700:#0d366b;
    --accent:#2a78d6;
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --surface-1:#1a1a19; --page:#0d0d0d;
    --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --good-text:#0ca30c;
    --accent:#3987e5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--page);color:var(--ink-1);font-size:13.5px;line-height:1.45}
  /* ---------- Top nav ---------- */
  header{position:sticky;top:0;z-index:50;background:var(--surface-1);border-bottom:1px solid var(--grid);padding:0 20px}
  .hd-row{display:flex;align-items:center;gap:12px 16px;min-height:52px;flex-wrap:wrap;padding:6px 0}
  .brand{font-weight:700;font-size:14px;letter-spacing:-0.01em;white-space:nowrap}
  .brand span{color:var(--accent)}
  nav{display:flex;gap:2px 1px;flex-wrap:wrap;overflow:visible;flex:1;min-width:0}
  nav button{appearance:none;border:none;background:none;color:var(--ink-2);font:inherit;font-size:13px;font-weight:500;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
  nav button:hover{background:var(--page)}
  nav button.on{background:var(--accent);color:#fff}
  .hd-actions{display:flex;gap:8px;align-items:center}
  .ghost-btn{appearance:none;border:1px solid var(--grid);background:var(--surface-1);color:var(--ink-2);font:inherit;font-size:12.5px;padding:6px 11px;border-radius:8px;cursor:pointer}
  .ghost-btn:hover{border-color:var(--axis);color:var(--ink-1)}
  main{max-width:1280px;margin:0 auto;padding:20px 20px 80px}
  .tab{display:none}
  .tab.on{display:block}
  h2{font-size:18px;margin:6px 0 2px;letter-spacing:-0.01em}
  .sub{color:var(--ink-2);margin:0 0 16px;font-size:13px}
  /* ---------- Cards & grids ---------- */
  .card{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:16px}
  .card h3{margin:0 0 4px;font-size:13.5px;font-weight:650}
  .card .note{color:var(--ink-3);font-size:12px;margin:0 0 10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
  @media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
  /* ---------- Stat tiles ---------- */
  .tile{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
  .tile .lbl{color:var(--ink-2);font-size:12px;margin-bottom:4px}
  .tile .val{font-size:26px;font-weight:600;letter-spacing:-0.02em}
  .tile .delta{font-size:12px;margin-top:3px;color:var(--ink-3)}
  .tile .delta.up{color:var(--good-text)} .tile .delta.down{color:var(--crit)}
  .hero .val{font-size:31px;white-space:nowrap}
  .story{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
  .story .st{background:var(--surface-1);border:1px solid var(--border);border-top:3px solid var(--ph,var(--accent));border-radius:12px;padding:11px 13px;position:relative}
  .story .st:not(:last-child)::after{content:"›";position:absolute;right:-10px;top:36%;color:var(--ink-3);font-size:17px;z-index:2}
  .st-k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700}
  .st-v{font-size:21px;font-weight:700;letter-spacing:-0.02em;margin:2px 0;white-space:nowrap}
  .st-d{font-size:11px;color:var(--ink-2)}
  .tiles.mini .tile{padding:9px 12px}
  .tiles.mini .val{font-size:18px}
  .tiles.mini .lbl{font-size:11px;margin-bottom:2px}
  @media(max-width:1000px){.story{grid-template-columns:repeat(3,1fr)}}
  /* ---------- Inputs ---------- */
  .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px}
  .f{display:flex;flex-direction:column;gap:3px}
  .f label{font-size:11.5px;color:var(--ink-2)}
  .f input,.f select{font:inherit;padding:6px 8px;border:1px solid var(--grid);border-radius:8px;background:var(--page);color:var(--ink-1);width:100%}
  .f input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  .f .unit{font-size:10.5px;color:var(--ink-3)}
  /* ---------- Tables ---------- */
  .twrap{overflow-x:auto;border:1px solid var(--grid);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{padding:6px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
  th{color:var(--ink-2);font-weight:600;background:var(--surface-1);position:sticky;top:0}
  td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--surface-1);font-variant-numeric:normal}
  tr:last-child td{border-bottom:none}
  tr.total td{font-weight:650;border-top:2px solid var(--axis)}
  tr.section td{color:var(--ink-3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding-top:12px}
  td.neg{color:var(--crit)}
  table input.wide{width:118px !important}
  table input{width:76px;font:inherit;font-size:12.5px;padding:4px 6px;border:1px solid var(--grid);border-radius:6px;background:var(--page);color:var(--ink-1);text-align:right}
  table input[type=checkbox]{width:auto}
  table select{font:inherit;font-size:12.5px;padding:4px;border:1px solid var(--grid);border-radius:6px;background:var(--page);color:var(--ink-1)}
  table input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .editable th,.editable td{text-align:left}
  /* ---------- Charts ---------- */
  .chart{position:relative}
  .chart svg{display:block;width:100%;height:auto}
  .legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0 2px;font-size:12px;color:var(--ink-2)}
  .legend .it{display:flex;align-items:center;gap:6px}
  .legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
  .tip{position:fixed;pointer-events:none;background:var(--surface-1);border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.12);border-radius:10px;padding:8px 11px;font-size:12px;z-index:100;display:none;min-width:130px}
  .tip .t-h{font-weight:650;margin-bottom:4px}
  .tip .t-r{display:flex;justify-content:space-between;gap:14px}
  .tip .t-r .k{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
  .tip .t-r .v{font-variant-numeric:tabular-nums;font-weight:550}
  .badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:99px;border:1px solid var(--grid);color:var(--ink-2)}
  .badge.own{color:var(--good-text);border-color:var(--good-text)}
  .rowbtns button{appearance:none;border:none;background:none;color:var(--ink-3);cursor:pointer;font-size:14px;padding:2px 5px}
  .rowbtns button:hover{color:var(--crit)}
  .addbtn{margin-top:10px}
  .seg{display:inline-flex;border:1px solid var(--grid);border-radius:9px;overflow:hidden}
  .seg button{appearance:none;border:none;background:var(--surface-1);color:var(--ink-2);font:inherit;font-size:12.5px;padding:6px 13px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .warnbox{border-left:3px solid var(--warn);background:var(--surface-1);border-radius:0 10px 10px 0;padding:10px 14px;font-size:12.5px;color:var(--ink-2);margin-bottom:14px}
  .sliders .f input[type=range]{padding:0;accent-color:var(--accent)}
  .kpi-cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  footer{text-align:center;color:var(--ink-3);font-size:11.5px;margin-top:30px}
  /* gamified attention pulse on the Simulation tab (until first visit) */
  @keyframes simPulse{0%,100%{box-shadow:0 0 0 0 rgba(42,120,214,.5)}60%{box-shadow:0 0 0 9px rgba(42,120,214,0)}}
  .sim-cta{appearance:none;border:1px solid var(--accent);background:transparent;color:var(--accent);font:inherit;font-size:13px;font-weight:650;padding:6px 15px;border-radius:99px;cursor:pointer;white-space:nowrap;animation:simPulse 2s ease-out infinite}
  .sim-cta:hover{background:var(--accent);color:#fff}
  .sim-cta.on{background:var(--accent);color:#fff;animation:none}
  @media (prefers-reduced-motion: reduce){.sim-cta{animation:none}}
</style>
</head>
<body>
<header>
  <div class="hd-row">
    <div class="brand">Rain <span>Gibraltar</span> — Playmarkets & Rain B2C</div>

      <button class="ghost-btn" id="btnTheme" title="Toggle dark mode">◐</button>
    </div>

</header>
<main>

</main>

<script>
"use strict";
/* ============================================================
   RAIN GAMING — CASINO OPERATING MODEL
   Engine: cohort-based monthly model, 36 months, USD.
   ============================================================ */

/* ---------- Default assumptions (from research, Aug 2026) ---------- */
var defaultAssumptions = function(){ return {
  meta:{months:36, startingCapital:6500000, startYear:2026, startCalMonth:9},
  funding:[
    {name:"Round 1 — Foundation", month:1, amount:2500000, note:"Founding six, platform build, Curaçao LOK, soft launch in 2 GEOs — capped at $2.5M founder commitment"},
    {name:"Round 2 — Launch",     month:6, amount:4500000, note:"Full launch marketing across all GEOs; prove cohort payback (the smoking gun)"},
    {name:"Round 3 — Scale-up",   month:10, amount:7000000, note:"The boost: proven ROI → deploy at ×3.5 budgets through break-even. Biggest round because every $ now buys known-payback players"}
  ],
  global:{
    bonusPctGGR:18,          // bonus cost, % of GGR (research 10–25%)
    fraudPctGGR:3,           // fraud + bonus abuse losses, % of GGR
    kycPerFTD:2.0,           // $ per new depositor (Sumsub $1.35–1.85 + ops)
    supportPerActive:1.5,    // $ per active depositor / month (outsourced)
    crmMonthly:6000,         // Optimove-class CRM
    toolsMonthly:3000,       // affiliate platform + BI + misc SaaS
    brandMonthly:30000,      // streamers / sponsorships budget
    brandStartMonth:4,
    rsShareAff:40,           // % of affiliate FTDs on revshare deals (rest are CPA deals)
    affRevsharePct:30,       // % of NGR paid on revshare-acquired players
    organicPct:15,           // organic/brand FTDs as % of paid FTDs — GLOBAL, not a per-GEO lever
    retMultAff:1.05,         // retention quality vs GEO base: affiliate traffic (high intent)
    retMultMedia:0.85,       // media-buy traffic retains worse
    retMultOrganic:1.25,     // organic retains best
    jackpotPctWager:0,       // optional jackpot contribution % of turnover
    feeCompressPP:2,         // PSP deposit-fee reduction (pp) earned at full volume
    feeCompressAtDep:3000000,// GEO monthly deposits at which full compression is reached
    scaleMonth:7,            // "smoking gun" month: proven ROI → aggressive scale-up
    scaleMult:3.5            // marketing budget multiplier from that month (breaks caps)
  },
  personnel:[
    // Minimum viable team → scale. dept groups the Team tab; wk1 marks this-week hires;
    // note = mandate & first-90-days focus. h = heads in Y1 / Y2 / Y3 (from start month).
    {role:"CEO (Roy)", dept:"Executive", phase:"core", salary:25000, bonus:0, start:1, h:[1,1,1], wk1:true,
     note:"Capital, licensing, key vendor deals (platform, aggregator, PSPs), hiring the founding five."},
    {role:"CTO", dept:"Engineering", phase:"core", salary:20000, bonus:0, start:1, h:[1,1,1], wk1:true,
     note:"Own-platform architecture, build vs buy per component, hire 3 engineers in 60 days. 90-day KPI: staging platform with cashier + 1 aggregator integrated."},
    {role:"Head of Product", dept:"Product", phase:"core", salary:15000, bonus:0, start:1, h:[1,1,1], wk1:true,
     note:"Site UX, lobby, bonus engine spec, game roadmap incl. the 2 in-house titles. 90-day KPI: soft-launch product live in 1 geo."},
    {role:"Head of User Acquisition", dept:"User Acquisition", phase:"core", salary:9000, bonus:25000, start:1, h:[1,1,1], wk1:true,
     note:"Base $9K + up to $25K/mo performance bonus, paid on quarterly results. 90-day KPI: 20 affiliate contracts signed, first 500 FTDs, CPA within 20% of model."},
    {role:"Head of Payments & Risk", dept:"Payments & Risk", phase:"core", salary:11000, bonus:5000, start:1, h:[1,1,1], wk1:true,
     note:"Base $11K + up to $5K/mo bonus on cashier approval rate and blended processing cost — never on volume. 2 crypto rails + 2 high-risk PSPs live pre-launch; cashier approval rate >80%; fraud rules. Owns hold %, reserve terms, chargebacks."},
    {role:"Compliance Officer / MLRO", dept:"Compliance", phase:"core", salary:9000, bonus:0, start:1, h:[1,1,2], wk1:true,
     note:"File Curaçao LOK THIS MONTH (3–5 mo lead time gates launch). KYC/AML program, RG policies, geo-blocking matrix."},
    {role:"Legal advisor (external retainer)", dept:"Compliance", phase:"core", salary:5000, bonus:0, start:1, h:[1,1,1], wk1:true,
     note:"External gaming counsel on retainer — entity structuring, LOK application pack, PSP/provider contracts, ad-compliance opinions per GEO. Not headcount; scales to ad-hoc billing in G&A."},
    {role:"Head of CRM & Monetization", dept:"Monetization/CRM", phase:"growth", salary:8000, bonus:8000, start:2, h:[1,1,1],
     note:"Base $8K + up to $8K/mo bonus on retention & NGR-per-active targets. Bonus economics (hold bonus cost ≤ target % GGR), lifecycle campaigns, CRM stack selection. 90-day KPI: D30 depositor retention ≥ model M1."},
    {role:"Casino Manager (curation & integrations)", dept:"Product", phase:"growth", salary:8500, bonus:4000, start:2, h:[1,1,2],
     note:"Base $8.5K + up to $4K/mo bonus on game-mix GGR vs the Games-sheet targets and lobby conversion. Curates the portfolio and lobby merchandising, owns provider/aggregator relationships and the new-game integration pipeline, RTP variants & jackpot config per market. The commercial owner of the casino floor."},
    {role:"Platform engineers", dept:"Engineering", phase:"growth", salary:11000, bonus:0, start:2, h:[3,6,8],
     note:"PAM, wallet, cashier, integrations, site."},
    {role:"Game devs (in-house studio)", dept:"Games Studio", phase:"growth", salary:11000, bonus:0, start:4, h:[1,2,3],
     note:"Crash + instant titles = the 20% internal-GGR margin play. Ship title #1 by M6, #2 by M9."},
    {role:"Affiliate managers", dept:"User Acquisition", phase:"growth", salary:5500, bonus:5000, start:2, h:[1,2,3],
     note:"Base $5.5K + up to $5K/mo bonus on payback-qualified FTDs (not raw volume). Program ops, deal compliance, affiliate fraud watch."},
    {role:"Media buyers", dept:"User Acquisition", phase:"growth", salary:5500, bonus:6000, start:3, h:[1,2,3],
     note:"Base $5.5K + up to $6K/mo bonus on 90-day ROAS per geo. PPC/social/push per geo playbooks."},
    {role:"CRM executives", dept:"Monetization/CRM", phase:"later", salary:5000, bonus:3500, start:6, h:[1,2,3],
     note:"Base $5K + up to $3.5K/mo bonus on retention & reactivation uplift. Campaign ops per geo cluster."},
    {role:"VIP managers", dept:"VIP", phase:"growth", salary:5500, bonus:8000, start:4, h:[1,3,5],
     note:"Base $5.5K + up to $8K/mo bonus on managed-book NGR & VIP retention. Top 1% of players = 35–60% of GGR. Personal hosts from first 1,000 FTDs; reinvestment 15–25% of VIP GGR; ratio ~1 host per 150–250 VIPs."},
    {role:"Risk & fraud analysts", dept:"Payments & Risk", phase:"later", salary:7500, bonus:0, start:6, h:[1,2,3],
     note:"Salary-only by design — bonusing risk staff on volume creates the wrong incentive. Bonus-abuse rings, multi-accounting, payment fraud, AML alerts."},
    {role:"Product designer", dept:"Product", phase:"growth", salary:8500, bonus:0, start:3, h:[1,2,2],
     note:"Site, promos, game art for in-house titles."},
    {role:"Data analysts", dept:"Data", phase:"growth", salary:9000, bonus:0, start:3, h:[1,2,3],
     note:"Cohort/LTV tracking vs this model; the smoking-gun dashboard that triggers the marketing scale-up."},
    {role:"Support leads", dept:"Support", phase:"growth", salary:5000, bonus:0, start:4, h:[1,2,3],
     note:"Manage outsourced 24/7 agents (variable cost per active)."},
    {role:"Finance & admin", dept:"Finance & Ops", phase:"growth", salary:8000, bonus:0, start:3, h:[1,1,2],
     note:"Multi-entity bookkeeping, PSP reconciliation, treasury incl. crypto."}
  ],
  bonusAttainPct:50,         // expected attainment of max performance bonuses (% — accrued monthly, paid quarterly)
  payrollLoad:28,            // employer cost on top of gross: social contributions, benefits, insurance, recruiting
  platform:{                 // OWN platform (chosen operating model)
    capexTotal:700000, capexMonths:9,  // external build spend, months 1..capexMonths
    amortMonths:24                     // straight-line amortization after build (EBIT line)
  },
  cogs:{
    hostingStart:8000, hostingStartMonth:3, hostingGrowthPct:3, hostingCap:45000, // infra
    softwareMonthly:10000, softwareStartMonth:6,  // PAM components, game servers, certs
    aggregatorMin:5000,                            // aggregator minimum fees, $/mo
    antifraudMonthly:2500                          // fraud/bonus-abuse tooling
  },
  ga:{ legal:4000, office:5000, travel:4000, misc:5000, contingencyPct:5 },  // legal = ad-hoc beyond the retainer on the team sheet  // G&A $/mo + contingency % of opex
  corpTaxPct:10,             // corporate income tax on positive EBIT (Curaçao ~0%; onshore entities/substance push blended rate up)
  wc:{ reserveMonths:4 },    // PSP rolling reserve held N months (per-GEO % below)
  licenses:[
    {name:"Curaçao LOK", enabled:true,  upfront:100000,  annual:85000,  startMonth:1},
    {name:"Brazil SPA (federal)", enabled:false, upfront:5200000, annual:600000, startMonth:6},
    {name:"Anjouan (backup)", enabled:false, upfront:40000, annual:18000, startMonth:1}
  ],
  games:[
    // source: 'ext' external provider (revshare % of game GGR) | 'own' in-house
    // Mixes calibrated for the 80/20 structure: NORMAL CASINO (RNG, non-live) ~57% of GGR
    // + live 19% + tables/poker/scratch ~4% = external 80%; own crash+instant = 20%.
    // --- Normal casino (RNG, external) ---
    {id:"vslots", name:"Video slots",             source:"ext", rs:12, rtp:95.5, velocity:400, avgBet:0.90, mix:39},
    {id:"jslots", name:"Jackpot slots (progressive)", source:"ext", rs:13, rtp:92.0, velocity:350, avgBet:1.00, mix:4},
    {id:"roul",   name:"RNG roulette",            source:"ext", rs:10, rtp:97.3, velocity:100, avgBet:4.00, mix:4},
    {id:"bj",     name:"RNG blackjack",           source:"ext", rs:10, rtp:99.0, velocity:180, avgBet:6.00, mix:2.5},
    {id:"vpoker", name:"Video poker",             source:"ext", rs:10, rtp:99.2, velocity:200, avgBet:2.50, mix:5},
    {id:"scratch",name:"Scratch & instant win",   source:"ext", rs:12, rtp:95.0, velocity:250, avgBet:1.00, mix:1.5},
    // --- Live (external) ---
    {id:"live",   name:"Live casino",             source:"ext", rs:15, rtp:97.5, velocity:60,  avgBet:25.0, mix:7},
    // --- In-house originals ---
    {id:"crash",  name:"Crash (own)",             source:"own", rs:0,  rtp:97.0, velocity:180, avgBet:2.00, mix:18},
    {id:"inst",   name:"Instant — Plinko/Mines (own)", source:"own", rs:0, rtp:98.0, velocity:150, avgBet:1.50, mix:19}
  ],
  geos:[

function retentionCurve(g, months, retMult){
  const m1=clamp(g.m1/100*retMult,0,0.95), m3=clamp(g.m3/100*retMult,0,m1), m6=clamp(g.m6/100*retMult,0.001,m3);

  r[3]=m3;
  const f36=Math.pow(m6/m3,1/3);
  r[4]=m3*f36; r[5]=m3*f36*f36; r[6]=m6;
  const f=clamp(f36,0.01,0.985); // continued monthly decay after m6
  for(let a=7;a<months;a++) r[a]=r[a-1]*f;
  return r;
}

// Per-game per-hour economics at Tier-1 base bet
function gameHourly(games, betMult, mixOv){
  let turn=0, ggr=0, content=0;
  const per=[];
  const mval=g=> (mixOv && mixOv[g.id]!=null) ? +mixOv[g.id] : (+g.mix||0);
  const mixSum=games.reduce((s,g)=>s+mval(g),0)||1;
  for(const g of games){
    const mix=mval(g)/mixSum;
    const t=mix*g.velocity*g.avgBet;                 // turnover/hr
    const e=t*(1-g.rtp/100);                          // GGR/hr
    const c=e*(g.source==="ext"?g.rs/100:0);          // content cost/hr
    per.push({id:g.id,name:g.name,turn:t,ggr:e,content:c,source:g.source});
    turn+=t; ggr+=e; content+=c;
  }
  return {turn:turn*betMult, ggr:ggr*betMult, content:content*betMult, per, contentPct: ggr>0?content/ggr:0};
}

    const actives=Array(N).fill(0), activesRS=Array(N).fill(0);
    for(const c of CHANNELS){
      rCh[c.key]=retentionCurve(g, N, S.retMult*c.retMult());
      const a=Array(N).fill(0);
      for(let t=0;t<N;t++) for(let cm=0;cm<=t;cm++) a[t]+=fCh[c.key][cm]*rCh[c.key][t-cm];
      aCh[c.key]=a;
      for(let t=0;t<N;t++) actives[t]+=a[t];
      if(c.key==="affrs") for(let t=0;t<N;t++) activesRS[t]+=a[t];
    }

    const row={ id:g.id, name:g.name, ggrPerActive, turnPerActive, contentPct, hold,
      spend, ftds, ftdsCh:fCh, activesCh:aCh, rCh, actives,
      ggr:Array(N).fill(0), bonus:Array(N).fill(0), ngr:Array(N).fill(0), content:Array(N).fill(0),
      pay:Array(N).fill(0), tax:Array(N).fill(0), affrs:Array(N).fill(0), contribution:Array(N).fill(0),
      deposits:Array(N).fill(0), withdrawals:Array(N).fill(0), turnover:Array(N).fill(0) };

    for(let t=0;t<N;t++){
      const ggr = actives[t]*ggrPerActive;
      const turnover = actives[t]*turnPerActive;
      const deposits = ggr/hold;
      const withdrawals = Math.max(0, deposits-ggr);
      const bonus = ggr*bonusPct;
      const jackpot = turnover*(A.global.jackpotPctWager/100);
      const ngr = ggr - bonus - jackpot;
      const content = ggr*contentPct;
      // PSP fee compression: negotiated down as the GEO's monthly volume grows
      const _comp=A.global.feeCompressPP||0, _thr=A.global.feeCompressAtDep||0;
      const effDepFee=Math.max(1, g.feeDep - (_thr>0? _comp*Math.min(1,deposits/_thr) : 0));
      const pay = deposits*(effDepFee/100) + withdrawals*(g.feeWd/100);
      const tax = ggr*(g.tax/100);
      const rsActiveShare = actives[t]>0 ? activesRS[t]/actives[t] : 0;
      const affrs = ngr*rsActiveShare*affRS;   // revshare paid on RS-acquired players' NGR
      const contribution = ngr - content - pay - tax - affrs;
      row.turnover[t]=turnover; row.ggr[t]=ggr; row.bonus[t]=bonus+jackpot; row.ngr[t]=ngr;
      row.content[t]=content; row.pay[t]=pay; row.tax[t]=tax; row.affrs[t]=affrs;
      row.contribution[t]=contribution; row.deposits[t]=deposits; row.withdrawals[t]=withdrawals;
      agg.turnover[t]+=turnover; agg.ggr[t]+=ggr; agg.bonus[t]+=bonus+jackpot; agg.ngr[t]+=ngr;
      agg.content[t]+=content; agg.pay[t]+=pay; agg.tax[t]+=tax; agg.affrs[t]+=affrs;
      agg.contribution[t]+=contribution; agg.marketing[t]+=spend[t]; agg.ftds[t]+=ftds[t]; agg.actives[t]+=actives[t];
      agg.deposits[t]+=deposits; agg.withdrawals[t]+=withdrawals;
      agg.reserveIn[t]+=deposits*((g.resPct||0)/100);
    }
    // game split for this geo (constant proportions)
    const ghSplit = gameHourly(A.games, 1, g.mixOverride);
    for(const p of ghSplit.per){
      const share = ghSplit.ggr>0 ? p.ggr/ghSplit.ggr : 0;
      for(let t=0;t<N;t++) ggrByGame[p.id][t]+= row.ggr[t]*share;
    }

    /* ---- unit economics per FTD, channel-blended ---- */
    const fTot={}; let fSum=0;
    CHANNELS.forEach(c=>{ fTot[c.key]=fCh[c.key].reduce((a,b)=>a+b,0); fSum+=fTot[c.key]; });
    const w={}; CHANNELS.forEach(c=>w[c.key]=fSum>0?fTot[c.key]/fSum:0.25);
    row.r=Array.from({length:N},(_,a2)=>CHANNELS.reduce((sm,c)=>sm+w[c.key]*rCh[c.key][a2],0));
    const spendTot=spend.reduce((a,b)=>a+b,0);
    const effCAC = fSum>0 ? spendTot/fSum : 0;   // paid spend ÷ ALL new depositors (incl. RS + organic)
    const ngrPA = ggrPerActive*(1-bonusPct);
    const varPA = ngrPA - ggrPerActive*contentPct
      - (ggrPerActive/hold)*(g.feeDep/100) - Math.max(0,ggrPerActive/hold-ggrPerActive)*(g.feeWd/100)
      - ggrPerActive*(g.tax/100);
    const cum=[]; let acc=0, payback=null, ltv36=0, ltv6=0, ltv12=0;
    for(let a2=0;a2<N;a2++){
      let c_a=0, n_a=0;
      for(const c of CHANNELS){
        const rr=w[c.key]*rCh[c.key][a2];
        c_a += rr*(varPA - (c.key==="affrs"? ngrPA*affRS : 0));
        n_a += rr*ngrPA;
      }
      acc+=c_a; cum.push(acc);
      ltv36+=n_a; if(a2<6)ltv6+=n_a; if(a2<12)ltv12+=n_a;
      if(payback===null && acc>=effCAC) payback=a2;
    }
    row.unit={effCAC, contribPerFTD: cum.length?cum[0]:0, cumContrib:cum, payback, ltvNGR36:ltv36, ltvNGR6:ltv6, ltvNGR12:ltv12,
      ltvCac: effCAC>0? cum[N-1]/effCAC : Infinity };
    perGeo.push(row);
  }

  /* ---- COGS, Opex, EBITDA, EBIT ---- */
  const Z=()=>Array(N).fill(0);
  const opex={ personnel:Z(), heads:Z(), hosting:Z(), software:Z(), aggregator:Z(), antifraud:Z(),
    legal:Z(), office:Z(), travel:Z(), gaMisc:Z(), contingency:Z(),
    platformCapex:Z(), amort:Z(), licAnnual:Z(), licUpfront:Z(), kyc:Z(), support:Z(),
    crmTools:Z(), brand:Z(), fraud:Z() };
  const grossProfit=Z(), mktTotal=Z(), contribAfterMkt=Z(), opexTotal=Z(),
        ebitda=Z(), ebit=Z(), corpTax=Z(), netIncome=Z(), cash=Z(), netcf=Z(), cumEbitdaArr=Z(),
        reserveBal=Z(), reserveDelta=Z(), cogsTotal=Z();
  // Funding rounds (migration: old exports carry only startingCapital)
  if(!A.funding || !A.funding.length)
    A.funding=[{name:"Founding capital", month:1, amount:A.meta.startingCapital||0, note:""}];
  const fundingIn=Z();
  for(const f of A.funding){ const m=Math.round(+f.month)-1; if(m>=0&&m<N) fundingIn[m]+=(+f.amount||0); }
  const totalFunding=fundingIn.reduce((a,b)=>a+b,0);
  let bal=0, cumOp=0, maxNeed=0, breakeven=null, minCash=Infinity, minCashMonth=0, cumEbitda=0, cumTaxable=0;
  const K=Math.max(0,Math.round(A.wc.reserveMonths||0));
  for(let t=0;t<N;t++){
    const per=personnelAt(A,t+1);
    opex.personnel[t]=per.cost; opex.heads[t]=per.heads;
    opex.hosting[t]=hostingAt(A.cogs,t+1);
    opex.software[t]=(t+1>=A.cogs.softwareStartMonth)?A.cogs.softwareMonthly:0;
    opex.aggregator[t]=(t+1>=(A.cogs.aggregatorStartMonth||1))?A.cogs.aggregatorMin:0;
    opex.antifraud[t]=A.cogs.antifraudMonthly;
    opex.legal[t]=A.ga.legal; opex.office[t]=A.ga.office; opex.travel[t]=A.ga.travel; opex.gaMisc[t]=A.ga.misc;
    opex.platformCapex[t]=platformCapexAt(A.platform,t+1);
    opex.amort[t]=amortAt(A.platform,t+1);
    const lc=licenseCost(A.licenses,t+1);
    opex.licAnnual[t]=lc.annual; opex.licUpfront[t]=lc.upfront;
    opex.kyc[t]=agg.ftds[t]*A.global.kycPerFTD;
    opex.support[t]=agg.actives[t]*A.global.supportPerActive;
    opex.crmTools[t]=A.global.crmMonthly+A.global.toolsMonthly;
    opex.brand[t]= (t+1>=A.global.brandStartMonth)? A.global.brandMonthly*S.mktMult : 0;
    opex.fraud[t]=agg.ggr[t]*(A.global.fraudPctGGR/100);
    // COGS: direct cost of delivering the gaming service
    cogsTotal[t]=agg.content[t]+agg.pay[t]+agg.tax[t]+opex.kyc[t]
      +opex.hosting[t]+opex.software[t]+opex.aggregator[t];
    grossProfit[t]=agg.ngr[t]-cogsTotal[t];
    // Marketing all-in
    mktTotal[t]=agg.marketing[t]+agg.affrs[t]+opex.brand[t];
    contribAfterMkt[t]=grossProfit[t]-mktTotal[t];
    // Opex below the line
    const opexSub=opex.personnel[t]+opex.support[t]+opex.crmTools[t]+opex.antifraud[t]
      +opex.legal[t]+opex.office[t]+opex.travel[t]+opex.gaMisc[t]
      +opex.licAnnual[t]+opex.fraud[t];
    opex.contingency[t]=opexSub*((A.ga.contingencyPct||0)/100);
    opexTotal[t]=opexSub+opex.contingency[t];
    ebitda[t]=contribAfterMkt[t]-opexTotal[t];
    ebit[t]=ebitda[t]-opex.amort[t];
    cumTaxable+=ebit[t]; corpTax[t]=(cumTaxable>0? Math.min(Math.max(0,ebit[t]),cumTaxable)*((A.corpTaxPct||0)/100) : 0);  // 15% with loss carryforward
    netIncome[t]=ebit[t]-corpTax[t];
    cumEbitda+=ebitda[t]; cumEbitdaArr[t]=cumEbitda;
    // Working capital: rolling PSP reserve (held K months, then released)
    const released = (t-K>=0)? agg.reserveIn[t-K] : 0;
    reserveDelta[t]=agg.reserveIn[t]-released;
    reserveBal[t]=(t>0?reserveBal[t-1]:0)+reserveDelta[t];
    netcf[t]=ebitda[t]-corpTax[t]-opex.platformCapex[t]-opex.licUpfront[t]-reserveDelta[t];
    cumOp+=netcf[t]; if(-cumOp>maxNeed)maxNeed=-cumOp;   // true external cash the business consumes
    bal+=netcf[t]+fundingIn[t]; cash[t]=bal;
    if(bal<minCash){minCash=bal;minCashMonth=t;}
  }
  for(let t=0;t<N;t++){ if(ebitda[t]>0 && (t===N-1||ebitda[t+1]>0)){breakeven=t;break;} }
  const peakNeed = Math.max(0, maxNeed);

  return {N, perGeo, agg, opex, ebitda, ebit, corpTax, netIncome, cumEbitdaArr, netcf, cash, breakeven, minCash, minCashMonth, peakNeed, ggrByGame, fundingIn, totalFunding,
    grossProfit, mktTotal, contribAfterMkt, opexTotal, cogsTotal, reserveBal, reserveDelta,
    bonusPct, affRS, channels:CHANNELS.map(c=>({key:c.key,name:c.name}))};
}

/* ============================================================
   RAIN B2C (PREDICTION MARKETS) ENGINE + GROUP CONSOLIDATION
   Parallel model to the casino engine above. Pure functions.
   ============================================================ */
function pmDefaults(){
  return {
    seedUsers:12500, spend1:200000,
    growth:[{m:6,pct:21},{m:6,pct:8},{m:6,pct:8},{m:6,pct:2},{m:12,pct:1}],
    organic0:20, organicStep1:1, organicStep2:0.5,
    ltvCore:175, ltvHV:400, hvSharePct:10, lifetimeMonths:24,
    cpaCore:75, cpaHV:200,
    takeRatePct:1.795, overallFeePct:3.625,
    cogsPctNPR:8, buildersPctVol:0.1, brand1:15000, brandGrowthPct:5,
    tvl0:10000000, tvlCapturePct:20, treasuryYieldPct:1.7,
    dutyPct:0.15,
    licence:{upfront:39000, annual:129000},
    psp:{feePct:0.5, absorbedPct:0, depositMultiple:2},
    personnel:{prodEng:[40000,75000,130000]}
  };
}
function sharedDefaults(){
  return {
    mgmtCompliance:[60000,90000,140000],
    externalProviders:[25000,35000,45000],
    localOps:[54000,40000,30000]
  };
}
function computePM(A){
  if(!A.pm) A.pm=pmDefaults();
  if(!A.pm.personnel) A.pm.personnel={prodEng:[40000,75000,130000]};
  const p=A.pm, N=A.meta.months;
  const hv=p.hvSharePct/100;
  const ltv=p.ltvHV*hv+p.ltvCore*(1-hv), cpa=p.cpaHV*hv+p.cpaCore*(1-hv);
  const marpu=ltv/Math.max(1,p.lifetimeMonths), churn=1/Math.max(1,p.lifetimeMonths);
  const Z=()=>Array(N).fill(0);
  const spend=Z(),organic=Z(),newU=Z(),actives=Z(),npr=Z(),vol=Z(),fees=Z(),deposits=Z(),psp=Z(),
        tvl=Z(),treasury=Z(),totalRev=Z(),cogs=Z(),builders=Z(),brand=Z(),duty=Z(),prodEng=Z(),
        mkt=Z(),ebitda=Z(),netcf=Z(),cumE=Z(),licAnnual=Z(),licUpfront=Z();
  const gv=[]; (p.growth||[]).forEach(ph=>{ for(let k=0;k<(+ph.m||0)&&gv.length<N;k++) gv.push(+ph.pct||0); });
  while(gv.length<N) gv.push(gv.length?gv[gv.length-1]:0);
  let prev=+p.seedUsers||0, ptvl=+p.tvl0||0, pvol=0, o=(+p.organic0||0)/100, cum=0, be=null;
  for(let t=0;t<N;t++){
    spend[t]= t===0? (+p.spend1||0) : spend[t-1]*(1+gv[t-1]/100);
    organic[t]=o;
    newU[t]= cpa>0? spend[t]/cpa*(1+o) : 0;
    actives[t]=prev*(1-churn)+newU[t];
    npr[t]=actives[t]*marpu;
    vol[t]= p.takeRatePct>0? npr[t]/(p.takeRatePct/100) : 0;
    fees[t]=vol[t]*p.overallFeePct/100;
    deposits[t]=fees[t]*(p.psp.depositMultiple||0);
    psp[t]=deposits[t]*(p.psp.feePct/100)*((p.psp.absorbedPct||0)/100);
    tvl[t]=ptvl+(vol[t]-pvol)*(p.tvlCapturePct/100);
    treasury[t]=tvl[t]*(p.treasuryYieldPct/100)/12;
    totalRev[t]=npr[t]+treasury[t];
    cogs[t]=npr[t]*(p.cogsPctNPR/100)+psp[t];
    builders[t]=vol[t]*(p.buildersPctVol/100);
    brand[t]=(+p.brand1||0)*Math.pow(1+(+p.brandGrowthPct||0)/100,t);
    duty[t]=npr[t]*(p.dutyPct/100);
    prodEng[t]=+p.personnel.prodEng[Math.min(2,Math.floor(t/12))]||0;
    licAnnual[t]=(+p.licence.annual||0)/12;
    licUpfront[t]= t===0? (+p.licence.upfront||0) : 0;
    mkt[t]=spend[t]+builders[t]+brand[t];
    ebitda[t]=totalRev[t]-cogs[t]-mkt[t]-duty[t]-licAnnual[t]-prodEng[t];
    netcf[t]=ebitda[t]-licUpfront[t];
    cum+=ebitda[t]; cumE[t]=cum;
    prev=actives[t]; ptvl=tvl[t]; pvol=vol[t];
    o+=(t<11?(+p.organicStep1||0):(+p.organicStep2||0))/100;
  }
  for(let t=0;t<N;t++){ if(ebitda[t]>0&&(t===N-1||ebitda[t+1]>0)){ be=t; break; } }
  return {N,spend,organic,newU,actives,npr,vol,fees,deposits,psp,tvl,treasury,totalRev,cogs,builders,
          brand,duty,prodEng,mkt,ebitda,netcf,cumE,licAnnual,licUpfront,breakeven:be,
          unit:{ltv,cpa,marpu,churn}};
}
function computeGroup(A,MC,MP){
  if(!A.shared) A.shared=sharedDefaults();
  const N=A.meta.months, Z=()=>Array(N).fill(0);
  const shared=Z(),revenue=Z(),ebitda=Z(),netcf=Z(),cash=Z(),cumE=Z(),fundingIn=Z();
  (A.funding||[]).forEach(f=>{ const m=Math.round(+f.month)-1; if(m>=0&&m<N) fundingIn[m]+=(+f.amount||0); });
  let bal=0,cum=0,cumOp=0,maxNeed=0,be=null,minCash=Infinity,minCashM=0;
  for(let t=0;t<N;t++){
    const y=Math.min(2,Math.floor(t/12));
    shared[t]=(+A.shared.mgmtCompliance[y]||0)+(+A.shared.externalProviders[y]||0)+(+A.shared.localOps[y]||0);
    revenue[t]=MC.agg.ngr[t]+MP.totalRev[t];
    ebitda[t]=MC.ebitda[t]+MP.ebitda[t]-shared[t];
    netcf[t]=MC.netcf[t]+MP.netcf[t]-shared[t];
    cum+=ebitda[t]; cumE[t]=cum;
    cumOp+=netcf[t]; if(-cumOp>maxNeed) maxNeed=-cumOp;
    bal+=netcf[t]+fundingIn[t]; cash[t]=bal;
    if(bal<minCash){ minCash=bal; minCashM=t; }
  }
  for(let t=0;t<N;t++){ if(ebitda[t]>0&&(t===N-1||ebitda[t+1]>0)){ be=t; break; } }
  return {N,shared,revenue,ebitda,netcf,cash,cumE,fundingIn,breakeven:be,
          peakNeed:Math.max(0,maxNeed),minCash,minCashM,
          totalFunding:fundingIn.reduce((a,b)=>a+b,0)};
}

   ============================================================ */
const fmt = {
  usd(v,dec){ if(v==null||!isFinite(v))return "—";
    const a=Math.abs(v), s=v<0?"−$":"$";
    if(a>=1e9) return s+(a/1e9).toFixed(dec==null?2:dec)+"B";
    if(a>=1e6) return s+(a/1e6).toFixed(dec==null?2:dec)+"M";
    if(a>=1e4) return s+(a/1e3).toFixed(0)+"K";
    if(a>=1e3) return s+(a/1e3).toFixed(1)+"K";
    return s+a.toFixed(a<10?1:0); },
  usdFull(v){ if(v==null||!isFinite(v))return "—"; const s=v<0?"−":""; return s+"$"+Math.round(Math.abs(v)).toLocaleString("en-US"); },
  num(v){ if(v==null||!isFinite(v))return "—"; const a=Math.abs(v);
    if(a>=1e6) return (v/1e6).toFixed(1)+"M"; if(a>=1e3) return (v/1e3).toFixed(1)+"K"; return Math.round(v).toLocaleString(); },
  pct(v,d){ return (v*100).toFixed(d==null?1:d)+"%"; },
  x(v){ return !isFinite(v)?"—":v.toFixed(2)+"×"; },
  mo(t){ return "M"+(t+1); }
};
const SERIES=["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];

const tip=document.getElementById("tip");
function showTip(html,x,y){ tip.innerHTML=html; tip.style.display="block";
  const r=tip.getBoundingClientRect();
  let px=x+14, py=y+14;
  if(px+r.width>window.innerWidth-8) px=x-r.width-14;
  if(py+r.height>window.innerHeight-8) py=y-r.height-14;
  tip.style.left=px+"px"; tip.style.top=py+"px"; }
function hideTip(){ tip.style.display="none"; }

function niceTicks(min,max,n){
  if(min===max){max=min+1;}
  const span=max-min, step0=span/Math.max(1,n), mag=Math.pow(10,Math.floor(Math.log10(step0)));
  let step=mag; for(const m of [1,2,2.5,5,10]) if(step0<=m*mag){step=m*mag;break;}
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, ticks=[];
  for(let v=lo;v<=hi+1e-9;v+=step) ticks.push(v);
  return ticks;
}
function svgEl(tag,attrs){ const el=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(const k in attrs) el.setAttribute(k,attrs[k]); return el; }

/* Generic xy chart: series=[{name,color,values,kind:'line'|'area'|'bar'}] over months */
function xyChart(el, series, opts){
  opts=opts||{};
  const W=opts.w||620, H=opts.h||260, padL=54, padR=14, padT=14, padB=26;
  const N=series[0].values.length;
  const stacked=opts.stacked;
  let min=0,max=-Infinity;
  if(stacked){
    for(let t=0;t<N;t++){ let s=0; for(const sr of series) s+=Math.max(0,sr.values[t]); max=Math.max(max,s);}
    min=0;
  } else {
    for(const sr of series) for(const v of sr.values){ if(v<min)min=v; if(v>max)max=v; }
  }
  if(max===-Infinity)max=1;
  const ticks=niceTicks(Math.min(min,0),max,5);
  min=ticks[0]; max=ticks[ticks.length-1];
  const X=t=>padL+(t/(N-1))*(W-padL-padR);
  const Y=v=>padT+(1-(v-min)/(max-min))*(H-padT-padB);
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`,role:"img"});
  // grid
  for(const tv of ticks){
    svg.appendChild(svgEl("line",{x1:padL,x2:W-padR,y1:Y(tv),y2:Y(tv),stroke:"var(--grid)","stroke-width":1}));
    const lbl=svgEl("text",{x:padL-8,y:Y(tv)+4,"text-anchor":"end",fill:"var(--ink-3)","font-size":10.5,style:"font-variant-numeric:tabular-nums"});
    lbl.textContent=opts.fmt?opts.fmt(tv):fmt.usd(tv,0); svg.appendChild(lbl);
  }
  // zero baseline emphasized
  if(min<0&&max>0) svg.appendChild(svgEl("line",{x1:padL,x2:W-padR,y1:Y(0),y2:Y(0),stroke:"var(--axis)","stroke-width":1}));
  // x labels
  const step=N>24?6:(N>12?3:2);
  for(let t=0;t<N;t+=step){
    const lbl=svgEl("text",{x:X(t),y:H-8,"text-anchor":"middle",fill:"var(--ink-3)","font-size":10.5});
    lbl.textContent="M"+(t+1); svg.appendChild(lbl);
  }
  if(stacked){
    const base=Array(N).fill(0);
    series.forEach((sr,si)=>{
      let d="",d2="";
      const tops=[];
      for(let t=0;t<N;t++){ const v=base[t]+Math.max(0,sr.values[t]); tops.push(v); }
      d="M"+X(0)+" "+Y(base[0]);
      for(let t=0;t<N;t++) d+=" L"+X(t)+" "+Y(tops[t]);
      for(let t=N-1;t>=0;t--) d+=" L"+X(t)+" "+Y(base[t]);
      d+=" Z";
      svg.appendChild(svgEl("path",{d,fill:sr.color,"fill-opacity":0.55,stroke:"var(--surface-1)","stroke-width":1.5}));
      for(let t=0;t<N;t++) base[t]=tops[t];
    });
  } else {
    series.forEach(sr=>{
      if(sr.kind==="bar"){
        const bw=Math.min(14,(W-padL-padR)/N*0.62);
        for(let t=0;t<N;t++){
          const v=sr.values[t], y0=Y(Math.max(0,v)), h=Math.abs(Y(v)-Y(0));
          const rct=svgEl("rect",{x:X(t)-bw/2,y:v>=0?y0:Y(0),width:bw,height:Math.max(0.5,h),
            fill:v>=0?sr.color:"var(--crit)",rx:2});
          svg.appendChild(rct);
        }
      } else {
        if(sr.kind==="area"){
          let d="M"+X(0)+" "+Y(Math.max(0,min));
          for(let t=0;t<N;t++) d+=" L"+X(t)+" "+Y(sr.values[t]);
          d+=" L"+X(N-1)+" "+Y(Math.max(0,min))+" Z";
          svg.appendChild(svgEl("path",{d,fill:sr.color,"fill-opacity":0.10}));
        }
        let d="";
        for(let t=0;t<N;t++) d+=(t?" L":"M")+X(t)+" "+Y(sr.values[t]);
        svg.appendChild(svgEl("path",{d,fill:"none",stroke:sr.color,"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
      }
    });
  }
  // optional vertical event markers (e.g. funding rounds)
  if(opts.marks) for(const mk of opts.marks){
    if(mk.t<0||mk.t>=N) continue;
    svg.appendChild(svgEl("line",{x1:X(mk.t),x2:X(mk.t),y1:padT+10,y2:H-padB,stroke:"var(--axis)","stroke-width":1}));
    const flip=X(mk.t)>(W-padR)*0.72;
    const tl=svgEl("text",{x:X(mk.t)+(flip?-4:3),y:padT+9,fill:"var(--ink-2)","font-size":9.5,"font-weight":600,"text-anchor":flip?"end":"start"});
    tl.textContent=mk.label; svg.appendChild(tl);
  }
  // optional horizontal reference line (e.g. target margin)
  if(opts.href!=null && opts.href.v>=min && opts.href.v<=max){
    svg.appendChild(svgEl("line",{x1:padL,x2:W-padR,y1:Y(opts.href.v),y2:Y(opts.href.v),stroke:"var(--s2)","stroke-width":1.3,"stroke-dasharray":"5 4"}));
    const rl=svgEl("text",{x:W-padR-4,y:Y(opts.href.v)-5,"text-anchor":"end",fill:"var(--s2)","font-size":10,"font-weight":650});
    rl.textContent=opts.href.label||""; svg.appendChild(rl);
  }
  // crosshair + tooltip
  const hover=svgEl("line",{x1:0,x2:0,y1:padT,y2:H-padB,stroke:"var(--axis)","stroke-width":1,visibility:"hidden"});
  svg.appendChild(hover);
  const dots=series.map(sr=>{ const c=svgEl("circle",{r:4.5,fill:sr.color,stroke:"var(--surface-1)","stroke-width":2,visibility:"hidden"}); svg.appendChild(c); return c; });
  svg.addEventListener("mousemove",e=>{
    const pt=svg.getBoundingClientRect();
    const sx=(e.clientX-pt.left)*(W/pt.width);
    let t=Math.round(((sx-padL)/(W-padL-padR))*(N-1)); t=clamp(t,0,N-1);
    hover.setAttribute("x1",X(t)); hover.setAttribute("x2",X(t)); hover.setAttribute("visibility","visible");
    let rows="";
    if(stacked){ let base=0;
      series.forEach((sr,si)=>{ base+=Math.max(0,sr.values[t]); dots[si].setAttribute("visibility","hidden"); });
      let acc=0;
      series.forEach((sr,si)=>{ acc+=Math.max(0,sr.values[t]);
        rows+=`<div class="t-r"><span class="k"><span class="sw" style="background:${sr.color};width:8px;height:8px;border-radius:2px;display:inline-block"></span>${sr.name}</span><span class="v">${(opts.fmt||fmt.usd)(sr.values[t])}</span></div>`;});
      rows+=`<div class="t-r" style="border-top:1px solid var(--grid);margin-top:4px;padding-top:4px"><span class="k">Total</span><span class="v">${(opts.fmt||fmt.usd)(base)}</span></div>`;
    } else {
      series.forEach((sr,si)=>{
        dots[si].setAttribute("cx",X(t)); dots[si].setAttribute("cy",Y(sr.values[t])); dots[si].setAttribute("visibility","visible");
        rows+=`<div class="t-r"><span class="k"><span class="sw" style="background:${sr.color};width:8px;height:8px;border-radius:2px;display:inline-block"></span>${sr.name}</span><span class="v">${(opts.fmt||fmt.usd)(sr.values[t])}</span></div>`;});
    }
    showTip(`<div class="t-h">Month ${t+1}</div>${rows}`, e.clientX, e.clientY);
  });
  svg.addEventListener("mouseleave",()=>{ hideTip(); hover.setAttribute("visibility","hidden"); dots.forEach(d=>d.setAttribute("visibility","hidden")); });
  el.innerHTML="";
  el.appendChild(svg);
  if(series.length>1){
    const lg=document.createElement("div"); lg.className="legend";
    series.forEach(sr=>{ const it=document.createElement("div"); it.className="it";
      it.innerHTML=`<span class="sw" style="background:${sr.color}"></span>${sr.name}`; lg.appendChild(it); });
    el.appendChild(lg);
  }
}

/* Horizontal bars with reference line */
function hbarChart(el, items, opts){
  opts=opts||{};
  const W=opts.w||620, rowH=opts.rowH||30, padL=opts.padL||150, padR=opts.padR||60, padT=6;
  const H=padT+items.length*rowH+10;
  let max=Math.max(...items.map(i=>i.value),opts.ref||0)*1.08||1;
  const X=v=>padL+(v/max)*(W-padL-padR);
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`});
  if(opts.ref!=null){
    svg.appendChild(svgEl("line",{x1:X(opts.ref),x2:X(opts.ref),y1:padT,y2:H-8,stroke:"var(--axis)","stroke-width":1,"stroke-dasharray":"none"}));
    const t=svgEl("text",{x:X(opts.ref)+4,y:padT+8,fill:"var(--ink-3)","font-size":10}); t.textContent=opts.refLabel||""; svg.appendChild(t);
  }
  items.forEach((it,i)=>{
    const y=padT+i*rowH+6, bh=16;
    const lbl=svgEl("text",{x:padL-8,y:y+bh-4,"text-anchor":"end",fill:"var(--ink-2)","font-size":11.5});
    lbl.textContent=it.name; svg.appendChild(lbl);
    const w=Math.max(1,X(it.value)-padL);
    const r=svgEl("path",{d:`M${padL} ${y} h${w-4} a4 4 0 0 1 4 4 v${bh-8} a4 4 0 0 1 -4 4 h${-(w-4)} Z`,fill:it.color});
    svg.appendChild(r);
    const val=svgEl("text",{x:padL+w+6,y:y+bh-4,fill:"var(--ink-1)","font-size":11,"font-weight":600,style:"font-variant-numeric:tabular-nums"});
    val.textContent=(opts.fmt||fmt.x)(it.value); svg.appendChild(val);
    r.addEventListener("mousemove",e=>showTip(`<div class="t-h">${it.name}</div><div class="t-r"><span class="k">${opts.label||"Value"}</span><span class="v">${(opts.fmt||fmt.x)(it.value)}</span></div>${it.extra||""}`,e.clientX,e.clientY));
    r.addEventListener("mouseleave",hideTip);
  });
  el.innerHTML=""; el.appendChild(svg);
}

/* P&L waterfall: GGR 100% -> EBITDA, each step labeled as % of GGR */
function waterfallChart(el){
  const t=M.N-1, g=M.agg.ggr[t]||1;
  const techKyc=M.opex.kyc[t]+M.opex.hosting[t]+M.opex.software[t]+M.opex.aggregator[t];
  const steps=[
    {n:"GGR",total:true,set:g},
    {n:"Bonuses &\njackpots",v:-M.agg.bonus[t]},
    {n:"NGR",total:true},
    {n:"Content\nrevshare",v:-M.agg.content[t]},
    {n:"Payment\nprocessing",v:-M.agg.pay[t]},
    {n:"KYC &\ntech",v:-techKyc},
    {n:"Gaming\ntax",v:-M.agg.tax[t]},
    {n:"GROSS\nPROFIT",total:true},
    {n:"Affiliate\nrevshare*",v:-M.agg.affrs[t]},
    {n:"CPA\nbudgets",v:-M.agg.marketing[t]},
    {n:"Brand &\nstreamers",v:-M.opex.brand[t]},
    {n:"CONTRIB.\nafter mktg",total:true},
    {n:"Personnel",v:-M.opex.personnel[t]},
    {n:"Other\nopex",v:-(M.opexTotal[t]-M.opex.personnel[t])},
    {n:"EBITDA",total:true,final:true}
  ];
  const W=1240,H=300,padL=16,padR=16,padT=30,padB=44;
  const n=steps.length, slot=(W-padL-padR)/n, bw=Math.min(58,slot*0.66);
  const Y=v=>padT+(1-v/g)*(H-padT-padB);
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`});
  // baseline + gridlines at 0/25/50/75/100%
  for(const q of [0,0.25,0.5,0.75,1]){
    svg.appendChild(svgEl("line",{x1:padL,x2:W-padR,y1:Y(g*q),y2:Y(g*q),stroke:"var(--grid)","stroke-width":1}));
    const tl=svgEl("text",{x:W-padR,y:Y(g*q)-3,"text-anchor":"end",fill:"var(--ink-3)","font-size":9});
    tl.textContent=Math.round(q*100)+"%"; svg.appendChild(tl);
  }
  let run=0;
  steps.forEach((st,i)=>{
    const x=padL+i*slot+(slot-bw)/2;
    let y0,y1,fill,valTxt,val;
    if(st.total){
      if(st.set!=null) run=st.set;
      val=run; y0=Y(run); y1=Y(0);
      fill=st.final?cssv("--good"):cssv("--s1");
      valTxt=fmt.pct(run/g,run/g<0.1?1:0);
    } else {
      val=st.v; const from=run, to=run+st.v; run=to;
      y0=Y(Math.max(from,to)); y1=Y(Math.min(from,to));
      fill=cssv("--s2");
      valTxt="\u2212"+fmt.pct(Math.abs(st.v)/g,Math.abs(st.v)/g<0.02?1:0);
      // connector from previous level
      svg.appendChild(svgEl("line",{x1:x-((slot-bw)/2)-bw/2+2,x2:x,y1:Y(from),y2:Y(from),stroke:"var(--axis)","stroke-width":1}));
    }
    const rect=svgEl("rect",{x:x,y:y0,width:bw,height:Math.max(1.5,y1-y0),rx:3,fill,
      stroke:"var(--surface-1)","stroke-width":1});
    svg.appendChild(rect);
    const vt=svgEl("text",{x:x+bw/2,y:y0-4,"text-anchor":"middle",fill:"var(--ink-1)","font-size":10,"font-weight":st.total?700:600});
    vt.textContent=valTxt; svg.appendChild(vt);
    st.n.split("\n").forEach((ln,li)=>{
      const nt=svgEl("text",{x:x+bw/2,y:H-padB+13+li*11,"text-anchor":"middle",fill:st.total?"var(--ink-1)":"var(--ink-3)","font-size":9.5,"font-weight":st.total?700:400});
      nt.textContent=ln; svg.appendChild(nt);
    });
    rect.addEventListener("mousemove",e=>showTip(
      `<div class="t-h">${st.n.replace("\n"," ")}</div>
       <div class="t-r"><span class="k">Month 36</span><span class="v">${fmt.usd(Math.abs(st.total?val:st.v))}/mo</span></div>
       <div class="t-r"><span class="k">% of GGR</span><span class="v">${fmt.pct(Math.abs(st.total?val:st.v)/g,1)}</span></div>`,
      e.clientX,e.clientY));
    rect.addEventListener("mouseleave",hideTip);
  });
  el.innerHTML=""; el.appendChild(svg);
}

/* Project timeline: phases + funding markers + break-even */
function timelineChart(el){
  const N=M.N, W=1240, H=138, padL=20, padR=20, yBar=66;
  const sy=A.meta.startYear||2026, smc=A.meta.startCalMonth||9;
  const MOS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const cal=t=>{ const ab=(smc-1)+t; return MOS[ab%12]+"-"+String(sy+Math.floor(ab/12)).slice(2); };
  const X=t=>padL+(clamp(t,0,N-1)/(N-1))*(W-padL-padR);
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`});
  const launch=Math.max(0,Math.min(...A.geos.filter(g=>g.enabled).map(g=>g.mkStart))-1);
  const scale=Math.max(launch+1,(A.global.scaleMonth||7)-1);
  const be=M.breakeven!=null?M.breakeven:N-1;
  const phases=[
    {a:0,b:launch,label:"BUILD",c:"--s4"},
    {a:launch,b:scale,label:"LAUNCH & PROVE",c:"--s1"},
    {a:scale,b:Math.max(scale+1,be),label:"SCALE ×"+(A.global.scaleMult||1),c:"--s2"},
    {a:Math.max(scale+1,be),b:N-1,label:"PROFITABLE",c:"--good"}
  ];
  for(const ph of phases){
    if(ph.b<=ph.a) continue;
    svg.appendChild(svgEl("rect",{x:X(ph.a),y:yBar-5,width:X(ph.b)-X(ph.a),height:10,rx:5,fill:cssv(ph.c),"fill-opacity":0.3}));
    const lb=svgEl("text",{x:(X(ph.a)+X(ph.b))/2,y:yBar-14,"text-anchor":"middle",fill:"var(--ink-2)","font-size":10,"font-weight":700,"letter-spacing":"0.06em"});
    lb.textContent=ph.label; svg.appendChild(lb);
  }
  // funding rounds above the bar (alternating heights)
  const rounds=[...(A.funding||[])].sort((a,b)=>a.month-b.month);
  rounds.forEach((f,i)=>{
    const x=X(Math.round(f.month)-1), hy=i%2?26:40;
    svg.appendChild(svgEl("line",{x1:x,x2:x,y1:H-yBar-18+hy,y2:yBar-5,stroke:"var(--axis)","stroke-width":1}));
    svg.appendChild(svgEl("circle",{cx:x,cy:yBar,r:6,fill:cssv("--s1"),stroke:"var(--surface-1)","stroke-width":2}));
    const lx=Math.max(52,Math.min(W-52,x));
    const t1=svgEl("text",{x:lx,y:hy-8,"text-anchor":"middle",fill:"var(--ink-1)","font-size":11,"font-weight":700});
    t1.textContent="R"+(i+1)+" "+fmt.usd(f.amount); svg.appendChild(t1);
    const t2=svgEl("text",{x:lx,y:hy+3,"text-anchor":"middle",fill:"var(--ink-3)","font-size":9.5});
    t2.textContent="M"+f.month+" · "+cal(Math.round(f.month)-1); svg.appendChild(t2);
  });
  // break-even diamond
  if(M.breakeven!=null){
    const x=X(be);
    svg.appendChild(svgEl("path",{d:`M${x} ${yBar-9} L${x+7} ${yBar} L${x} ${yBar+9} L${x-7} ${yBar} Z`,fill:cssv("--good"),stroke:"var(--surface-1)","stroke-width":2}));
    const t=svgEl("text",{x:x,y:yBar+26,"text-anchor":"middle",fill:"var(--good-text)","font-size":10,"font-weight":700});
    t.textContent="BREAK-EVEN M"+(be+1); svg.appendChild(t);
  }
  // month + calendar ticks
  for(const t of [0,5,11,17,23,29,35]){
    if(t>=N) continue;
    const x=X(t);
    svg.appendChild(svgEl("line",{x1:x,x2:x,y1:yBar+7,y2:yBar+12,stroke:"var(--axis)","stroke-width":1}));
    const m1=svgEl("text",{x:x,y:yBar+40,"text-anchor":"middle",fill:"var(--ink-3)","font-size":10}); m1.textContent="M"+(t+1); svg.appendChild(m1);
    const m2=svgEl("text",{x:x,y:yBar+52,"text-anchor":"middle",fill:"var(--ink-3)","font-size":9}); m2.textContent=cal(t); svg.appendChild(m2);
  }
  el.innerHTML=""; el.appendChild(svg);
}

/* Heatmap: rows × cols matrix, sequential blue */
function heatmap(el, rows, cols, get, opts){
  opts=opts||{};
  const cw=Math.max(26,Math.min(44, Math.floor(760/cols.length))), ch=24, padL=90, padT=24;
  const W=padL+cols.length*cw+10, H=padT+rows.length*ch+8;
  let mx=0; for(let i=0;i<rows.length;i++) for(let j=0;j<cols.length;j++){ const v=get(i,j); if(v!=null&&v>mx)mx=v; }
  if(mx<=0)mx=1;
  const ramp=["--seq100","--seq200","--seq300","--seq400","--seq500","--seq600","--seq700"];
  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`});
  cols.forEach((c,j)=>{ const t=svgEl("text",{x:padL+j*cw+cw/2,y:14,"text-anchor":"middle",fill:"var(--ink-3)","font-size":10}); t.textContent=c; svg.appendChild(t); });
  rows.forEach((rname,i)=>{
    const t=svgEl("text",{x:padL-8,y:padT+i*ch+ch/2+4,"text-anchor":"end",fill:"var(--ink-2)","font-size":10.5}); t.textContent=rname; svg.appendChild(t);
    cols.forEach((c,j)=>{
      const v=get(i,j);
      if(v==null) return;
      const k=Math.min(ramp.length-1, Math.floor((v/mx)*ramp.length));
      const rc=svgEl("rect",{x:padL+j*cw+1,y:padT+i*ch+1,width:cw-2,height:ch-2,rx:4,fill:cssv(ramp[k])});
      svg.appendChild(rc);
      rc.addEventListener("mousemove",e=>showTip(`<div class="t-h">${rname} · ${c}</div><div class="t-r"><span class="k">${opts.label||"Value"}</span><span class="v">${(opts.fmt||fmt.usd)(v)}</span></div>`,e.clientX,e.clientY));
      rc.addEventListener("mouseleave",hideTip);
    });
  });
  el.innerHTML=""; el.appendChild(svg);
}

/* debounce for input-driven recompute */
let _t=null;
function queueRefresh(){ clearTimeout(_t); _t=setTimeout(refresh,250); }

/* helper: numeric input bound to object path */
function numInput(obj,key,opts){

}

/* ============================================================
   TAB: DASHBOARD
   ============================================================ */
function renderDashboard(){
  const el=document.getElementById("tab-dashboard");
  const N=M.N;
  const sy=A.meta.startYear||2026, smc=A.meta.startCalMonth||9;
  const MOS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const cal=t=>{ const ab=(smc-1)+t; return MOS[ab%12]+"-"+String(sy+Math.floor(ab/12)).slice(2); };
  const rounds=[...(A.funding||[])].sort((a,b)=>a.month-b.month);
  const totalRaise=rounds.reduce((s2,f)=>s2+(+f.amount||0),0);
  const y3run=M.agg.ggr[N-1]*12, ebitdaRun=M.ebitda[N-1]*12;
  const blend=(()=>{ let l=0,c=0,pb=0,f=0; M.perGeo.forEach(g=>{ const ft=g.ftds.reduce((a,b)=>a+b,0);
    l+=g.unit.ltvNGR36*ft; c+=g.unit.effCAC*ft; pb+=(g.unit.payback!=null?g.unit.payback+1:36)*ft; f+=ft; });
    return {roi:c>0?l/c:0, cac:f>0?c/f:0, ltv:f>0?l/f:0, payback:f>0?pb/f:0, ftds:f}; })();
  const gh0=gameHourly(A.games,1);
  const ownShare=gh0.ggr>0?gh0.per.filter(p=>p.source==="own").reduce((s2,p)=>s2+p.ggr,0)/gh0.ggr:0;
  const launchIdx=Math.max(0,Math.min(...A.geos.filter(g=>g.enabled).map(g=>g.mkStart))-1);
  el.innerHTML=`
    <div class="tiles" style="margin-top:10px">
      <div class="tile hero"><div class="lbl">Year-3 GGR run-rate</div><div class="val">${fmt.usd(y3run)}</div><div class="delta">EBITDA run-rate ${fmt.usd(ebitdaRun)}/yr</div></div>
      <div class="tile"><div class="lbl">Cumulative EBITDA (36 mo)</div><div class="val">${fmt.usd(M.cumEbitdaArr[N-1])}</div><div class="delta ${M.cumEbitdaArr[N-1]>=0?'up':'down'}">${M.cumEbitdaArr[N-1]>=0?"profitable horizon":"below breakeven"}</div></div>
      <div class="tile"><div class="lbl">EBITDA break-even</div><div class="val">${M.breakeven!=null?"M"+(M.breakeven+1):"—"}</div><div class="delta">${M.breakeven!=null?cal(M.breakeven)+" · min cash "+fmt.usd(M.minCash):"not within horizon"}</div></div>
      <div class="tile"><div class="lbl">Raise plan</div><div class="val">${fmt.usd(totalRaise)}</div><div class="delta">${rounds.length} rounds · R1 ${fmt.usd(rounds[0]?rounds[0].amount:0)} committed</div></div>
      <div class="tile"><div class="lbl">Marketing ROI (blended)</div><div class="val">${fmt.x(blend.roi)}</div><div class="delta">CAC ${fmt.usd(blend.cac,0)} → LTV ${fmt.usd(blend.ltv,0)} · payback M${Math.round(blend.payback)}</div></div>
      <div class="tile"><div class="lbl">Active depositors M36</div><div class="val">${fmt.num(M.agg.actives[N-1])}</div><div class="delta">${fmt.num(M.agg.ftds[N-1])} new FTDs / mo</div></div>
    </div>
    <div class="card" style="padding:8px 14px 0"><div class="chart" id="ch-timeline"></div></div>
    <div class="tiles mini">
      <div class="tile"><div class="lbl">GGR / active / mo</div><div class="val">${fmt.usd(M.agg.actives[N-1]>0?M.agg.ggr[N-1]/M.agg.actives[N-1]:0,0)}</div></div>
      <div class="tile"><div class="lbl">Gross margin (% NGR)</div><div class="val">${fmt.pct(M.agg.ngr[N-1]>0?M.grossProfit[N-1]/M.agg.ngr[N-1]:0,0)}</div></div>
      <div class="tile"><div class="lbl">Content cost (% GGR)</div><div class="val">${fmt.pct(gh0.contentPct,1)}</div></div>
      <div class="tile"><div class="lbl">Own-content GGR share</div><div class="val">${fmt.pct(ownShare,0)}</div></div>
      <div class="tile"><div class="lbl">Headcount Y3</div><div class="val">${fmt.num(M.opex.heads[N-1])}</div></div>
      <div class="tile"><div class="lbl">Cash at M36</div><div class="val">${fmt.usd(M.cash[N-1])}</div></div>
    </div>
    <div class="card"><h3>The P&amp;L waterfall — how a GGR dollar becomes EBITDA (month 36)</h3>
    <p class="note">Shared jargon, one picture: GGR = players' losses. NGR = GGR − bonuses. Gross profit = NGR − direct costs of running the casino (content, payments, KYC/tech, tax). Contribution = gross profit − all marketing (affiliates are paid twice: CPA budgets up front + ${A.global.affRevsharePct}% revshare on their players' NGR). EBITDA = contribution − people &amp; overhead. Hover any bar for $/month. <b>Note the basis:</b> this is the M36 exit month (margin ${(100*M.ebitda[N-1]/(M.agg.ggr[N-1]||1)).toFixed(0)}%); the year-3 <i>average</i> margin is ${(100*M.ebitda.slice(24,36).reduce((a,b)=>a+b,0)/(M.agg.ggr.slice(24,36).reduce((a,b)=>a+b,0)||1)).toFixed(1)}% — margin climbs through the year as cohorts stack.</p>
    <div class="chart" id="ch-waterfall"></div>
    <div style="font-size:11.5px;color:var(--ink-3);margin-top:6px">* Affiliate revshare is contractually ${A.global.affRevsharePct}% of <b>NGR</b>, not GGR — affiliates share the bonus cost. Every bonus dollar given to their players (including big VIP bonuses) reduces the affiliate's cut too; that alignment is why NGR-based deals are the industry norm. Shown as % of GGR here only so the waterfall adds up.</div></div>
    <div class="grid2">
      <div class="card"><h3>Monthly GGR by GEO</h3><div class="chart" id="ch-ggr"></div></div>
      <div class="card"><h3>Cash & funding (casino-standalone view — group cash on Consolidated)</h3><div class="chart" id="ch-cash"></div></div>
      <div class="card"><h3>Monthly EBITDA</h3><div class="chart" id="ch-ebitda"></div></div>
      <div class="card"><h3>EBITDA margin (% of GGR)</h3><p class="note">Dashed = target steady-state ~21% · marker = where the plan moves onto it and stays.</p><div class="chart" id="ch-margin"></div></div>
      <div class="card"><h3>Marketing ROI by GEO</h3><p class="note">36-mo player value ÷ acquisition cost · 3× = healthy.</p><div class="chart" id="ch-ltv"></div></div>
      <div class="card"><h3>GGR by game vertical — M36</h3><p class="note">Blue = normal casino · orange = live · green = own games.</p><div class="chart" id="ch-games"></div></div>
      <div class="card"><h3>Where the GGR goes — M36</h3><div class="chart" id="ch-water"></div></div>
    </div>`;
  timelineChart(document.getElementById("ch-timeline"));
  waterfallChart(document.getElementById("ch-waterfall"));
  xyChart(document.getElementById("ch-ggr"),
    M.perGeo.map((g,i)=>({name:g.name,color:sColor(i),values:g.ggr})), {stacked:true,h:250});
  xyChart(document.getElementById("ch-cash"),
    [{name:"Cash balance",color:sColor(0),values:M.cash,kind:"area"}],
    {h:250,marks:rounds.map((f,i)=>({t:Math.round(f.month)-1,label:"R"+(i+1)}))});
  xyChart(document.getElementById("ch-ebitda"),
    [{name:"EBITDA",color:sColor(2),values:M.ebitda,kind:"bar"}],{h:250});
  const marginPct=M.agg.ggr.map((g,t)=>g>1000?clamp(100*M.ebitda[t]/g,-60,60):-60);
  let settleT=null;
  for(let t=0;t<N;t++){ if(marginPct[t]>=20 && marginPct.slice(t).every(v=>v>=20)){ settleT=t; break; } }
  xyChart(document.getElementById("ch-margin"),
    [{name:"EBITDA margin",color:sColor(4),values:marginPct}],
    {h:250,fmt:v=>Math.round(v)+"%",href:{v:21,label:"21% steady state"},
     marks:settleT!=null?[{t:settleT,label:"\u2192 ~21% from M"+(settleT+1)}]:[]});
  hbarChart(document.getElementById("ch-ltv"),
    M.perGeo.map((g,i)=>({name:g.name,color:sColor(i),value:Math.min(g.unit.effCAC>0?g.unit.ltvNGR36/g.unit.effCAC:0,12),
      extra:`<div class="t-r"><span class="k">Player LTV (36 mo)</span><span class="v">${fmt.usd(g.unit.ltvNGR36)}</span></div><div class="t-r"><span class="k">Cost to acquire</span><span class="v">${fmt.usd(g.unit.effCAC)}</span></div><div class="t-r"><span class="k">Money back in</span><span class="v">${g.unit.payback!=null?(g.unit.payback+1)+" months":"&gt;36 months"}</span></div>`})),
    {ref:3,refLabel:"3× healthy",label:"ROI"});
  const gm=A.games.map(g=>({name:g.name,color:gameColor(g),value:M.ggrByGame[g.id][N-1]}));
  hbarChart(document.getElementById("ch-games"),gm,{fmt:v=>fmt.usd(v),label:"GGR / mo"});
  const ggrM=M.agg.ggr[N-1]||1;
  const stack=[
    {name:"Bonuses & jackpots",v:M.agg.bonus[N-1]},
    {name:"COGS (content, tech, payments, KYC, tax)",v:M.cogsTotal[N-1]},
    {name:"Marketing (CPA + revshare + brand)",v:M.mktTotal[N-1]},
    {name:"Opex (personnel, ops, G&A)",v:M.opexTotal[N-1]},
    {name:"EBITDA",v:Math.max(0,M.ebitda[N-1])}
  ];
  hbarChart(document.getElementById("ch-water"),
    stack.map((x,i)=>({name:x.name,color:i===stack.length-1?cssv("--good"):sColor(i),value:Math.max(0,x.v/ggrM)})),
    {fmt:v=>fmt.pct(v,0),label:"% of GGR"});
}

function renderAssumptions(){
  const el=document.getElementById("tab-assumptions");
  el.innerHTML=`<h2>Assumptions</h2>
  <p class="sub">The single source of truth — every input in the model lives on this page (personnel & salaries live on the Team &amp; Assumptions tab), and the results flow from it. Prefilled from Aug-2026 industry research (full sourced write-up saved in your project as <em>assumptions-research.md</em>). Changes recalculate everything instantly; when you're happy, scroll to the bottom and save as the new default.</p>
  <div id="asm"></div>`;
  const root=el.querySelector("#asm");
  const addCard=(html,fieldsDefs,noteClass)=>{
    const c=document.createElement("div"); c.className="card"; c.innerHTML=html;
    if(fieldsDefs){ const f=document.createElement("div"); f.className="fields";
      fieldsDefs.forEach(d=>f.appendChild(d)); c.appendChild(f); }
    root.appendChild(c); return c;
  };

  // 1 — Funding & horizon
  const fCard=addCard(`<h3>1 · Funding rounds & horizon</h3><p class="note">Staged capital raises — each round lands in the cash flow in its month. The Cash Flow tab shows the timing against the burn curve; keep the lowest cash point comfortably above zero (rule of thumb: 3 months of burn as buffer). The model's true external need ("peak funding need") is computed independently of this plan.</p>
  <div class="twrap"><table class="editable"><thead><tr><th>Round</th><th>Month</th><th>Amount $</th><th></th></tr></thead><tbody id="fundTb"></tbody></table></div>
  <button class="ghost-btn addbtn" id="addRound">+ Add round</button>`,[
    field("Horizon (months)",numInput(A.meta,"months",{step:1,min:12})),
    field("Model starts — year",numInput(A.meta,"startYear",{step:1,min:2024})),
    field("Model starts — month (1–12)",numInput(A.meta,"startCalMonth",{step:1,min:1}),"M1 = this calendar month; drives the Finance tab quarters")
  ]);
  const ftb=fCard.querySelector("#fundTb");
  (A.funding||[]).forEach((f,fi)=>{
    const tr=document.createElement("tr");
    const tdN=document.createElement("td");
    const ni=document.createElement("input"); ni.type="text"; ni.value=f.name; ni.style.width="220px";
    ni.addEventListener("input",()=>{f.name=ni.value; queueRefresh();});
    tdN.appendChild(ni); tr.appendChild(tdN);
    [["month",1],["amount",250000]].forEach(([k,st])=>{
      const td=document.createElement("td"); const inp=numInput(f,k,{step:st,min:k==="month"?1:0});
      if(k==="amount") inp.classList.add("wide");
      td.appendChild(inp); tr.appendChild(td); });
    const tdX=document.createElement("td"); tdX.className="rowbtns";
    const del=document.createElement("button"); del.textContent="✕"; del.title="Remove round";
    del.onclick=()=>{ A.funding.splice(fi,1); refresh(); };
    tdX.appendChild(del); tr.appendChild(tdX);
    ftb.appendChild(tr);
  });
  fCard.querySelector("#addRound").onclick=()=>{
    A.funding.push({name:"Round "+(A.funding.length+1), month:12, amount:1000000, note:""}); refresh();
  };

  // 2 — Gaming KPIs (games)
  root.appendChild(buildGamesEditor());

  // 3 — GEO KPIs

      metricRow("Blended CAC (all channels)",fmt.usd(cac,0),"≤ "+fmt.usd(cac*1.2,0),"CPA discipline — the assumption most likely to slip at scale.")+
      metricRow("Cohort payback (blended)","M"+Math.round(blend.payback),"≤ M"+(Math.round(blend.payback)+2),"THE smoking gun: observed cohorts must repay CAC on schedule.")+
      metricRow("Marketing ROI (36-mo LTV basis)",fmt.x(blend.roi),"≥ 2.0×","Below 2× the growth story doesn\'t underwrite the next round.")+
      metricRow("Monthly EBITDA",fmt.usd(M.ebitda[idx]),M.ebitda[idx]<0?"loss narrowing q/q":"positive & growing","Trajectory matters more than the absolute number pre-break-even.")+
      metricRow("Cash on hand",fmt.usd(M.cash[idx]),"≥ 3 months of burn","Never negotiate a round from an empty tank.");
    cards+=`<div class="card">

    </div>`;
  }

  <p class="sub">The evidence case for each funding round — every "base plan" number is computed live from the model, so when assumptions change, the bar you have to clear changes with them. Pass bars: volume/revenue ≥ 70% of plan, CAC ≤ 120%, payback within 2 months of plan. Hit the bars → raise on your terms; miss them → the same sheet tells you to cut burn or re-price before you\'re forced to.</p>
  <div class="tiles">
    <div class="tile"><div class="lbl">Founder commitment (R1)</div><div class="val">${fmt.usd(rounds[0]?rounds[0].amount:0)}</div><div class="delta">capped — later rounds are earned by the gates below</div></div>

let cohortGeo="all";
function blendedCohort(){
  const N=M.N;
  const f=M.perGeo.map(g=>g.ftds.reduce((a,b)=>a+b,0));
  const F=f.reduce((a,b)=>a+b,0)||1;
  const w=f.map(x=>x/F);
  const r=Array.from({length:N},(_,a)=>M.perGeo.reduce((s,g,i)=>s+w[i]*g.r[a],0));
  const cum=Array.from({length:N},(_,a)=>M.perGeo.reduce((s,g,i)=>s+w[i]*g.unit.cumContrib[a],0));
  const spend=M.perGeo.reduce((s,g)=>s+g.spend.reduce((a,b)=>a+b,0),0);
  const effCAC=F>0?spend/F:0;
  let payback=null; for(let a=0;a<N;a++) if(cum[a]>=effCAC){payback=a;break;}
  return {id:"all", name:"All (blended)", r,
    ggrPerActive:M.perGeo.reduce((s,g,i)=>s+w[i]*g.ggrPerActive,0),
    unit:{effCAC, contribPerFTD:M.perGeo.reduce((s,g,i)=>s+w[i]*g.unit.contribPerFTD,0),
      cumContrib:cum, payback,
      ltvNGR36:M.perGeo.reduce((s,g,i)=>s+w[i]*g.unit.ltvNGR36,0),
      ltvCac:effCAC>0?cum[N-1]/effCAC:0}};
}
function renderCohorts(){
  const el=document.getElementById("tab-cohorts");
  if(!M.perGeo.length){ el.innerHTML="<h2>Cohorts</h2><p class='sub'>Enable at least one GEO.</p>"; return; }
  if(cohortGeo!=="all" && !M.perGeo.find(g=>g.id===cohortGeo)) cohortGeo="all";
  const g = cohortGeo==="all" ? blendedCohort() : M.perGeo.find(x=>x.id===cohortGeo);
  el.innerHTML=`<h2>Cohorts</h2>
  <p class="sub">How a month's acquired depositors behave as they age: retention decay, cumulative payback vs CAC, and the contribution each cohort generates over time.</p>
  <div class="toolbar"><div class="seg" id="geoSeg"></div></div>
  <div class="tiles">
    <div class="tile"><div class="lbl">Effective CAC</div><div class="val">${fmt.usd(g.unit.effCAC,0)}</div><div class="delta">paid spend ÷ all new depositors (incl. organic & revshare)</div></div>
    <div class="tile"><div class="lbl">Contribution / FTD / active-month</div><div class="val">${fmt.usd(g.unit.contribPerFTD,0)}</div><div class="delta">GGR/active ${fmt.usd(g.ggrPerActive,0)}/mo</div></div>
    <div class="tile"><div class="lbl">Payback</div><div class="val">${g.unit.payback!=null?"M"+(g.unit.payback+1):"&gt;36m"}</div><div class="delta">cohort age when CAC is covered</div></div>
    <div class="tile"><div class="lbl">36-mo contribution LTV</div><div class="val">${fmt.usd(g.unit.cumContrib[M.N-1],0)}</div><div class="delta">${fmt.x(g.unit.ltvCac)} of CAC — strictest basis: after ALL variable costs, at day-one PSP fees</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Retention curve — ${g.name}</h3><p class="note">Share of the FTD cohort still depositing at each age.</p><div class="chart" id="ch-ret"></div></div>
    <div class="card"><h3>Cumulative contribution per FTD vs CAC — ${g.name}</h3><p class="note">Where the line crosses CAC is payback.</p><div class="chart" id="ch-pb"></div></div>
  </div>
  <div class="card"><h3>Cohort contribution triangle — company level ($/month)</h3><p class="note">Rows = acquisition quarter; columns = cohort age in quarters; cell = total contribution that cohort generates in that quarter. Hover cells for values.</p><div class="chart" id="ch-tri"></div></div>`;
  const seg=el.querySelector("#geoSeg");
  [{id:"all",name:"All (blended)"},...M.perGeo].forEach(x=>{ const b=document.createElement("button"); b.textContent=x.name; if(x.id===cohortGeo)b.className="on";
    b.onclick=()=>{cohortGeo=x.id; renderCohorts();}; seg.appendChild(b); });
  xyChart(document.getElementById("ch-ret"),
    [{name:"Retention",color:sColor(0),values:g.r.slice(0,Math.min(24,M.N)),kind:"area"}],{fmt:v=>fmt.pct(v,0),h:240});
  const cacLine=Array(Math.min(24,M.N)).fill(g.unit.effCAC);
  xyChart(document.getElementById("ch-pb"),
    [{name:"Cumulative contribution / FTD",color:sColor(2),values:g.unit.cumContrib.slice(0,Math.min(24,M.N)),kind:"area"},
     {name:"Effective CAC",color:sColor(7),values:cacLine}],{h:240});
  // triangle: quarterly cohorts × age quarters, company level
  const Q=Math.floor(M.N/3);
  const rows=[],get=(i,j)=>{
    // cohort quarter i (months 3i..3i+2), age quarter j
    let sum=0,has=false;
    for(const pg of M.perGeo){
      for(let cm=3*i;cm<3*i+3;cm++){
        if(cm>=M.N)continue;
        for(let am=3*j;am<3*j+3;am++){
          const t=cm+am; if(t>=M.N)continue; has=true;
          // contribution of cohort cm at month t = ftds*retention*contribPerFTD
          sum+=pg.ftds[cm]*pg.r[am]*pg.unit.contribPerFTD;
        }
      }
    }
    return has?sum:null;
  };
  for(let i=0;i<Q;i++)rows.push("Q"+(i+1)+" cohort");
  heatmap(document.getElementById("ch-tri"),rows,
    Array.from({length:Q},(_,j)=>"Age Q"+j),get,{label:"Contribution",fmt:v=>fmt.usd(v)});
}

function renderFinance(){
  const el=document.getElementById("tab-finance");
  const N=M.N;
  const sy=A.meta.startYear||2026, sm=A.meta.startCalMonth||9;
  const idxFor=(y,mo)=>(y-sy)*12+(mo-sm); // model month index (0-based) for a calendar month
  // fixed reporting window: Q4 2026 → Q3 2028 inclusive
  const quarters=[]; let qy=2026,qq=4;
  for(let i=0;i<8;i++){ quarters.push({y:qy,q:qq}); qq++; if(qq>4){qq=1;qy++;} }
  const buckets=quarters.map(({y,q})=>{
    const idx=[3*q-2,3*q-1,3*q].map(mo=>idxFor(y,mo)).filter(t=>t>=0&&t<N);
    return {label:`Q${q}-${String(y).slice(2)}`, y,q, idx, partial:idx.length>0&&idx.length<3};
  });
  const S=(arr,b)=>b.idx.length?b.idx.reduce((s,i)=>s+arr[i],0):null;
  const gaArr=Array.from({length:N},(_,t)=>M.opex.legal[t]+M.opex.office[t]+M.opex.travel[t]+M.opex.gaMisc[t]);
  const persArr=M.opex.personnel;
  const otherOpex=Array.from({length:N},(_,t)=>M.opex.support[t]+M.opex.crmTools[t]+M.opex.antifraud[t]
    +gaArr[t]+M.opex.licAnnual[t]+M.opex.fraud[t]+M.opex.contingency[t]);
  const cogsArr=M.cogsTotal, smArr=M.mktTotal;
  const capexArr=M.opex.platformCapex, licUpArr=M.opex.licUpfront;
  const anyPartial=buckets.some(b=>b.partial);
  const cell=(v,opts)=>{
    opts=opts||{};
    if(v===null||v===undefined) return `<td style="color:var(--ink-3)">—</td>`;
    if(opts.pct) return `<td style="color:var(--ink-2)">${v}</td>`;
    const neg=(opts.neg&&v>0)||((!opts.neg)&&v<0);
    const txt=opts.neg&&v>0? "("+fmt.usd(v).replace("$","$")+")" : fmt.usd(v);
    return `<td class="${neg?'neg':''}">${txt}</td>`;
  };
  const row=(name,arr,opts)=>{
    opts=opts||{};
    const cells=buckets.map(b=>{ const v=S(arr,b); return cell(v,opts); }).join("");
    const tot=arr? buckets.reduce((s,b)=>{const v=S(arr,b); return v==null?s:s+v;},0):null;
    const cls=opts.total?"total":"";
    const pad=opts.indent?`style="padding-left:${10+opts.indent*14}px"`:"";
    return `<tr class="${cls}"><td ${pad}>${name}</td>${cells}${cell(tot,opts)}</tr>`;
  };
  const mrow=(name,numArr,denArr)=>{
    const cells=buckets.map(b=>{ const n=S(numArr,b),d=S(denArr,b);
      return cell(n!=null&&d?fmt.pct(n/d,0):null,{pct:1}); }).join("");
    const tn=buckets.reduce((s,b)=>{const v=S(numArr,b);return v==null?s:s+v;},0);
    const td=buckets.reduce((s,b)=>{const v=S(denArr,b);return v==null?s:s+v;},0);
    return `<tr><td style="color:var(--ink-3);font-style:italic;padding-left:24px">${name}</td>${cells}${cell(td?fmt.pct(tn/td,0):null,{pct:1})}</tr>`;
  };
  const sec=n=>`<tr class="section"><td colspan="${buckets.length+2}">${n}</td></tr>`;
  const krow=(name,fn)=>{
    const cells=buckets.map(b=>b.idx.length?`<td>${fn(b)}</td>`:`<td style="color:var(--ink-3)">—</td>`).join("");
    return `<tr><td>${name}</td>${cells}<td style="color:var(--ink-3)">—</td></tr>`;
  };
  // cash-flow specific rows
  const openCash=b=>b.idx.length? (b.idx[0]>0?M.cash[b.idx[0]-1]:0) : null;
  const closeCash=b=>b.idx.length? M.cash[b.idx[b.idx.length-1]] : null;
  const html=`
  <h2>Finance</h2>
  <p class="sub">Top-down quarterly financial statements, Q4 2026 – Q3 2028 inclusive (calendar quarters; model starts ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][sm-1]} ${sy} — change in Assumptions §1). ${anyPartial?"Quarters marked * are partly outside the model horizon.":""} Monthly detail lives on the P&L and Cash Flow tabs.</p>
  <div class="card"><div class="twrap"><table>
    <thead><tr><th>USD</th>${buckets.map(b=>`<th>${b.label}${b.partial?"*":""}</th>`).join("")}<th>Total</th></tr></thead>
    <tbody>
      ${sec("Income statement")}
      ${row("Gross gaming revenue (GGR)",M.agg.ggr)}
      ${row("Bonuses & jackpots",M.agg.bonus,{neg:1,indent:1})}
      ${row("Net gaming revenue (NGR)",M.agg.ngr,{total:1})}
      ${row("Cost of services (COGS)",cogsArr,{neg:1,indent:1})}
      ${row("Gross profit",M.grossProfit,{total:1})}
      ${mrow("gross margin (% NGR)",M.grossProfit,M.agg.ngr)}
      ${row("Sales & marketing",smArr,{neg:1,indent:1})}
      ${row("Personnel",persArr,{neg:1,indent:1})}
      ${row("Other operating expenses",otherOpex,{neg:1,indent:1})}
      ${row("EBITDA",M.ebitda,{total:1})}
      ${mrow("EBITDA margin (% NGR)",M.ebitda,M.agg.ngr)}
      ${row("Depreciation & amortization",M.opex.amort,{neg:1,indent:1})}
      ${row("EBIT",M.ebit,{total:1})}
      ${row("Corporate income tax",M.corpTax,{neg:1,indent:1})}
      ${row("Net income",M.netIncome,{total:1})}
      ${mrow("net margin (% NGR)",M.netIncome,M.agg.ngr)}
      ${sec("Cash flow")}
      ${krow("Opening cash",b=>fmt.usd(openCash(b)))}
      ${row("EBITDA",M.ebitda,{indent:1})}
      ${row("Corporate income tax",M.corpTax,{neg:1,indent:1})}
      ${row("Platform capex",capexArr,{neg:1,indent:1})}
      ${row("License upfronts",licUpArr,{neg:1,indent:1})}
      ${row("PSP reserve movement",M.reserveDelta,{neg:1,indent:1})}
      ${row("Financing — funding rounds",M.fundingIn,{indent:1})}
      ${krow("Closing cash",b=>`<span style="font-weight:650">${fmt.usd(closeCash(b))}</span>`)}
      ${sec("KPIs")}
      ${krow("Active depositors (avg/mo)",b=>fmt.num(S(M.agg.actives,b)/b.idx.length))}
      ${krow("New FTDs (quarter)",b=>fmt.num(S(M.agg.ftds,b)))}
      ${krow("Marketing spend (quarter)",b=>fmt.usd(S(M.agg.marketing,b)))}
      ${krow("Headcount (end)",b=>fmt.num(M.opex.heads[b.idx[b.idx.length-1]]))}
      ${krow("GGR per active per month",b=>fmt.usd(S(M.agg.ggr,b)/Math.max(1,S(M.agg.actives,b))))}
    </tbody>
  </table></div></div>`;
  el.innerHTML=html;
}

function renderCash(){
  const el=document.getElementById("tab-cash");
  const N=M.N;
  const rounds=[...(A.funding||[])].sort((a,b)=>a.month-b.month);
  const roundRows=rounds.map((f,i)=>{
    const from=Math.round(f.month)-1;
    const to=(i+1<rounds.length)? Math.round(rounds[i+1].month)-2 : N-1;
    let low=Infinity, lowT=from;
    for(let t=Math.max(0,from);t<=Math.min(N-1,to);t++){ if(M.cash[t]<low){low=M.cash[t];lowT=t;} }
    const cum=rounds.slice(0,i+1).reduce((s,x)=>s+(+x.amount||0),0);
    return `<tr>
      <td style="font-weight:650">${f.name}</td>

      <td>${fmt.usd(cum)}</td>
      <td class="${low<0?'neg':''}">${fmt.usd(low)} <span style="color:var(--ink-3)">at M${lowT+1}</span></td>
      <td style="text-align:left;white-space:normal;color:var(--ink-2);font-size:12px;min-width:260px">${f.note||""}</td>

  }).join("");
  el.innerHTML=`<h2>Cash Flow</h2>
  <p class="sub">EBITDA less platform capex, license upfronts, and the PSP rolling-reserve float (held ${A.wc.reserveMonths} months, then released) — funded by ${rounds.length} staged rounds totalling ${fmt.usd(M.totalFunding)}. Edit rounds in Assumptions § 1.</p>
  <div class="card"><h3>When to raise — the funding schedule</h3>
  <p class="note">Each round must land before the cash line approaches zero. "Lowest cash until next round" is the number to watch: if it goes red, the round is too small or too late. Start raising each round ~3 months before its month.</p>
  <div class="twrap"><table><thead><tr><th>Round</th><th>When</th><th>Amount</th><th>Raised so far</th><th>Lowest cash until next round</th><th>What it funds</th></tr></thead>

  <div class="tiles">
    <div class="tile"><div class="lbl">Total external need</div><div class="val">${fmt.usd(M.peakNeed)}</div><div class="delta">deepest cumulative burn — the minimum you must raise in total</div></div>
    <div class="tile"><div class="lbl">Minimum cash (funded plan)</div><div class="val">${fmt.usd(M.minCash)}</div><div class="delta">at month ${M.minCashMonth+1}${M.minCash<0?" — round too small or too late":""}</div></div>
    <div class="tile"><div class="lbl">EBITDA break-even</div><div class="val">${M.breakeven!=null?"M"+(M.breakeven+1):"—"}</div><div class="delta">sustained positive</div></div>
    <div class="tile"><div class="lbl">Cash at month 36</div><div class="val">${fmt.usd(M.cash[N-1])}</div><div class="delta">${M.cash[N-1]>A.meta.startingCapital?"capital returned":"still below starting capital"}</div></div>
    <div class="tile"><div class="lbl">PSP reserve held at M36</div><div class="val">${fmt.usd(M.reserveBal[N-1])}</div><div class="delta">cash locked at processors</div></div>
  </div>
  ${M.minCash<0?`<div class="warnbox">⚠ Cash goes negative at month ${M.minCashMonth+1}. Move a round earlier, raise ≈ ${fmt.usd(-M.minCash)} more, or slow the marketing ramp.</div>`:""}
  <div class="grid2">
    <div class="card"><h3>Cash balance with funding rounds</h3><div class="chart" id="ch-cash2"></div></div>
    <div class="card"><h3>Monthly net cash flow</h3><div class="chart" id="ch-ncf"></div></div>
  </div>
  <div class="card"><div class="twrap" style="max-height:480px;overflow:auto"><table id="cashTable"></table></div></div>`;
