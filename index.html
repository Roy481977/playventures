    [{name:"Cash",color:sColor(0),values:M.cash,kind:"area"}],
    {h:250,marks:rounds.map((f,i)=>({t:Math.round(f.month)-1,label:"R"+(i+1)}))});
  xyChart(document.getElementById("ch-ncf"),
    [{name:"Net CF",color:sColor(2),values:M.netcf,kind:"bar"}],{h:250});
  const tbl=el.querySelector("#cashTable");
  let html="<thead><tr><th>Month</th><th>Funding in</th><th>EBITDA</th><th>Corp tax</th><th>Platform capex</th><th>License upfronts</th><th>Reserve Δ</th><th>Reserve held</th><th>Net cash flow</th><th>Cash balance</th></tr></thead><tbody>";
  for(let t=0;t<N;t++){
    html+=`<tr><td>M${t+1}</td><td style="${M.fundingIn[t]?'font-weight:650':''}">${M.fundingIn[t]?fmt.usd(M.fundingIn[t]):"—"}</td><td class="${M.ebitda[t]<0?'neg':''}">${fmt.usd(M.ebitda[t])}</td>
      <td>${M.corpTax[t]?("−"+fmt.usd(M.corpTax[t])):"—"}</td>
      <td>${M.opex.platformCapex[t]?("−"+fmt.usd(M.opex.platformCapex[t])):"—"}</td>

  html+="</tbody>"; tbl.innerHTML=html;
}

function renderSim(){
  const el=document.getElementById("tab-sim");
  el.innerHTML=`<h2>Simulation</h2>
  <p class="sub">Stress the casino plan (Rain B2C and shared substance are unaffected here) without touching base assumptions. Presets or sliders; everything compares against the base scenario. Remember the VIP reality: top 1% of players = 35–60% of GGR, so real months are lumpier than any smooth model — the bear case is the honest planning floor.</p>
  <div class="toolbar"><div class="seg" id="presetSeg">
    <button data-p="base">Base</button><button data-p="bull">Bull</button><button data-p="bear">Bear</button>
  </div><span class="badge" id="simBadge"></span></div>
  <div class="card sliders"><h3>Drivers</h3><div class="fields" id="simFields"></div></div>
  <div class="kpi-cmp" id="simKpis"></div>
  <div class="grid2" style="margin-top:16px">
    <div class="card"><h3>Cash balance — scenario vs base</h3><div class="chart" id="ch-simcash"></div></div>
    <div class="card"><h3>Monthly EBITDA — scenario vs base</h3><div class="chart" id="ch-simebitda"></div></div>
  </div>`;
  const fieldsEl=el.querySelector("#simFields");
  const defs=[
    ["cpaMult","CPA (cost) ×",0.5,2,0.05],
    ["retMult","Retention ×",0.5,1.5,0.05],
    ["betMult","Player value ×  (engagement · VIP mix · game mix)",0.5,2,0.05],
    ["mktMult","Marketing budget ×",0.3,2,0.05],
    ["holdMult","Deposit hold ×",0.6,1.4,0.05],
    ["rsMult","Affiliate revshare ×",0.5,1.5,0.05]
  ];
  simLabels={};
  defs.forEach(([k,label,mn,mx,st])=>{
    const f=document.createElement("div"); f.className="f";
    const l=document.createElement("label"); f.appendChild(l);
    const inp=document.createElement("input"); inp.type="range"; inp.min=mn; inp.max=mx; inp.step=st; inp.value=SIM[k];
    const upd=()=>{ l.textContent=`${label} ${(+inp.value).toFixed(2)}`; };
    upd();
    simLabels[k]={el:l, base:()=>`${label} ${(+inp.value).toFixed(2)}`};
    inp.addEventListener("input",()=>{ SIM[k]=+inp.value; upd(); queueSim(); });
    f.appendChild(inp); fieldsEl.appendChild(f);
  });
  const bf=document.createElement("div"); bf.className="f";
  const bl=document.createElement("label"); bf.appendChild(bl);
  const bi=document.createElement("input"); bi.type="range"; bi.min=8; bi.max=30; bi.step=0.5;
  bi.value=SIM.bonusPct!=null?SIM.bonusPct:A.global.bonusPctGGR;
  const bupd=()=>{ bl.textContent=`Bonus cost % of GGR: ${(+bi.value).toFixed(1)}%`; }; bupd();
  simLabels.bonus={el:bl, base:()=>`Bonus cost % of GGR: ${(+bi.value).toFixed(1)}%`};
  bi.addEventListener("input",()=>{ SIM.bonusPct=+bi.value; bupd(); queueSim(); });
  bf.appendChild(bi); fieldsEl.appendChild(bf);
  el.querySelectorAll("#presetSeg button").forEach(b=>{
    b.onclick=()=>{
      const p=b.dataset.p;
      if(p==="base") Object.assign(SIM,{cpaMult:1,retMult:1,betMult:1,mktMult:1,bonusPct:null,holdMult:1,rsMult:1});
      if(p==="bull") Object.assign(SIM,{cpaMult:0.85,retMult:1.15,betMult:1.10,mktMult:1.25,bonusPct:16,holdMult:1.05,rsMult:1});
      if(p==="bear") Object.assign(SIM,{cpaMult:1.30,retMult:0.85,betMult:0.90,mktMult:0.80,bonusPct:22,holdMult:0.9,rsMult:1.1});
      renderSim();
    };
  });
  runSim();
}
let _st=null;
function queueSim(){ clearTimeout(_st); _st=setTimeout(runSim,200); }
function runSim(){
  const base=M;
  const sc=compute(A,SIM);
  const N=sc.N;
  const isBase=SIM.cpaMult===1&&SIM.retMult===1&&SIM.betMult===1&&SIM.mktMult===1&&SIM.bonusPct===null&&SIM.holdMult===1&&SIM.rsMult===1;
  const badge=document.getElementById("simBadge");
  if(badge) badge.textContent=isBase?"showing base scenario":"custom scenario vs base";
  // append the actual global figure each multiplier produces
  (()=>{
    const Ns=sc.N;
    const spendTot=sc.agg.marketing.reduce((x,y)=>x+y,0);
    const ftdTot=sc.agg.ftds.reduce((x,y)=>x+y,0);
    let m1w=0; sc.perGeo.forEach(g=>{ m1w+=g.ftds.reduce((x,y)=>x+y,0)*(g.r[1]||0); });
    const actuals={
      cpaMult:"→ blended CAC "+fmt.usd(ftdTot>0?spendTot/ftdTot:0,0)+" per depositor",
      retMult:"→ blended M1 retention "+fmt.pct(ftdTot>0?m1w/ftdTot:0,0),
      betMult:"→ GGR "+fmt.usd(sc.agg.actives[Ns-1]>0?sc.agg.ggr[Ns-1]/sc.agg.actives[Ns-1]:0,0)+" per active/mo — the outcome, not a dial you set",
      mktMult:"→ "+fmt.usd(sc.agg.marketing[Ns-1])+"/mo spend at M36 ("+fmt.usd(spendTot)+" total)",
      holdMult:"→ hold "+fmt.pct(sc.agg.deposits[Ns-1]>0?sc.agg.ggr[Ns-1]/sc.agg.deposits[Ns-1]:0,0)+" of deposits",
      rsMult:"→ effective revshare "+(A.global.affRevsharePct*SIM.rsMult).toFixed(0)+"% of NGR",
      bonus:"→ "+fmt.usd(sc.agg.bonus[Ns-1])+"/mo bonus cost at M36"
    };
    for(const k in actuals){ const sl=simLabels[k]; if(sl&&sl.el) sl.el.textContent=sl.base()+"  "+actuals[k]; }
  })();
  const kEl=document.getElementById("simKpis"); if(!kEl)return;
  function tile(lbl,scv,basev,fmtF,upGood){
    const d=scv-basev;
    const cls=d===0?"":((d>0)===upGood?"up":"down");
    return `<div class="tile"><div class="lbl">${lbl}</div><div class="val">${fmtF(scv)}</div>
      <div class="delta ${cls}">${isBase?"base":"base "+fmtF(basev)+" · "+(d>=0?"+":"−")+fmtF(Math.abs(d)).replace("−","")}</div></div>`;
  }
  kEl.innerHTML=
    tile("Cumulative EBITDA (36 mo)",sc.cumEbitdaArr[N-1],base.cumEbitdaArr[base.N-1],v=>fmt.usd(v),true)+
    tile("Y3 GGR run-rate",sc.agg.ggr[N-1]*12,base.agg.ggr[base.N-1]*12,v=>fmt.usd(v),true)+
    tile("Peak funding need",sc.peakNeed,base.peakNeed,v=>fmt.usd(v),false)+
    `<div class="tile"><div class="lbl">Break-even</div><div class="val">${sc.breakeven!=null?"M"+(sc.breakeven+1):"—"}</div><div class="delta">base ${base.breakeven!=null?"M"+(base.breakeven+1):"—"}</div></div>`+
    tile("Cash at M36",sc.cash[N-1],base.cash[base.N-1],v=>fmt.usd(v),true)+
    tile("Actives at M36",sc.agg.actives[N-1],base.agg.actives[base.N-1],v=>fmt.num(v),true);
  const cEl=document.getElementById("ch-simcash");
  if(cEl) xyChart(cEl,[
    {name:"Base",color:sColor(0),values:base.cash},
    {name:"Scenario",color:sColor(1),values:sc.cash,kind:"area"}],{h:250});
  const eEl=document.getElementById("ch-simebitda");
  if(eEl) xyChart(eEl,[
    {name:"Base",color:sColor(0),values:base.ebitda},
    {name:"Scenario",color:sColor(1),values:sc.ebitda}],{h:250});
}

/* Persistence: POST to the defaults API when deployed; file fallback otherwise. */
async function persistDefaults(json){
  if(!location.protocol.startsWith("http")) return {mode:"local-file"};
  const r=await fetch("/api/defaults",{method:"POST",headers:{"Content-Type":"application/json"},body:json});
  if(!r.ok) throw new Error("save failed: "+r.status);
  return {mode:"db"};
}
function showDefToast(msg){
  let t=document.getElementById("defToast");
  if(!t){ t=document.createElement("div"); t.id="defToast";
    t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink-1);color:var(--surface-1);padding:12px 20px;border-radius:12px;font-size:13px;z-index:200;max-width:560px;box-shadow:0 8px 30px rgba(0,0,0,.25)";
    document.body.appendChild(t); }
  t.textContent=msg; t.style.display="block";
  clearTimeout(t._h); t._h=setTimeout(()=>{t.style.display="none";},9000);
}
document.getElementById("btnSaveDefault").onclick=async()=>{
  const json=JSON.stringify(A,null,2);
  try{
    const res=await persistDefaults(json);
    if(res.mode==="db"){ showDefToast("Saved as the new default \u2014 versioned in the database. Every load of this page now opens with these numbers."); return; }
  }catch(e){}
  const blob=new Blob([json],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="luckymay-model-defaults.json";
  a.click(); URL.revokeObjectURL(a.href);
  showDefToast("Database unreachable \u2014 saved locally as luckymay-model-defaults.json instead. Pull it into Claude to bake it in.");
};
document.getElementById("btnTheme").onclick=()=>{
  const r=document.documentElement;
  r.dataset.theme = r.dataset.theme==="dark" ? "light" : "dark";
  renderTab(activeTab);
};

    <div class="tile hero"><div class="lbl">Year-3 revenue (${pmYearLbl(2)})</div><div class="val">${fmt.usd(revY[2])}</div><div class="delta">exit ARR ${fmt.usd(arrExit)}</div></div>
    <div class="tile"><div class="lbl">Active traders M${N}</div><div class="val">${fmt.num(P.actives[N-1])}</div><div class="delta">${fmt.num(P.newU[N-1])} new / mo</div></div>
    <div class="tile"><div class="lbl">Year-3 EBITDA (pre-shared costs)</div><div class="val">${fmt.usd(ebY[2])}</div><div class="delta ${ebY[2]>=0?'up':'down'}">${revY[2]>0?fmt.pct(ebY[2]/revY[2],0)+" margin":""}</div></div>
    <div class="tile"><div class="lbl">Standalone break-even</div><div class="val">${P.breakeven!=null?"M"+(P.breakeven+1):"—"}</div><div class="delta">${P.breakeven!=null?pmCal(P.breakeven):"not in horizon"}</div></div>
    <div class="tile"><div class="lbl">LTV : CPA</div><div class="val">${fmt.x(P.unit.cpa>0?P.unit.ltv/P.unit.cpa:0)}</div><div class="delta">LTV ${fmt.usd(P.unit.ltv,0)} · CPA ${fmt.usd(P.unit.cpa,0)}</div></div>
    <div class="tile"><div class="lbl">Y3 marketing % of revenue</div><div class="val">${revY[2]>0?fmt.pct(mktY[2]/revY[2],0):"—"}</div><div class="delta">${fmt.usd(mktY[2])} spend</div></div>
    <div class="tile"><div class="lbl">Cumulative EBITDA (36 mo)</div><div class="val">${fmt.usd(P.cumE[N-1])}</div><div class="delta ${P.cumE[N-1]>=0?'up':'down'}">standalone, before shared costs</div></div>
    <div class="tile"><div class="lbl">Peak standalone burn</div><div class="val">${(()=>{let c=0,mx=0;for(let t=0;t<N;t++){c+=P.netcf[t];if(-c>mx)mx=-c;}return fmt.usd(mx);})()}</div><div class="delta">own funding need as its own business</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Monthly revenue</h3><div class="chart" id="pm-rev"></div></div>
    <div class="card"><h3>Active traders</h3><div class="chart" id="pm-act"></div></div>
    <div class="card"><h3>Marketing spend vs revenue</h3><div class="chart" id="pm-mkt"></div></div>
    <div class="card"><h3>Monthly EBITDA (before shared substance)</h3><div class="chart" id="pm-eb"></div></div>
    <div class="card"><h3>Implied trading volume</h3><div class="chart" id="pm-vol"></div></div>
    <div class="card"><h3>Estimated fiat deposits & PSP</h3><p class="note">Deposits ≈ gross fees × ${A.pm.psp.depositMultiple}×. PSP fee ${A.pm.psp.feePct}% is charged to the end user unless the absorption lever below is raised.</p><div class="chart" id="pm-dep"></div></div>
  </div>
  <div class="card"><h3>Annual view</h3><div class="twrap"><table id="pm-annual"></table></div></div>
  <div class="card sliders"><h3>Assumptions — Rain B2C</h3><div class="fields" id="pm-edit"></div>
  <p class="note" style="margin-top:8px">Spend growth phases are % month-on-month for consecutive blocks of months (block lengths ${A.pm.growth.map(g=>g.m).join(" / ")}). Segment mix: ${A.pm.hvSharePct}% of users are residual global high-value traffic (LTV $${A.pm.ltvHV} / CPA $${A.pm.cpaHV}); the rest are core international markets.</p></div>`;

  xyChart(document.getElementById("pm-rev"),
    [{name:"Net protocol revenue",color:sColor(0),values:P.npr,kind:"area"},
     {name:"Treasury yield",color:sColor(3),values:P.treasury}],{h:250});
  xyChart(document.getElementById("pm-act"),
    [{name:"Active traders",color:sColor(2),values:P.actives,kind:"area",fmtV:v=>fmt.num(v)}],{h:250,fmt:v=>fmt.num(v)});
  xyChart(document.getElementById("pm-mkt"),
    [{name:"Acquisition + builders + brand",color:sColor(1),values:P.mkt},
     {name:"Total revenue",color:sColor(0),values:P.totalRev}],{h:250});
  xyChart(document.getElementById("pm-eb"),
    [{name:"PM EBITDA",color:sColor(2),values:P.ebitda,kind:"bar"}],{h:250});
  xyChart(document.getElementById("pm-vol"),
    [{name:"Volume",color:sColor(6),values:P.vol,kind:"area"}],{h:250});
  xyChart(document.getElementById("pm-dep"),
    [{name:"Deposits (est.)",color:sColor(4),values:P.deposits},
     {name:"PSP absorbed",color:sColor(7),values:P.psp,kind:"bar"}],{h:250});

  const tbl=el.querySelector("#pm-annual");
  const rows=[
    ["Net protocol revenue",P.npr],["Treasury yield",P.treasury],["Total revenue",P.totalRev,true],
    ["COGS (infra + PSP absorbed)",P.cogs,false,true],["Marketing & builders",P.mkt,false,true],
    ["Product & engineering",P.prodEng,false,true],["Licence + duty",P.duty.map((d,i)=>d+P.licAnnual[i]),false,true],
    ["EBITDA (pre-shared costs)",P.ebitda,true]];
  let h="<thead><tr><th></th>"+[0,1,2].map(y=>`<th>${pmYearLbl(y)}</th>`).join("")+"</tr></thead><tbody>";
  for(const [n,a,tot,neg] of rows){
    h+=`<tr class="${tot?'total':''}"><td>${n}</td>`+[0,1,2].map(y=>{
      const v=ySum(a,y); return `<td class="${(!neg&&v<0)?'neg':''}">${neg?"−"+fmt.usd(Math.abs(v)):fmt.usd(v)}</td>`;}).join("")+"</tr>";
  }
  tbl.innerHTML=h+"</tbody>";

  const ed=el.querySelector("#pm-edit"); const p=A.pm;
  const add=(lbl,inp,unit)=>ed.appendChild(field(lbl,inp,unit));
  add("Pre-launch seed users",numInput(p,"seedUsers",{step:500}),"users");
  add("Month-1 acquisition spend",numInput(p,"spend1",{step:10000}),"$/mo");
  p.growth.forEach((g,i)=>add(`Spend growth — phase ${i+1} (${g.m} mo)`,numInput(g,"pct",{step:0.5}),"%/mo"));
  add("Organic surplus at launch",numInput(p,"organic0",{step:1}),"% of paid");
  add("LTV — core markets",numInput(p,"ltvCore",{step:5}),"$");
  add("LTV — residual high-value",numInput(p,"ltvHV",{step:10}),"$");
  add("Residual high-value share",numInput(p,"hvSharePct",{step:1}),"% users");
  add("User lifetime",numInput(p,"lifetimeMonths",{step:1}),"months");
  add("CPA — core markets",numInput(p,"cpaCore",{step:5}),"$");
  add("CPA — residual high-value",numInput(p,"cpaHV",{step:10}),"$");
  add("Rain net take rate",numInput(p,"takeRatePct",{step:0.05}),"% of volume");
  add("Overall marketplace fee",numInput(p,"overallFeePct",{step:0.05}),"% of volume");
  add("Infra COGS",numInput(p,"cogsPctNPR",{step:0.5}),"% of net revenue");
  add("Builders programme",numInput(p,"buildersPctVol",{step:0.01}),"% of volume");
  add("Brand & PR month 1",numInput(p,"brand1",{step:1000}),"$/mo");
  add("Brand growth",numInput(p,"brandGrowthPct",{step:0.5}),"%/mo");
  add("Initial TVL",numInput(p,"tvl0",{step:1000000}),"$");
  add("TVL capture of volume",numInput(p,"tvlCapturePct",{step:1}),"%");
  add("Treasury yield",numInput(p,"treasuryYieldPct",{step:0.1}),"%/yr");
  add("Regulatory duty",numInput(p,"dutyPct",{step:0.01}),"% of commission");
  add("PM licence upfront",numInput(p.licence,"upfront",{step:1000}),"$");
  add("PM licence annual",numInput(p.licence,"annual",{step:1000}),"$/yr");
  add("PSP fee",numInput(p.psp,"feePct",{step:0.05}),"% of deposits");
  add("PSP share absorbed by Rain",numInput(p.psp,"absorbedPct",{step:5}),"%");
  add("Deposits ÷ gross fees",numInput(p.psp,"depositMultiple",{step:0.1}),"×");
  add("Product & eng — Y1",numInput(p.personnel.prodEng,0,{step:5000}),"$/mo");
  add("Product & eng — Y2",numInput(p.personnel.prodEng,1,{step:5000}),"$/mo");
  add("Product & eng — Y3",numInput(p.personnel.prodEng,2,{step:5000}),"$/mo");
}

/* ============================================================
   TAB: CONSOLIDATED — GROUP P&L
   ============================================================ */
function renderGroup(){
  const el=document.getElementById("tab-group");
  const G=MG, P=MPM, N=G.N;
  const rounds=[...(A.funding||[])].sort((a,b)=>a.month-b.month);
  const revY=[0,1,2].map(y=>ySum(G.revenue,y));
  const ebY=[0,1,2].map(y=>ySum(G.ebitda,y));
  const casNgrY=[0,1,2].map(y=>ySum(M.agg.ngr,y));
  const pmRevY=[0,1,2].map(y=>ySum(P.totalRev,y));
  el.innerHTML=`
  <h2>Consolidated — one Gibraltar company, two licences</h2>
  <p class="sub">Two businesses, each running its own P&amp;L, on one shared Gibraltar backbone. <b>Playmarkets</b> (B2C Gaming Operator Licence) is a crypto-first casino — ~75–80% of GGR via crypto rails (Crypto global, India, SEA), originals-led game mix, low payment costs. <b>Rain B2C</b> (Prediction Market Authorisation) is the prediction-markets trader model. Consolidation adds the shared substance layer: local office &amp; staff, management &amp; compliance, external providers. Both operations launch January ${A.meta.startYear||2027}. Group revenue = casino NGR + Rain B2C revenue.</p>
  <div class="tiles" style="margin-top:10px">
    <div class="tile hero"><div class="lbl">Year-3 group revenue (${pmYearLbl(2)})</div><div class="val">${fmt.usd(revY[2])}</div><div class="delta">casino ${fmt.usd(casNgrY[2])} · prediction ${fmt.usd(pmRevY[2])}</div></div>
    <div class="tile"><div class="lbl">Year-3 group EBITDA</div><div class="val">${fmt.usd(ebY[2])}</div><div class="delta ${ebY[2]>=0?'up':'down'}">${revY[2]>0?fmt.pct(ebY[2]/revY[2],0)+" margin":""}</div></div>
    <div class="tile"><div class="lbl">Group EBITDA break-even</div><div class="val">${G.breakeven!=null?"M"+(G.breakeven+1):"—"}</div><div class="delta">${G.breakeven!=null?pmCal(G.breakeven)+" · min cash "+fmt.usd(G.minCash):"not in horizon"}</div></div>
    <div class="tile"><div class="lbl">Raise plan</div><div class="val">${fmt.usd(G.totalFunding)}</div><div class="delta">${rounds.length} rounds · peak need ${fmt.usd(G.peakNeed)}</div></div>
    <div class="tile"><div class="lbl">Cash at M${N}</div><div class="val">${fmt.usd(G.cash[N-1])}</div><div class="delta">${G.cash[N-1]>=0?"funded through plan":"needs more funding"}</div></div>
    <div class="tile"><div class="lbl">Customers M${N}</div><div class="val">${fmt.num(M.agg.actives[N-1]+P.actives[N-1])}</div><div class="delta">${fmt.num(M.agg.actives[N-1])} depositors · ${fmt.num(P.actives[N-1])} traders</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Monthly revenue by operation</h3><div class="chart" id="g-rev"></div></div>
    <div class="card"><h3>Monthly EBITDA bridge</h3><p class="note">Casino + prediction markets − shared Gibraltar substance = group.</p><div class="chart" id="g-eb"></div></div>
    <div class="card"><h3>Group cash & funding rounds</h3><div class="chart" id="g-cash"></div></div>
    <div class="card"><h3>Cumulative group EBITDA</h3><div class="chart" id="g-cum"></div></div>
  </div>
  <div class="card"><h3>Annual consolidated P&amp;L</h3><div class="twrap"><table id="g-annual"></table></div></div>
  <div class="card sliders"><h3>Shared Gibraltar substance ($/month, by year)</h3><div class="fields" id="g-edit"></div>
  <p class="note" style="margin-top:8px">Local Gibraltar operations budgeted at ≈€600K in year 1, reducing as setup completes. Each operation carries its own licence (application + annual fee) and 0.15% regulatory duty inside its own P&amp;L; corporate tax 15% applies to taxable profits (no tax payable in-plan after loss relief).</p></div>
  <div class="card sliders"><h3>Funding rounds</h3><div class="fields" id="g-fund"></div></div>`;

  xyChart(document.getElementById("g-rev"),
    [{name:"Playmarkets NGR",color:sColor(1),values:M.agg.ngr},
     {name:"Rain B2C revenue",color:sColor(0),values:P.totalRev}],{stacked:true,h:250});
  xyChart(document.getElementById("g-eb"),
    [{name:"Group EBITDA",color:sColor(2),values:G.ebitda,kind:"bar"},
     {name:"Casino EBITDA",color:sColor(1),values:M.ebitda},
     {name:"PM EBITDA",color:sColor(0),values:P.ebitda},
     {name:"Shared substance",color:sColor(7),values:G.shared.map(x=>-x)}],{h:250});
  xyChart(document.getElementById("g-cash"),
    [{name:"Group cash",color:sColor(0),values:G.cash,kind:"area"}],
    {h:250,marks:rounds.map((f,i)=>({t:Math.round(f.month)-1,label:"R"+(i+1)}))});
  xyChart(document.getElementById("g-cum"),
    [{name:"Cumulative EBITDA",color:sColor(3),values:G.cumE,kind:"area"}],{h:250});

  const tbl=el.querySelector("#g-annual");
  const casMkt=[0,1,2].map(y=>ySum(M.mktTotal,y));
  const rowsA=[
    {s:"Playmarkets — crypto casino"},
    {n:"GGR",a:y=>ySum(M.agg.ggr,y)},
    {n:"Bonuses & jackpots",a:y=>ySum(M.agg.bonus,y),neg:true},
    {n:"NGR",a:y=>ySum(M.agg.ngr,y),b:true},
    {n:"Casino COGS (content, payments, KYC, tech, duty)",a:y=>ySum(M.cogsTotal,y),neg:true},
    {n:"Casino marketing (CPA + revshare + brand)",a:y=>casMkt[y],neg:true},
    {n:"Casino opex (personnel, ops, licence, G&A)",a:y=>ySum(M.opexTotal,y),neg:true},
    {n:"Casino EBITDA",a:y=>ySum(M.ebitda,y),tot:true},
    {s:"Rain B2C — prediction markets"},
    {n:"Net protocol revenue + treasury",a:y=>pmRevY[y]},
    {n:"PM COGS, marketing, product, licence & duty",a:y=>pmRevY[y]-ySum(P.ebitda,y),neg:true},
    {n:"PM EBITDA",a:y=>ySum(P.ebitda,y),tot:true},
    {s:"Group"},
    {n:"Group revenue",a:y=>revY[y],b:true},
    {n:"Shared Gibraltar substance",a:y=>ySum(G.shared,y),neg:true},
    {n:"Group EBITDA",a:y=>ebY[y],tot:true},
    {n:"Group EBITDA margin",custom:y=>revY[y]>0?fmt.pct(ebY[y]/revY[y],0):"—"},
    {n:"Cumulative EBITDA",a:y=>G.cumE[Math.min(N-1,y*12+11)]}
  ];
  let h="<thead><tr><th></th>"+[0,1,2].map(y=>`<th>${pmYearLbl(y)}</th>`).join("")+"</tr></thead><tbody>";
  for(const r of rowsA){
    if(r.s){ h+=`<tr class="section"><td colspan="4">${r.s}</td></tr>`; continue; }
    h+=`<tr class="${r.tot?'total':''}"><td>${r.n}</td>`+[0,1,2].map(y=>{
      if(r.custom) return `<td>${r.custom(y)}</td>`;
      const v=r.a(y);
      return `<td class="${(!r.neg&&v<0)?'neg':''}">${r.neg?"−"+fmt.usd(Math.abs(v)):fmt.usd(v)}</td>`;
    }).join("")+"</tr>";
  }
  tbl.innerHTML=h+"</tbody>";

  const ed=el.querySelector("#g-edit");
  const addf=(lbl,inp,unit)=>ed.appendChild(field(lbl,inp,unit));
  ["Y1","Y2","Y3"].forEach((yl,i)=>addf(`Management & compliance — ${yl}`,numInput(A.shared.mgmtCompliance,i,{step:5000}),"$/mo"));
  ["Y1","Y2","Y3"].forEach((yl,i)=>addf(`External providers — ${yl}`,numInput(A.shared.externalProviders,i,{step:2500}),"$/mo"));
  ["Y1","Y2","Y3"].forEach((yl,i)=>addf(`Local Gibraltar operations — ${yl}`,numInput(A.shared.localOps,i,{step:2000}),"$/mo"));
  const fd=el.querySelector("#g-fund");
  (A.funding||[]).forEach((f,i)=>{
    fd.appendChild(field(`${f.name||("Round "+(i+1))} — month`,numInput(f,"month",{step:1,min:1}),"M#"));
    fd.appendChild(field(`${f.name||("Round "+(i+1))} — amount`,numInput(f,"amount",{step:500000}),"$"));
  });
}

/* ============================================================
   Router
   ============================================================ */
function renderTab(id){
  if(!M) recompute();
  if(id==="group")renderGroup();
  else if(id==="pm")renderPM();
  else if(id==="dashboard")renderDashboard();
  else if(id==="assumptions")renderAssumptions();
  else if(id==="games")renderGames();
  else if(id==="geos")renderGeos();
  else if(id==="marketing")renderMarketing();
  else if(id==="team")renderTeam();
  else if(id==="milestones")renderMilestones();
  else if(id==="cohorts")renderCohorts();
  else if(id==="pnl")renderPnl();
  else if(id==="finance")renderFinance();
  else if(id==="cash")renderCash();
  else if(id==="sim")renderSim();
}
recompute();
document.querySelector('nav button[data-tab="group"]').classList.add("on");
document.getElementById("tab-group").classList.add("on");
renderTab("group");
/* Load the latest saved defaults from the database (deployed mode only). */
(async()=>{
  if(!location.protocol.startsWith("http")) return;
  try{
    const r=await fetch("/api/defaults",{cache:"no-store"});
    if(!r.ok) return;
    const j=await r.json();
    if(j&&j.meta&&j.geos&&j.games&&j.personnel){ A=JSON.parse(JSON.stringify(j)); refresh(); }
  }catch(e){}
})();
</script>
